<script>

// EmailJS — for sending the signed-contract copy to the client
const EMAILJS_PUBLIC_KEY  = 'JfYv9AU0fN__BBKEO';
const EMAILJS_SERVICE_ID  = 'service_mpegg49';

try { if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); } catch(_) {}

function getId(){ return new URLSearchParams(location.search).get('id') || ''; }
function fmtMoney(n){ return '₪' + Math.abs(n).toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return ''; try { return new Date(s).toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'}); } catch(e){ return s; } }
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function _ctrKindLabel(c){
  const songs = (c.songs && c.songs.length) ? c.songs : (c.songTitle ? [c.songTitle] : []);
  const k = c.projectKind || (songs.length >= 7 ? 'album' : songs.length >= 4 ? 'ep' : songs.length > 1 ? 'multi' : 'single');
  if (k === 'album') return { metaLabel: 'אלבום (' + songs.length + ' שירים)', plural: true };
  if (k === 'ep')    return { metaLabel: 'EP (' + songs.length + ' שירים)',      plural: true };
  if (k === 'multi') return { metaLabel: songs.length + ' שירים',                plural: true };
  return { metaLabel: 'הפקת סינגל', plural: false };
}

// Itemized price breakdown when the contract has the new fields;
// otherwise falls back to the single legacy `basePrice` line.
function _ctrPriceBreakdown(c){
  const r = parseFloat(c.priceRecording);
  const m = parseFloat(c.priceMastering);
  const p = parseFloat(c.priceProductionMix);
  if (!isNaN(r) || !isNaN(m) || !isNaN(p)) {
    const rec = isNaN(r) ? 0 : r;
    const mas = isNaN(m) ? 0 : m;
    const prd = isNaN(p) ? 0 : p;
    return { itemized: true, recording: rec, mastering: mas, productionMix: prd, base: rec + mas + prd };
  }
  return { itemized: false, base: parseFloat(c.basePrice) || 0 };
}

const _CK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const _LOGO = '<svg viewBox="70 180 830 520" aria-hidden="true"><path d="M99 657 C220 470 420 250 523 214 C562 200 470 420 387 664 C420 520 560 330 645 346 C700 356 610 520 637 581 C655 610 730 540 781 500" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><circle cx="858" cy="492" r="36" fill="#fff"/></svg>';
function _discAmt(sub, d){
  if (!d || !(parseFloat(d.v) > 0)) return 0;
  const a = d.mode === 'pct' ? Math.round(sub * Math.min(100, parseFloat(d.v)) / 100) : Math.round(parseFloat(d.v));
  return Math.max(0, Math.min(sub, a));
}
function render(c){
  // v631: calm and friendly — what you get (3 tiles), 4 things worth knowing, sign
  const songs = (c.songs && c.songs.length) ? c.songs : (c.songTitle ? [c.songTitle] : []);
  const kind = _ctrKindLabel(c);
  const songsLabel = songs.length <= 1 ? (songs[0] || '—') : songs.join(' · ');
  const breakdown = _ctrPriceBreakdown(c);
  const extras = c.extras || [];
  const sub = breakdown.base + extras.reduce(function(s,e){ return s + (parseFloat(e.price)||0); }, 0);
  const disc = _discAmt(sub, c.discount), total = sub - disc;
  const halfA = Math.round(total / 2), halfB = total - halfA;
  const producer = escHtml(c.producerName || 'אליאור רביד');
  const first = escHtml(String(c.clientName || '').trim().split(' ')[0]);
  const signed = !!(c.signature && c.signature.dataUrl);
  const ic = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  const tiles = [
    [ic('<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'), 'הקלטה<br>והפקה'],

// ===== PDF-only layout =====
// Builds a dedicated, A4-tight DOM tree off-screen — used only as the

// the PDF stays compact, single-page, with visible signatures and
// clean RTL (which html2canvas struggles with on the live layout).
function buildPdfPrintable(c){
  const songs = (c.songs && c.songs.length) ? c.songs : (c.songTitle ? [c.songTitle] : []);
  const kind = _ctrKindLabel(c);

  const breakdown = _ctrPriceBreakdown(c);
  const extrasTotal = (c.extras || []).reduce(function(s,e){ return s + (parseFloat(e.price)||0); }, 0);
  const sub = breakdown.base + extrasTotal, disc = _discAmt(sub, c.discount);
  const total = sub - disc;
  const halfA = Math.round(total / 2);
  const halfB = total - halfA;

  const rightsTarget = kind.plural ? 'השירים (מילים ולחן)' : 'השיר (מילים ולחן)';
  let rightsHtml;

    const parts = c.splitShares.filter(function(s){ return s.name && s.percent > 0; })
                               .map(function(s){ return s.percent + '% ' + escHtml(s.name); });
    rightsHtml = 'זכויות הכתיבה של ' + rightsTarget + ' מתחלקות: ' + parts.join(' · ') + ', ורשומות בהתאם באקו"ם.';
  } else {
    rightsHtml = 'זכויות הכתיבה של ' + rightsTarget + ' רשומות על שם <b>' + escHtml(c.producerName || 'אליאור רביד') + '</b> באקו"ם.';

        '<div style="font-family:\'Rubik\',\'Heebo\',sans-serif;font-size:14px;font-weight:900;color:#161c45;margin-top:3px">' + escHtml(clientFullName) + '</div>' +
        (clientWhen ? '<div style="font-size:10px;color:#6b7299;margin-top:2px">' + clientWhen + '</div>' : '') +
      '</div>' +
    '</div>' +

    '<div style="text-align:center;margin-top:14px;padding-top:8px;border-top:1px solid rgba(37,46,107,0.25);color:#6b7299;font-size:10px;font-weight:600">סיכום הפקה של <b>אליאור רביד</b> · מפיק מוזיקלי</div>';

  return wrap;
}

// ===== Signature pad =====
let _sigCtx = null, _sigCanvas = null, _sigDrawing = false, _sigLastX = 0, _sigLastY = 0, _sigDirty = false;

function initSignaturePad(){
  _sigCanvas = document.getElementById('sig-canvas');
  if (!_sigCanvas) return;
  function fit(){
    const rect = _sigCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    _sigCanvas.width = Math.max(1, rect.width * dpr);
    _sigCanvas.height = Math.max(1, rect.height * dpr);
    _sigCtx = _sigCanvas.getContext('2d');
    _sigCtx.scale(dpr, dpr);
    _sigCtx.lineWidth = 2.4;
    _sigCtx.lineCap = 'round';
    _sigCtx.lineJoin = 'round';
    _sigCtx.strokeStyle = '#161c45';
  }
  fit();
  function pos(e){
    const r = _sigCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }
  function start(e){ e.preventDefault(); _sigDrawing = true; const p = pos(e); _sigLastX = p.x; _sigLastY = p.y; }
  function move(e){
    if (!_sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    _sigCtx.beginPath();
    _sigCtx.moveTo(_sigLastX, _sigLastY);
    _sigCtx.lineTo(p.x, p.y);
    _sigCtx.stroke();
    _sigLastX = p.x; _sigLastY = p.y;
    if (!_sigDirty) { _sigDirty = true; const hint = document.getElementById('sig-hint'); if (hint) hint.style.opacity = '0'; }
  }
  function end(){ _sigDrawing = false; }
  _sigCanvas.addEventListener('touchstart', start, {passive: false});
  _sigCanvas.addEventListener('touchmove', move, {passive: false});
  _sigCanvas.addEventListener('touchend', end);
  _sigCanvas.addEventListener('touchcancel', end);
  _sigCanvas.addEventListener('mousedown', start);
  _sigCanvas.addEventListener('mousemove', move);
  _sigCanvas.addEventListener('mouseup', end);
  _sigCanvas.addEventListener('mouseleave', end);
}
function clearSig(){
  if (!_sigCtx || !_sigCanvas) return;
  _sigCtx.clearRect(0, 0, _sigCanvas.width, _sigCanvas.height);
  _sigDirty = false;
  const hint = document.getElementById('sig-hint'); if (hint) hint.style.opacity = '1';
}

async function submitSignature(){
  if (!_sigDirty) { alert('נא לחתום באזור החתימה'); return; }
  const name = (document.getElementById('signer-name').value || '').trim();
  if (!name) { alert('נא להזין שם מלא'); return; }
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.textContent = 'שולח…';
  const dataUrl = _sigCanvas.toDataURL('image/png');
  const id = getId();
  try {
    // Try anonymous auth first so writes are allowed under rules that
    // require auth != null. Harmless if it fails.
    try { await firebase.auth().signInAnonymously(); } catch(_) {}
    // Fetch current contracts via SDK, mark the one with `id` as signed,
    // push the whole array back at studio_data/contracts.
    const snap = await db.ref('studio_data/contracts').once('value');
    const data = snap.val();
    if (!data) throw new Error('not-found');
    const arr = Array.isArray(data) ? data : Object.values(data);
    const idx = arr.findIndex(x => x && x.id === id);
    if (idx < 0) throw new Error('not-found');
    arr[idx].signature = { dataUrl: dataUrl, clientName: name, signedAt: Date.now() };
    arr[idx].status = 'signed';
    arr[idx].updatedAt = Date.now();
    await db.ref().update({
      'studio_data/contracts': arr,
      'studio_meta/contracts': Date.now() // nudges producer's device to re-sync
    });
    render(arr[idx]);
    window.scrollTo({top: 0, behavior: 'smooth'});
    setTimeout(function(){ openEmailModal(name); }, 700);
  } catch(err) {
    console.error('signature submit failed:', err);
    btn.disabled = false;
    btn.textContent = 'יוצאים לדרך — מאשר/ת וחותם/ת';
    const code = err && (err.code || err.message) || err;
    alert('שגיאה בשליחה: ' + code + '\nנסה שוב או רענן.');
  }
}

// ===== Email-copy popup =====
function openEmailModal(clientName){
  closeEmailModal();
  const wrap = document.createElement('div');
  wrap.id = 'email-modal';
  wrap.className = 'email-modal-overlay';
  wrap.dataset.clientName = clientName || '';
  wrap.innerHTML =
    '<div class="email-modal" role="dialog" aria-modal="true">' +
      '<div class="email-modal-icon">' + _CK + '</div>' +
      '<h3>נחתם. רוצה עותק במייל?</h3>' +
      '<div class="email-modal-sub">נשלח אליך PDF של הסיכום החתום.</div>' +
      '<input id="email-input" type="email" placeholder="your@email.com" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false">' +
      '<div class="email-modal-actions">' +
        '<button class="email-skip" type="button" onclick="closeEmailModal()">לא, תודה</button>' +
        '<button class="email-send" id="email-send-btn" type="button" onclick="sendContractEmail()">שלח לי</button>' +
      '</div>' +
      '<div id="email-result" class="email-result"></div>' +
    '</div>';
  document.body.appendChild(wrap);
  setTimeout(function(){
    const i = document.getElementById('email-input');
    if (i) {
      i.focus();
      i.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendContractEmail(); });
    }
  }, 180);

  // Pre-generate the PDF + upload in the background while the user
  // is reading and typing their email. By the time they click "שלח",
  // the file is already hosted and we only wait for the EmailJS call.
  const safeName = (clientName || 'signed').replace(/[^֐-׿a-zA-Z0-9\s_-]/g, '').trim() || 'signed';
  const filename = 'הסכם - ' + safeName + '.pdf';
  wrap._pdfFilename = filename;
  wrap._pdfPromise = (async function(){
    const blob = await generateContractPdf(filename);
    const url  = await uploadPdfTemporary(blob, filename);
    return { url: url, filename: filename };
  })().catch(function(err){ return { error: err }; });

  // Auto-CC the producer with the same PDF the client gets (or would
  // get). Fires regardless of whether the client chooses to receive
  // a copy, so the producer always has a record.
  wrap._pdfPromise.then(function(result){
    if (!result || result.error) return;
    if (typeof emailjs === 'undefined') return;
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      client_name: clientName || 'לקוח',
      client_email: PRODUCER_EMAIL,
      contract_link: window.location.href,
      contract_pdf_url: result.url,
      contract_pdf_name: result.filename
    }).catch(function(e){ console.error('producer cc failed:', e); });
  });
}

function closeEmailModal(){
  const m = document.getElementById('email-modal');
  if (m) m.remove();
}

// Generate a PDF Blob of the signed contract — drives html2canvas
// and jsPDF directly (instead of via the html2pdf wrapper) so we can
// surface the real failure mode if the canvas comes back empty, and
// guarantee a single-page A4 by fitting the canvas into the page.
async function generateContractPdf(filename){
  const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (typeof html2canvas === 'undefined') throw new Error('html2canvas missing');
  if (!jsPDFCtor) throw new Error('jsPDF missing');

  const c = window._currentContract;
  if (!c) throw new Error('contract not loaded');

  const el = buildPdfPrintable(c);
  document.body.appendChild(el);

  const overlay = document.getElementById('email-modal');
  const prevBg = overlay ? overlay.style.background : null;
  if (overlay) overlay.style.background = '#f6f7fb';

  try {
    // Wait for web fonts to load — otherwise the snapshot may use a
    // fallback font and render at the wrong size, or not render at all.
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch(_) {}
    }
    // Wait for embedded signature <img> tags (data: URLs) to decode.
    const imgs = Array.from(el.querySelectorAll('img'));
    await Promise.all(imgs.map(function(img){
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(function(resolve){
        img.onload = resolve;
        img.onerror = resolve;
        setTimeout(resolve, 2000);
      });
    }));
    // Two paint ticks so layout + fonts apply.
    await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });

    const canvas = await html2canvas(el, {
      scale: 1.0,
      useCORS: true,
      backgroundColor: '#f6f7fb',
      letterRendering: true,
      logging: false,
      windowWidth: document.documentElement.clientWidth,
      windowHeight: document.documentElement.clientHeight
    });
    if (!canvas || !canvas.width || !canvas.height) {
      throw new Error('canvas blank (' + (canvas && canvas.width) + 'x' + (canvas && canvas.height) + ')');
    }

    // EmailJS Personal caps attachments at 500KB. The grown contract
    // (extra obligation/musician sections) pushed past that at higher
    // settings, so keep scale modest and quality on the lower side.
    const imgData = canvas.toDataURL('image/jpeg', 0.6);
    const pdf = new jsPDFCtor({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 8;
    const maxW = pageW - margin * 2;
    const maxH = pageH - margin * 2;
    const ratio = canvas.height / canvas.width;
    let imgW = maxW;
    let imgH = imgW * ratio;
    if (imgH > maxH) { imgH = maxH; imgW = imgH / ratio; }
    const x = (pageW - imgW) / 2;
    pdf.addImage(imgData, 'JPEG', x, margin, imgW, imgH, undefined, 'FAST');
    return pdf.output('blob');
  } finally {
    el.remove();
    if (overlay && prevBg !== null) overlay.style.background = prevBg;
  }
}

// Upload a Blob to Firebase Storage — same Google infra as the rest of
// the app, no third-party CORS quirks. Returns the public download URL
// (with the access token embedded) that EmailJS fetches at send time
// and embeds permanently into the recipient's email.
async function uploadPdfTemporary(blob, filename){
  try { await firebase.auth().signInAnonymously(); } catch(_) {}
  const id = getId() || ('contract-' + Date.now());
  const ref = storage.ref().child('signed-contracts/' + id + '.pdf');
  const snap = await ref.put(blob, {
    contentType: 'application/pdf',
    contentDisposition: 'attachment; filename="' + (filename || 'contract.pdf') + '"'
  });
  return await snap.ref.getDownloadURL();
}

async function sendContractEmail(){
  const input = document.getElementById('email-input');
  const result = document.getElementById('email-result');
  const btn = document.getElementById('email-send-btn');
  if (!input || !result || !btn) return;
  const email = (input.value || '').trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    result.className = 'email-result error';
    result.textContent = 'נא להזין כתובת מייל תקינה';
    input.focus();
    return;
  }
  if (typeof emailjs === 'undefined') {
    result.className = 'email-result error';
    result.textContent = 'שירות המייל לא טעון. בדוק חיבור אינטרנט ונסה שוב.';
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ שולח...';
  result.className = 'email-result';
  result.textContent = '';
  try {
    const modal = document.getElementById('email-modal');
    const clientName = (modal && modal.dataset.clientName) || 'לקוח';
    const contractLink = window.location.href;

    // The PDF was kicked off in the background when the modal opened —
    // by now it's almost certainly already uploaded.
    const pdfResult = await (modal && modal._pdfPromise);
    if (!pdfResult || pdfResult.error) {
      throw (pdfResult && pdfResult.error) || new Error('PDF לא הוכן');
    }

    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      client_name: clientName,
      client_email: email,
      contract_link: contractLink,
      contract_pdf_url: pdfResult.url,
      contract_pdf_name: pdfResult.filename
    });

    result.className = 'email-result success';
    result.innerHTML = '✓ נשלח אליך ל-<b dir="ltr">' + email.replace(/[<>&]/g,'') + '</b><br><span style="font-weight:600;font-size:12px;color:#6b4423">קובץ PDF מצורף</span>';
    btn.style.display = 'none';
    const skip = document.querySelector('#email-modal .email-skip');
    if (skip) { skip.textContent = 'סגור'; skip.style.flex = '1'; }
  } catch(err) {
    console.error('email send failed:', err);
    btn.disabled = false;
    btn.textContent = 'שלח לי';
    result.className = 'email-result error';
    const txt = (err && (err.text || err.message)) || 'שגיאה לא ידועה';
    result.textContent = 'שגיאה בשליחה: ' + txt;
  }
}

function renderError(msg){
  document.getElementById('root').innerHTML =
    '<div class="error"><b>אופס</b><div style="white-space:pre-line">' + escHtml(msg) + '</div>' +
    '<div style="margin-top:18px"><button onclick="location.reload()" style="background:linear-gradient(135deg,#252e6b,#141a3c);color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">לנסות שוב</button></div>' +
    '</div>';
}

// ===== Send-copy mode =====
// Triggered by URL param ?mode=send-copy. Loads the contract by id,
// generates the PDF, uploads it, sends the standard signed-contract
// email to PRODUCER_EMAIL, and reports the full status on screen. No
// client UI is rendered. Used as a one-shot "give me a copy in my
// inbox now" link.
function _sendCopyStatus(){
  const root = document.getElementById('root');
  root.innerHTML =
    '<div style="position:fixed;inset:0;background:#fdf8f0;' +
    'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
    'padding:24px;font-family:Heebo,sans-serif;direction:rtl;text-align:center">' +
    '<div id="sc-emoji" style="font-size:54px;margin-bottom:10px">📤</div>' +
    '<div id="sc-text" style="font-size:20px;font-weight:800;color:#2a1810;line-height:1.5">מתחיל…</div>' +
    '<div id="sc-sub" style="font-size:13px;font-weight:600;color:#6b4423;margin-top:8px"></div>' +
    '</div>';
  const text = document.getElementById('sc-text');
  const sub  = document.getElementById('sc-sub');
  const em   = document.getElementById('sc-emoji');
  return {
    step: function(emoji, msg){ em.textContent = emoji; text.textContent = msg; sub.textContent = ''; },
    ok:   function(msg, subtitle){ em.textContent = '✅'; text.textContent = msg; text.style.color = '#16a34a'; if (subtitle) sub.textContent = subtitle; },
    err:  function(msg){ em.textContent = '❌'; text.textContent = 'נכשל'; text.style.color = '#c2410c'; sub.textContent = msg; sub.style.color = '#c2410c'; }
  };
}

async function runSendCopyToProducerFlow(id){
  const ui = _sendCopyStatus();
  try {
    if (!id) throw new Error('חסר מזהה חוזה בקישור');
    if (typeof emailjs === 'undefined') throw new Error('שירות EmailJS לא נטען');

    ui.step('📥', 'טוען את ההסכם מ-Firebase…');
    try { await firebase.auth().signInAnonymously(); } catch(_) {}
    const snap = await db.ref('studio_data/contracts').once('value');
    const data = snap.val();
    if (!data) throw new Error('Firebase ריק');
    const arr = Array.isArray(data) ? data : Object.values(data);
    const c = arr.find(function(x){ return x && x.id === id; });
    if (!c) throw new Error('לא נמצא חוזה עם המזהה הזה');
    if (!c.signature || !c.signature.dataUrl) throw new Error('החוזה עדיין לא נחתם');

    window._currentContract = c;
    const signerName = c.signature.clientName || c.clientName || 'לקוח';
    const safe = signerName.replace(/[^֐-׿a-zA-Z0-9\s_-]/g, '').trim() || 'signed';
    const filename = 'הסכם - ' + safe + '.pdf';

    ui.step('📄', 'מייצר PDF של ההסכם…');
    const blob = await generateContractPdf(filename);

    ui.step('☁️', 'מעלה את הקובץ…');
    const url = await uploadPdfTemporary(blob, filename);

    ui.step('📧', 'שולח את המייל אליך…');
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      client_name: signerName,
      client_email: PRODUCER_EMAIL,
      contract_link: window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(id),
      contract_pdf_url: url,
      contract_pdf_name: filename
    });

    ui.ok('עותק נשלח אליך במייל', 'בדוק את ' + PRODUCER_EMAIL + ' (כולל ספאם) תוך דקה');
  } catch (e) {
    console.error('send-copy flow failed:', e);
    ui.err(e && (e.message || e.text) || String(e));
  }
}

const id = getId();
const _mode = new URLSearchParams(location.search).get('mode');

if (_mode === 'send-copy') {
  // One-shot mode: load the contract, generate a PDF, send to the
  // producer, show the result on screen, full stop. No client UI.
  runSendCopyToProducerFlow(id);
} else if (!id) {
  renderError('לא צוין מזהה סיכום. בדוק את הקישור.');
} else {
  // Multi-strategy load: SDK direct → anonymous-auth + SDK → REST.
  // Identical pattern to workshop.html; one of them survives any
  // restricted-browser / restrictive-rules combination we've seen so far.
  (async function load(){
    function handle(data){
      if (!data) { renderError('הסיכום לא נמצא.'); return false; }
      const arr = Array.isArray(data) ? data : Object.values(data);
      const c = arr.find(x => x && x.id === id);
      if (!c) { renderError('הסיכום לא נמצא.'); return false; }
      render(c);
      return true;
    }
    // 1) SDK direct
    try {
      const snap = await db.ref('studio_data/contracts').once('value');
      if (handle(snap.val())) return;
    } catch(e1) {
      console.warn('SDK read failed, trying anon auth:', e1 && e1.code);
      // 2) Anon auth + SDK
      try {
        await firebase.auth().signInAnonymously();
        const snap2 = await db.ref('studio_data/contracts').once('value');
        if (handle(snap2.val())) return;
      } catch(e2) {
        console.warn('Anon auth read failed, trying REST:', e2 && e2.code);
        // 3) Plain REST
        try {
          const res = await fetch('https://elior-studio-default-rtdb.firebaseio.com/studio_data/contracts.json?ts=' + Date.now(), {cache:'no-store'});
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (handle(data)) return;
        } catch(e3) {
          renderError('שגיאה בטעינה: ' + (e3 && (e3.code || e3.message) || e3) + '\nאם פתחת מתוך וואטסאפ — נסה לפתוח דרך Safari.');
        }
      }
    }
  })();
}
