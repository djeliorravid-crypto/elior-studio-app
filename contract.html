<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סיכום הפקה · אליאור רביד</title>
<meta name="theme-color" content="#f5e8d3">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Heebo', system-ui, sans-serif;
    background: #fdf8f0;
    color: #2a1810;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 0 18px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; padding-top: 34px; }
  .brand {
    text-align: center; font-size: 11px; letter-spacing: .25em;
    color: #a06c48; font-weight: 800; margin-bottom: 18px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 32px; font-weight: 900; text-align: center;
    margin: 0 0 4px; letter-spacing: -.02em; color: #2a1810;
  }
  .subline { text-align: center; font-size: 14px; color: #6b4423; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid rgba(176,124,62,0.2);
    border-radius: 18px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px -10px rgba(160,108,72,0.2);
  }
  .card h2 {
    font-family: 'Frank Ruhl Libre','Heebo',serif;
    font-size: 19px; font-weight: 900; color: #2a1810;
    margin: 0 0 12px; letter-spacing: -.015em;
  }
  .card p { font-size: 15px; line-height: 1.7; color: #3d2818; margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .meta-cell { background: rgba(212,165,116,0.08); border-radius: 12px; padding: 12px 14px; }
  .meta-label { font-size: 10.5px; color: #a06c48; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
  .meta-val { font-size: 16px; color: #2a1810; font-weight: 800; margin-top: 4px; word-break: break-word; }

  table.price {
    width: 100%; border-collapse: collapse; margin-bottom: 8px;
  }
  table.price td {
    padding: 10px 4px;
    border-bottom: 1px dashed rgba(176,124,62,0.25);
    font-size: 15px; color: #3d2818;
  }
  table.price tr:last-child td { border-bottom: none; }
  table.price td:last-child { text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  table.price tr.total td {
    font-weight: 900; font-size: 18px; color: #2a1810;
    border-top: 2px solid #b07c3e; padding-top: 14px;
  }
  table.price tr.total td:last-child { color: #a06c48; }

  /* Signature block */
  .sig-card { background: linear-gradient(135deg, #fff 0%, #fef5e3 100%); border: 2px solid rgba(176,124,62,0.25); }
  .sig-canvas-wrap {
    background: #fff;
    border: 1.5px dashed rgba(176,124,62,0.45);
    border-radius: 12px;
    height: 180px;
    position: relative;
    touch-action: none;
    overflow: hidden;
  }
  #sig-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .sig-hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(160,108,72,0.4); font-size: 14px; pointer-events: none;
    transition: opacity .2s;
  }
  .sig-clear {
    margin-top: 8px; background: transparent; border: none; color: #a06c48;
    font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0;
  }
  .name-input {
    width: 100%; background: #fff; border: 1.5px solid rgba(176,124,62,0.35);
    border-radius: 12px; padding: 12px 14px;
    font-size: 16px; font-weight: 700; color: #2a1810; direction: rtl;
    font-family: inherit; outline: none; margin-top: 14px;
  }
  .name-input:focus { border-color: #a06c48; }
  .btn-confirm {
    display: block; width: 100%; margin-top: 16px;
    background: linear-gradient(135deg, #ff9558, #ff6b4a); color: #fff;
    border: none; border-radius: 14px; padding: 16px;
    font-size: 16px; font-weight: 900; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 12px 30px -8px rgba(255,107,74,0.45);
    transition: transform .12s;
  }
  .btn-confirm:active { transform: scale(.98); }
  .btn-confirm:disabled { opacity: .55; cursor: not-allowed; }

  .signed-stamp {
    text-align: center; padding: 24px;
    background: rgba(52,199,89,0.08); border-radius: 14px; border: 1.5px solid rgba(52,199,89,0.3);
  }
  .signed-stamp .check { font-size: 42px; color: #16a34a; }
  .signed-stamp .name { font-family: 'Frank Ruhl Libre','Heebo',serif; font-size: 22px; font-weight: 900; color: #2a1810; margin-top: 8px; }
  .signed-stamp .when { font-size: 12px; color: #6b4423; margin-top: 4px; }
  .signed-stamp img.sig-img { display: block; margin: 14px auto 4px; max-height: 80px; }

  .loading, .error {
    text-align: center; padding: 100px 20px; color: #a06c48;
    font-size: 16px; font-weight: 700;
  }
  .error b { color: #c2410c; display: block; margin-bottom: 6px; font-size: 18px; }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .meta { grid-template-columns: 1fr; }
  }

  /* Email-copy popup */
  .email-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20,12,6,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 18px;
    animation: emailFade .22s ease;
  }
  .email-modal {
    background: #fff;
    border-radius: 22px;
    padding: 28px 24px 22px;
    max-width: 400px; width: 100%;
    text-align: center;
    box-shadow: 0 22px 60px rgba(0,0,0,0.32);
    animation: emailSlide .28s cubic-bezier(.2,.8,.25,1);
  }
  .email-modal-icon {
    font-size: 42px; margin-bottom: 10px; line-height: 1;
  }
  .email-modal h3 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 22px; font-weight: 900; margin: 0 0 6px; color: #2a1810;
  }
  .email-modal-sub {
    font-size: 14px; color: #6b4423; margin: 0 0 18px; line-height: 1.5;
  }
  #email-input {
    width: 100%; padding: 14px 16px;
    border: 1.5px solid rgba(176,124,62,0.4); border-radius: 12px;
    font-family: inherit; font-size: 16px;
    direction: ltr; text-align: left;
    outline: none; margin-bottom: 14px; color: #2a1810;
    background: #fff;
  }
  #email-input:focus { border-color: #a06c48; }
  .email-modal-actions { display: flex; gap: 10px; }
  .email-skip {
    flex: 1; background: transparent;
    border: 1.5px solid rgba(176,124,62,0.3);
    border-radius: 12px; padding: 13px;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #6b4423;
    cursor: pointer;
  }
  .email-send {
    flex: 1.6;
    background: linear-gradient(135deg, #ff9558, #ff6b4a); color: #fff;
    border: none; border-radius: 12px; padding: 13px;
    font-family: inherit; font-size: 15px; font-weight: 900;
    cursor: pointer; box-shadow: 0 8px 22px -6px rgba(255,107,74,0.45);
  }
  .email-send:disabled { opacity: .6; cursor: wait; }
  .email-result {
    margin-top: 14px; font-size: 14px; font-weight: 700; min-height: 18px;
  }
  .email-result.success { color: #16a34a; }
  .email-result.error { color: #c2410c; }
  @keyframes emailFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes emailSlide {
    from { transform: translateY(18px) scale(.97); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="root"><div class="loading">⏳ טוען...</div></div>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyB1c6rZVcGrX50UbhEMx3Ra6uaO_S5Fb5o",
  authDomain:        "elior-studio.firebaseapp.com",
  databaseURL:       "https://elior-studio-default-rtdb.firebaseio.com",
  projectId:         "elior-studio",
  storageBucket:     "elior-studio.firebasestorage.app",
  messagingSenderId: "719956484293",
  appId:             "1:719956484293:web:4e1be740d9e49a709350ac"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

// EmailJS — for sending the signed-contract copy to the client
const EMAILJS_PUBLIC_KEY  = 'JfYv9AU0fN__BBKEO';
const EMAILJS_SERVICE_ID  = 'service_mpegg49';
const EMAILJS_TEMPLATE_ID = 'template_a82ajz9';
try { if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); } catch(_) {}

function getId(){ return new URLSearchParams(location.search).get('id') || ''; }
function fmtMoney(n){ return '₪' + Math.abs(n).toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return ''; try { return new Date(s).toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'}); } catch(e){ return s; } }
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function _ctrKindLabel(c){
  const songs = (c.songs && c.songs.length) ? c.songs : (c.songTitle ? [c.songTitle] : []);
  const k = c.projectKind || (songs.length >= 7 ? 'album' : songs.length >= 4 ? 'ep' : songs.length > 1 ? 'multi' : 'single');
  if (k === 'album') return { metaLabel: 'אלבום (' + songs.length + ' שירים)', plural: true };
  if (k === 'ep')    return { metaLabel: 'EP (' + songs.length + ' שירים)',      plural: true };
  if (k === 'multi') return { metaLabel: songs.length + ' שירים',                plural: true };
  return { metaLabel: 'שיר בודד', plural: false };
}

function render(c){
  const songs = (c.songs && c.songs.length) ? c.songs : (c.songTitle ? [c.songTitle] : []);
  const kind = _ctrKindLabel(c);
  const songsLabel = songs.length <= 1 ? (songs[0] || '—') : songs.join(', ');
  const total = (c.basePrice || 0) + (c.extras || []).reduce((s,e) => s + (parseFloat(e.price)||0), 0);
  const halfA = Math.round(total / 2);
  const halfB = total - halfA;

  // Pricing rows
  const baseDesc = kind.plural
    ? 'חבילת הפקה — ' + kind.metaLabel + ' · הפקה, מיקס, מאסטר, נגן אחד פר שיר, עד 5 סבבי תיקונים לשיר'
    : 'חבילת הפקה בסיסית — הפקה, מיקס, מאסטר, נגן אחד, עד 5 סבבי תיקונים';
  let priceRows = '<tr><td>' + baseDesc + '</td><td>' + fmtMoney(c.basePrice || 0) + '</td></tr>';
  (c.extras || []).forEach(function(e){
    priceRows += '<tr><td>' + escHtml(e.label || (e.type === 'musician' ? 'נגן נוסף' : e.type === 'revisions' ? 'סבב תיקונים נוסף' : 'תוספת')) + '</td><td>' + fmtMoney(e.price || 0) + '</td></tr>';
  });
  priceRows += '<tr class="total"><td>סה"כ</td><td>' + fmtMoney(total) + '</td></tr>';

  // Rights paragraph
  const rightsTarget = kind.plural ? 'השירים (מילים ולחן)' : 'השיר (מילים ולחן)';
  let rightsHtml = '';
  if (c.rightsMode === 'split' && Array.isArray(c.splitShares) && c.splitShares.length) {
    const parts = c.splitShares.filter(s => s.name && s.percent > 0).map(s => s.percent + '% ' + escHtml(s.name));
    rightsHtml = 'זכויות הכתיבה של ' + rightsTarget + ' מתחלקות: ' + parts.join(' · ') + ', ורשומות בהתאם באקו"ם.';
  } else {
    rightsHtml = 'זכויות הכתיבה של ' + rightsTarget + ' רשומות על שם <b>' + escHtml(c.producerName || 'אליאור רביד') + '</b> באקו"ם.';
  }

  // Songs list (when multi)
  const songsBlock = songs.length > 1
    ? '<div class="card"><h2>השירים בפרויקט</h2><ol style="padding-right:20px;margin:6px 0;font-size:16px;line-height:1.8;color:#3d2818">' +
      songs.map(s => '<li>' + escHtml(s) + '</li>').join('') + '</ol></div>'
    : '';

  // Two-up signature block — producer always shown if exists, client signed/pending
  const producerImg = c.producerSignature
    ? '<img class="sig-img" src="' + c.producerSignature + '" alt="חתימת מפיק" style="max-height:70px;display:block;margin:6px auto">'
    : '<div style="color:#b07c3e;font-style:italic;padding:18px 4px">— ללא חתימה דיגיטלית —</div>';
  const producerWhen = c.producerSignedAt ? new Date(c.producerSignedAt).toLocaleDateString('he-IL') : (c.createdAt ? new Date(c.createdAt).toLocaleDateString('he-IL') : '');
  const producerCell =
    '<div style="background:rgba(212,165,116,0.06);border:1.5px solid rgba(176,124,62,0.25);border-radius:14px;padding:16px 14px;text-align:center">' +
      '<div style="font-size:11px;color:#a06c48;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">חתימת המפיק</div>' +
      producerImg +
      '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:18px;font-weight:900;color:#2a1810;margin-top:4px">' + escHtml(c.producerName || 'אליאור רביד') + '</div>' +
      (producerWhen ? '<div style="font-size:11px;color:#6b4423;margin-top:4px">' + producerWhen + '</div>' : '') +
    '</div>';

  // Client cell: either the signed result OR the live signature pad (only here, never duplicated below)
  let clientCell;
  if (c.signature && c.signature.dataUrl) {
    clientCell =
      '<div style="background:rgba(52,199,89,0.08);border:1.5px solid rgba(52,199,89,0.3);border-radius:14px;padding:16px 14px;text-align:center">' +
        '<div style="font-size:11px;color:#16a34a;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">✓ חתימת הזמר/ת</div>' +
        '<img class="sig-img" src="' + c.signature.dataUrl + '" alt="חתימה" style="max-height:70px;display:block;margin:6px auto">' +
        '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:18px;font-weight:900;color:#2a1810;margin-top:4px">' + escHtml(c.signature.clientName || c.clientName) + '</div>' +
        '<div style="font-size:11px;color:#6b4423;margin-top:4px">' + (c.signature.signedAt ? new Date(c.signature.signedAt).toLocaleString('he-IL') : '') + '</div>' +
      '</div>';
  } else {
    clientCell =
      '<div style="background:rgba(255,255,255,0.5);border:1.5px dashed rgba(176,124,62,0.4);border-radius:14px;padding:16px 14px;text-align:center">' +
        '<div style="font-size:11px;color:#a06c48;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">חתימת הזמר/ת</div>' +
        '<div style="color:#b07c3e;font-size:13px;font-style:italic;padding:14px 4px">הוסף את חתימתך למטה</div>' +
      '</div>';
  }

  const signaturesBlock =
    '<div class="card"><h2>חתימות</h2>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' + producerCell + clientCell + '</div>' +
    '</div>';

  const signedThanks = c.signature && c.signature.dataUrl ? (
    '<div class="signed-stamp" style="margin-top:20px">' +
      '<div class="check">✓</div>' +
      '<div style="font-weight:800;color:#16a34a;font-size:17px">סיכום ההפקה אושר</div>' +
      '<div style="font-size:13px;color:#3d2818;margin-top:6px">העתק נשמר ויישלח אליך.</div>' +
    '</div>'
  ) : '';

  const signPad = !(c.signature && c.signature.dataUrl) ? (
    '<div class="card sig-card">' +
      '<h2>אישור וחתימה</h2>' +
      '<p style="margin-bottom:14px">חתום/י כאן באצבע ואשר/י את התנאים למעלה. עותק חתום יישמר אצל המפיק ויישלח אליך.</p>' +
      '<div class="sig-canvas-wrap"><canvas id="sig-canvas"></canvas><div class="sig-hint" id="sig-hint">חתום פה באצבע</div></div>' +
      '<button class="sig-clear" onclick="clearSig()">↺ נקה חתימה</button>' +
      '<input class="name-input" id="signer-name" type="text" placeholder="השם המלא שלי" value="' + escHtml(c.clientName || '') + '">' +
      '<button class="btn-confirm" id="confirm-btn" onclick="submitSignature()">✓ אני מאשר/ת את התנאים</button>' +
    '</div>'
  ) : '';

  document.getElementById('root').innerHTML =
    '<div class="wrap">' +
      '<div class="brand">אליאור רביד · אולפן</div>' +
      '<h1>סיכום הפקה</h1>' +
      '<div class="subline">בין <b>' + escHtml(c.producerName || 'אליאור רביד') + '</b> לבין <b>' + escHtml(c.clientName || '') + '</b></div>' +

      '<div class="card">' +
        '<div class="meta">' +
          '<div class="meta-cell"><div class="meta-label">שם הפרויקט</div><div class="meta-val">' + escHtml(songsLabel) + '</div></div>' +
          '<div class="meta-cell"><div class="meta-label">סוג / תאריך</div><div class="meta-val">' + kind.metaLabel + ' · ' + escHtml(fmtDate(c.projectDate) || '—') + '</div></div>' +
        '</div>' +
      '</div>' +

      songsBlock +

      '<div class="card"><h2>מה כולל הפרויקט</h2><p>' + (kind.plural
        ? 'חבילת ההפקה כוללת לכל שיר: <b>הפקה מלאה, מיקס, מאסטרינג, נגן אחד, ועד 5 סבבי תיקונים</b>. בסיום תקבל/י את השירים מוגמרים, מוכנים לחלוטין להעלאה לכל הפלטפורמות.'
        : 'חבילת ההפקה כוללת: <b>הפקה מלאה, מיקס, מאסטרינג, נגן אחד, ועד 5 סבבי תיקונים על המיקס</b>. בסיום תקבל/י שיר מוגמר, מוכן לחלוטין להעלאה לכל הפלטפורמות.'
      ) + '</p>' +
      ((c.extras || []).length ? '<p style="margin-top:12px"><b>תוספות שנבחרו:</b><br>' + c.extras.map(e => '• ' + escHtml(e.label || '')).join('<br>') + '</p>' : '') +
      '</div>' +

      '<div class="card"><h2>מחיר</h2><table class="price">' + priceRows + '</table>' +
        '<p style="margin-top:12px;font-size:13px;color:#6b4423"><b>תנאי תשלום:</b> ' + fmtMoney(halfA) + ' עם תחילת העבודה · ' + fmtMoney(halfB) + ' בשלב המיקס. הקבצים הסופיים נמסרים לאחר השלמת התשלום.</p>' +
      '</div>' +

      '<div class="card"><h2>תיקונים</h2><p>המחיר כולל עד <b>5 סבבי תיקונים</b> על המיקס' + (kind.plural ? ' לכל שיר' : '') + ' — מספר נדיב שמכסה כמעט כל פרויקט. כל סבב הוא רשימת הערות אחת. אם במקרה נדיר יידרשו סבבים נוספים, כל אחד הוא <b>₪300</b>. שינוי כיוון מהותי של ההפקה נחשב לעבודה חדשה ומתומחר בנפרד.</p></div>' +

      '<div class="card"><h2>זכויות</h2><p>ההקלטה הסופית (המאסטר) שלך לחלוטין — חופשי/ה לעשות בה כל שתרצה/י.</p><p>' + rightsHtml + '</p></div>' +

      signaturesBlock +
      signPad +
      signedThanks +

      '<div style="text-align:center;margin-top:30px;color:#a06c48;font-size:12px;font-weight:600">סיכום הפקה של <b>אליאור רביד</b> · מפיק מוזיקלי</div>' +
    '</div>';

  if (!c.signature) initSignaturePad();

  window._currentContract = c;
  document.title = 'סיכום הפקה — ' + (songsLabel || c.clientName || 'אליאור רביד');
}

// ===== PDF-only layout =====
// Builds a dedicated, A4-tight DOM tree off-screen — used only as the
// source for html2pdf. Keeps the live page free to be spacious while
// the PDF stays compact, single-page, with visible signatures and
// clean RTL (which html2canvas struggles with on the live layout).
function buildPdfPrintable(c){
  const songs = (c.songs && c.songs.length) ? c.songs : (c.songTitle ? [c.songTitle] : []);
  const kind = _ctrKindLabel(c);
  const songsLabel = songs.length <= 1 ? (songs[0] || '—') : songs.join(', ');
  const total = (c.basePrice || 0) + (c.extras || []).reduce(function(s,e){ return s + (parseFloat(e.price)||0); }, 0);
  const halfA = Math.round(total / 2);
  const halfB = total - halfA;

  const baseDesc = kind.plural
    ? 'חבילת הפקה — ' + kind.metaLabel + ' · הפקה, מיקס, מאסטר, נגן אחד פר שיר, עד 5 סבבי תיקונים לשיר'
    : 'חבילת הפקה בסיסית — הפקה, מיקס, מאסטר, נגן אחד, עד 5 סבבי תיקונים';

  const rightsTarget = kind.plural ? 'השירים (מילים ולחן)' : 'השיר (מילים ולחן)';
  let rightsHtml;
  if (c.rightsMode === 'split' && Array.isArray(c.splitShares) && c.splitShares.length) {
    const parts = c.splitShares.filter(function(s){ return s.name && s.percent > 0; })
                               .map(function(s){ return s.percent + '% ' + escHtml(s.name); });
    rightsHtml = 'זכויות הכתיבה של ' + rightsTarget + ' מתחלקות: ' + parts.join(' · ') + ', ורשומות בהתאם באקו"ם.';
  } else {
    rightsHtml = 'זכויות הכתיבה של ' + rightsTarget + ' רשומות על שם <b>' + escHtml(c.producerName || 'אליאור רביד') + '</b> באקו"ם.';
  }

  let priceRows = '<tr><td style="padding:5px 0;border-bottom:1px dashed rgba(176,124,62,0.3);font-size:12px;color:#3d2818">' + baseDesc + '</td>' +
                  '<td style="padding:5px 0;border-bottom:1px dashed rgba(176,124,62,0.3);text-align:left;font-weight:700;font-size:12px;color:#3d2818;white-space:nowrap">' + fmtMoney(c.basePrice || 0) + '</td></tr>';
  (c.extras || []).forEach(function(e){
    priceRows += '<tr><td style="padding:5px 0;border-bottom:1px dashed rgba(176,124,62,0.3);font-size:12px;color:#3d2818">' + escHtml(e.label || '') + '</td>' +
                 '<td style="padding:5px 0;border-bottom:1px dashed rgba(176,124,62,0.3);text-align:left;font-weight:700;font-size:12px;color:#3d2818;white-space:nowrap">' + fmtMoney(e.price || 0) + '</td></tr>';
  });
  priceRows += '<tr><td style="padding:8px 0 0;font-weight:900;font-size:14px;border-top:1.5px solid #b07c3e;color:#2a1810">סה"כ</td>' +
               '<td style="padding:8px 0 0;font-weight:900;font-size:15px;border-top:1.5px solid #b07c3e;color:#a06c48;text-align:left;white-space:nowrap">' + fmtMoney(total) + '</td></tr>';

  const songsBlock = songs.length > 1
    ? '<div style="margin-bottom:10px"><div style="font-family:\'Frank Ruhl Libre\',serif;font-size:13px;font-weight:900;color:#2a1810;margin-bottom:3px">השירים בפרויקט</div>' +
      '<ol style="padding-right:18px;margin:0;font-size:12px;line-height:1.5;color:#3d2818">' +
      songs.map(function(s){ return '<li>' + escHtml(s) + '</li>'; }).join('') + '</ol></div>'
    : '';

  const producerImg = c.producerSignature
    ? '<img src="' + c.producerSignature + '" style="max-height:52px;display:block;margin:4px auto 2px" crossorigin="anonymous">'
    : '<div style="color:#b07c3e;font-style:italic;padding:10px 4px;font-size:10px">— ללא חתימה דיגיטלית —</div>';
  const producerWhen = c.producerSignedAt ? new Date(c.producerSignedAt).toLocaleDateString('he-IL') :
                       (c.createdAt ? new Date(c.createdAt).toLocaleDateString('he-IL') : '');

  const clientImg = c.signature && c.signature.dataUrl
    ? '<img src="' + c.signature.dataUrl + '" style="max-height:52px;display:block;margin:4px auto 2px" crossorigin="anonymous">'
    : '<div style="color:#b07c3e;font-style:italic;padding:10px 4px;font-size:10px">— טרם נחתם —</div>';
  const clientWhen = c.signature && c.signature.signedAt ? new Date(c.signature.signedAt).toLocaleDateString('he-IL') : '';
  const clientFullName = (c.signature && c.signature.clientName) || c.clientName || '';

  const wrap = document.createElement('div');
  wrap.dir = 'rtl';
  wrap.lang = 'he';
  // Mounted at the top-left of the viewport behind the email modal —
  // html2canvas can't reliably capture elements positioned off-screen
  // (e.g. left:-10000px), so the element has to be in the live render
  // tree. The open email modal (z-index 9999) covers it during the
  // ~1-2s capture; we also make the modal opaque temporarily so the
  // user doesn't see anything behind it.
  wrap.style.cssText =
    'position:fixed;left:0;top:0;width:760px;z-index:1;' +
    'background:#fdf8f0;padding:30px 34px;box-sizing:border-box;' +
    "font-family:'Heebo',system-ui,sans-serif;color:#2a1810;line-height:1.5;direction:rtl;text-align:right;";

      '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:28px;font-weight:900;margin:6px 0 3px;color:#2a1810">סיכום הפקה</div>' +
      '<div style="font-size:12px;color:#6b4423">בין <b>' + escHtml(c.producerName || 'אליאור רביד') + '</b> לבין <b>' + escHtml(c.clientName || '') + '</b></div>' +
    '</div>' +

    '<div style="display:flex;gap:10px;margin-bottom:12px;direction:rtl">' +
      '<div style="flex:1;background:rgba(212,165,116,0.10);border-radius:8px;padding:8px 12px">' +
        '<div style="font-size:9px;color:#a06c48;font-weight:800;text-transform:uppercase;letter-spacing:1.2px">שם הפרויקט</div>' +
        '<div style="font-size:14px;font-weight:800;margin-top:2px;color:#2a1810">' + escHtml(songsLabel) + '</div>' +
      '</div>' +
      '<div style="flex:1;background:rgba(212,165,116,0.10);border-radius:8px;padding:8px 12px">' +
        '<div style="font-size:9px;color:#a06c48;font-weight:800;text-transform:uppercase;letter-spacing:1.2px">סוג / תאריך</div>' +
        '<div style="font-size:14px;font-weight:800;margin-top:2px;color:#2a1810">' + kind.metaLabel + ' · ' + escHtml(fmtDate(c.projectDate) || '—') + '</div>' +
      '</div>' +
    '</div>' +

    songsBlock +

    '<div style="margin-bottom:10px">' +
      '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:14px;font-weight:900;color:#2a1810;margin-bottom:4px">מה כולל הפרויקט</div>' +
      '<div style="font-size:12px;line-height:1.55;color:#3d2818">' +
        (kind.plural
          ? 'חבילת ההפקה כוללת לכל שיר: <b>הפקה מלאה, מיקס, מאסטרינג, נגן אחד, ועד 5 סבבי תיקונים</b>. בסיום תקבל/י את השירים מוגמרים, מוכנים לחלוטין להעלאה לכל הפלטפורמות.'
          : 'חבילת ההפקה כוללת: <b>הפקה מלאה, מיקס, מאסטרינג, נגן אחד, ועד 5 סבבי תיקונים על המיקס</b>. בסיום תקבל/י שיר מוגמר, מוכן לחלוטין להעלאה לכל הפלטפורמות.') +
      '</div>' +
      ((c.extras || []).length
        ? '<div style="margin-top:5px;font-size:12px;color:#3d2818"><b>תוספות שנבחרו:</b> ' +
          c.extras.map(function(e){ return escHtml(e.label || ''); }).join(' · ') + '</div>'
        : '') +
    '</div>' +

    '<div style="margin-bottom:10px">' +
      '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:14px;font-weight:900;color:#2a1810;margin-bottom:4px">מחיר</div>' +
      '<table style="width:100%;border-collapse:collapse;direction:rtl">' + priceRows + '</table>' +
      '<div style="margin-top:8px;font-size:11px;color:#6b4423"><b>תנאי תשלום:</b> ' + fmtMoney(halfA) + ' עם תחילת העבודה · ' + fmtMoney(halfB) + ' בשלב המיקס. הקבצים הסופיים נמסרים לאחר השלמת התשלום.</div>' +
    '</div>' +

    '<div style="margin-bottom:10px">' +
      '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:14px;font-weight:900;color:#2a1810;margin-bottom:4px">תיקונים</div>' +
      '<div style="font-size:11.5px;line-height:1.55;color:#3d2818">המחיר כולל עד <b>5 סבבי תיקונים</b> על המיקס' + (kind.plural ? ' לכל שיר' : '') + ' — מספר נדיב שמכסה כמעט כל פרויקט. כל סבב הוא רשימת הערות אחת. אם במקרה נדיר יידרשו סבבים נוספים, כל אחד הוא <b>₪300</b>. שינוי כיוון מהותי של ההפקה נחשב לעבודה חדשה ומתומחר בנפרד.</div>' +
    '</div>' +

    '<div style="margin-bottom:14px">' +
      '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:14px;font-weight:900;color:#2a1810;margin-bottom:4px">זכויות</div>' +
      '<div style="font-size:11.5px;line-height:1.55;color:#3d2818">ההקלטה הסופית (המאסטר) שלך לחלוטין — חופשי/ה לעשות בה כל שתרצה/י.</div>' +
      '<div style="font-size:11.5px;line-height:1.55;color:#3d2818;margin-top:3px">' + rightsHtml + '</div>' +
    '</div>' +

    '<div style="display:flex;gap:10px;margin-top:14px;page-break-inside:avoid;direction:rtl">' +
      '<div style="flex:1;background:rgba(212,165,116,0.08);border:1.5px solid rgba(176,124,62,0.35);border-radius:10px;padding:10px 12px;text-align:center">' +
        '<div style="font-size:9px;color:#a06c48;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px">חתימת המפיק</div>' +

        clientImg +
        '<div style="font-family:\'Frank Ruhl Libre\',serif;font-size:14px;font-weight:900;color:#2a1810;margin-top:3px">' + escHtml(clientFullName) + '</div>' +
        (clientWhen ? '<div style="font-size:10px;color:#6b4423;margin-top:2px">' + clientWhen + '</div>' : '') +
      '</div>' +

    '<div style="text-align:center;margin-top:14px;padding-top:8px;border-top:1px solid rgba(176,124,62,0.25);color:#a06c48;font-size:10px;font-weight:600">סיכום הפקה של <b>אליאור רביד</b> · מפיק מוזיקלי</div>';

  return wrap;
}

// ===== Signature pad =====
let _sigCtx = null, _sigCanvas = null, _sigDrawing = false, _sigLastX = 0, _sigLastY = 0, _sigDirty = false;

function initSignaturePad(){
  _sigCanvas = document.getElementById('sig-canvas');
  if (!_sigCanvas) return;
  function fit(){
    const rect = _sigCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    _sigCanvas.width = Math.max(1, rect.width * dpr);
    _sigCanvas.height = Math.max(1, rect.height * dpr);
    _sigCtx = _sigCanvas.getContext('2d');
    _sigCtx.scale(dpr, dpr);
    _sigCtx.lineWidth = 2.4;
    _sigCtx.lineCap = 'round';
    _sigCtx.lineJoin = 'round';
    _sigCtx.strokeStyle = '#1a1410';
  }
  fit();
  function pos(e){
    const r = _sigCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }
  function start(e){ e.preventDefault(); _sigDrawing = true; const p = pos(e); _sigLastX = p.x; _sigLastY = p.y; }
  function move(e){
    if (!_sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    _sigCtx.beginPath();
    _sigCtx.moveTo(_sigLastX, _sigLastY);
    _sigCtx.lineTo(p.x, p.y);
    _sigCtx.stroke();
    _sigLastX = p.x; _sigLastY = p.y;
    if (!_sigDirty) { _sigDirty = true; const hint = document.getElementById('sig-hint'); if (hint) hint.style.opacity = '0'; }
  }
  function end(){ _sigDrawing = false; }
  _sigCanvas.addEventListener('touchstart', start, {passive: false});
  _sigCanvas.addEventListener('touchmove', move, {passive: false});
  _sigCanvas.addEventListener('touchend', end);
  _sigCanvas.addEventListener('touchcancel', end);
  _sigCanvas.addEventListener('mousedown', start);
  _sigCanvas.addEventListener('mousemove', move);
  _sigCanvas.addEventListener('mouseup', end);
  _sigCanvas.addEventListener('mouseleave', end);
}
function clearSig(){
  if (!_sigCtx || !_sigCanvas) return;
  _sigCtx.clearRect(0, 0, _sigCanvas.width, _sigCanvas.height);
  _sigDirty = false;
  const hint = document.getElementById('sig-hint'); if (hint) hint.style.opacity = '1';
}

async function submitSignature(){
  if (!_sigDirty) { alert('נא לחתום באזור החתימה'); return; }
  const name = (document.getElementById('signer-name').value || '').trim();
  if (!name) { alert('נא להזין שם מלא'); return; }
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.textContent = '⏳ שולח...';
  const dataUrl = _sigCanvas.toDataURL('image/png');
  const id = getId();
  try {
    // Try anonymous auth first so writes are allowed under rules that
    // require auth != null. Harmless if it fails.
    try { await firebase.auth().signInAnonymously(); } catch(_) {}
    // Fetch current contracts via SDK, mark the one with `id` as signed,
    // push the whole array back at studio_data/contracts.
    const snap = await db.ref('studio_data/contracts').once('value');
    const data = snap.val();
    if (!data) throw new Error('not-found');
    const arr = Array.isArray(data) ? data : Object.values(data);
    const idx = arr.findIndex(x => x && x.id === id);
    if (idx < 0) throw new Error('not-found');
    arr[idx].signature = { dataUrl: dataUrl, clientName: name, signedAt: Date.now() };
    arr[idx].status = 'signed';
    arr[idx].updatedAt = Date.now();
    await db.ref().update({
      'studio_data/contracts': arr,
      'studio_meta/contracts': Date.now() // nudges producer's device to re-sync
    });
    render(arr[idx]);
    window.scrollTo({top: 0, behavior: 'smooth'});
    setTimeout(function(){ openEmailModal(name); }, 700);
  } catch(err) {
    console.error('signature submit failed:', err);
    btn.disabled = false;
    btn.textContent = '✓ אני מאשר/ת את התנאים';
    const code = err && (err.code || err.message) || err;
    alert('שגיאה בשליחה: ' + code + '\nנסה שוב או רענן.');
  }
}

// ===== Email-copy popup =====
function openEmailModal(clientName){
  closeEmailModal();
  const wrap = document.createElement('div');
  wrap.id = 'email-modal';
  wrap.className = 'email-modal-overlay';
  wrap.dataset.clientName = clientName || '';
  wrap.innerHTML =
    '<div class="email-modal" role="dialog" aria-modal="true">' +
      '<div class="email-modal-icon">📧</div>' +
      '<h3>קבל עותק במייל</h3>' +
      '<div class="email-modal-sub">נשמח לשלוח אליך עותק של ההסכם החתום.<br>הכנס/י כתובת מייל:</div>' +
      '<input id="email-input" type="email" placeholder="your@email.com" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false">' +
      '<div class="email-modal-actions">' +
        '<button class="email-skip" type="button" onclick="closeEmailModal()">לא, תודה</button>' +
        '<button class="email-send" id="email-send-btn" type="button" onclick="sendContractEmail()">שלח לי</button>' +
      '</div>' +
      '<div id="email-result" class="email-result"></div>' +
    '</div>';
  document.body.appendChild(wrap);
  setTimeout(function(){
    const i = document.getElementById('email-input');
    if (i) {
      i.focus();
      i.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendContractEmail(); });
    }
  }, 180);

  // Pre-generate the PDF + upload in the background while the user
  // is reading and typing their email. By the time they click "שלח",
  // the file is already hosted and we only wait for the EmailJS call.
  const safeName = (clientName || 'signed').replace(/[^֐-׿a-zA-Z0-9\s_-]/g, '').trim() || 'signed';
  const filename = 'הסכם - ' + safeName + '.pdf';
  wrap._pdfFilename = filename;
  wrap._pdfPromise = (async function(){
    const blob = await generateContractPdf(filename);
    const url  = await uploadPdfTemporary(blob, filename);
    return { url: url, filename: filename };
  })().catch(function(err){ return { error: err }; });
}

function closeEmailModal(){
  const m = document.getElementById('email-modal');
  if (m) m.remove();
}

// Generate a PDF Blob of the signed contract using the dedicated
// printable layout. The element has to be mounted in the live viewport
// (html2canvas can't reliably capture off-screen elements), so we also
// briefly turn the email-modal overlay fully opaque to hide it from the
// user during the ~1-2 second capture.
async function generateContractPdf(filename){
  if (typeof html2pdf === 'undefined') throw new Error('PDF library not loaded');
  const c = window._currentContract;
  if (!c) throw new Error('contract not loaded');

  const el = buildPdfPrintable(c);
  document.body.appendChild(el);

  const overlay = document.getElementById('email-modal');
  const prevBg = overlay ? overlay.style.background : null;
  if (overlay) overlay.style.background = '#fdf8f0';

  try {
    // Wait for the signature <img> tags (data: URLs) to be fully decoded
    // before html2canvas snapshots, otherwise the PDF can be missing them.
    const imgs = Array.from(el.querySelectorAll('img'));
    await Promise.all(imgs.map(function(img){
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(function(resolve){
        img.onload = resolve;
        img.onerror = resolve;
        setTimeout(resolve, 2000);
      });
    }));
    // Give the browser two paint ticks to apply layout + fonts.
    await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });

    const opt = {
      margin:       [8, 8, 8, 8],
      filename:     filename || 'contract.pdf',
      image:        { type: 'jpeg', quality: 0.85 },
      html2canvas:  {
        scale: 1.5,
        useCORS: true,
        backgroundColor: '#fdf8f0',
        letterRendering: true
      },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
      pagebreak:    { mode: ['css', 'legacy'] }
    };
    const blob = await html2pdf().set(opt).from(el).output('blob');
    return blob;
  } finally {
    el.remove();
    if (overlay && prevBg !== null) overlay.style.background = prevBg;
  }
}

// Upload a Blob to Firebase Storage — same Google infra as the rest of
// the app, no third-party CORS quirks. Returns the public download URL
// (with the access token embedded) that EmailJS fetches at send time
// and embeds permanently into the recipient's email.
async function uploadPdfTemporary(blob, filename){
  try { await firebase.auth().signInAnonymously(); } catch(_) {}
  const id = getId() || ('contract-' + Date.now());
  const ref = storage.ref().child('signed-contracts/' + id + '.pdf');
  const snap = await ref.put(blob, {
    contentType: 'application/pdf',
    contentDisposition: 'attachment; filename="' + (filename || 'contract.pdf') + '"'
  });
  return await snap.ref.getDownloadURL();
}

async function sendContractEmail(){
  const input = document.getElementById('email-input');
  const result = document.getElementById('email-result');
  const btn = document.getElementById('email-send-btn');
  if (!input || !result || !btn) return;
  const email = (input.value || '').trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    result.className = 'email-result error';
    result.textContent = 'נא להזין כתובת מייל תקינה';
    input.focus();
    return;
  }
  if (typeof emailjs === 'undefined') {
    result.className = 'email-result error';
    result.textContent = 'שירות המייל לא טעון. בדוק חיבור אינטרנט ונסה שוב.';
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ שולח...';
  result.className = 'email-result';
  result.textContent = '';
  try {
    const modal = document.getElementById('email-modal');
    const clientName = (modal && modal.dataset.clientName) || 'לקוח';
    const contractLink = window.location.href;

    // The PDF was kicked off in the background when the modal opened —
    // by now it's almost certainly already uploaded.
    const pdfResult = await (modal && modal._pdfPromise);
    if (!pdfResult || pdfResult.error) {
      throw (pdfResult && pdfResult.error) || new Error('PDF לא הוכן');
    }

    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      client_name: clientName,
      client_email: email,
      contract_link: contractLink,
      contract_pdf_url: pdfResult.url,
      contract_pdf_name: pdfResult.filename
    });

    result.className = 'email-result success';
    result.innerHTML = '✓ נשלח אליך ל-<b dir="ltr">' + email.replace(/[<>&]/g,'') + '</b><br><span style="font-weight:600;font-size:12px;color:#6b4423">קובץ PDF מצורף</span>';
    btn.style.display = 'none';
    const skip = document.querySelector('#email-modal .email-skip');
    if (skip) { skip.textContent = 'סגור'; skip.style.flex = '1'; }
  } catch(err) {
    console.error('email send failed:', err);
    btn.disabled = false;
    btn.textContent = 'שלח לי';
    result.className = 'email-result error';
    const txt = (err && (err.text || err.message)) || 'שגיאה לא ידועה';
    result.textContent = 'שגיאה בשליחה: ' + txt;
  }
}

function renderError(msg){
  document.getElementById('root').innerHTML =
    '<div class="error"><b>אופס</b><div style="white-space:pre-line">' + escHtml(msg) + '</div>' +
    '<div style="margin-top:18px"><button onclick="location.reload()" style="background:linear-gradient(135deg,#ff9558,#ff6b4a);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit">🔄 נסה שוב</button></div>' +
    '</div>';
}

const id = getId();
if (!id) {
  renderError('לא צוין מזהה סיכום. בדוק את הקישור.');
} else {
  // Multi-strategy load: SDK direct → anonymous-auth + SDK → REST.
  // Identical pattern to workshop.html; one of them survives any
  // restricted-browser / restrictive-rules combination we've seen so far.
  (async function load(){
    function handle(data){
      if (!data) { renderError('הסיכום לא נמצא.'); return false; }
      const arr = Array.isArray(data) ? data : Object.values(data);
      const c = arr.find(x => x && x.id === id);
      if (!c) { renderError('הסיכום לא נמצא.'); return false; }
      render(c);
      return true;
    }
    // 1) SDK direct
    try {
      const snap = await db.ref('studio_data/contracts').once('value');
      if (handle(snap.val())) return;
    } catch(e1) {
      console.warn('SDK read failed, trying anon auth:', e1 && e1.code);
      // 2) Anon auth + SDK
      try {
        await firebase.auth().signInAnonymously();
        const snap2 = await db.ref('studio_data/contracts').once('value');
        if (handle(snap2.val())) return;
      } catch(e2) {
        console.warn('Anon auth read failed, trying REST:', e2 && e2.code);
        // 3) Plain REST
        try {
          const res = await fetch('https://elior-studio-default-rtdb.firebaseio.com/studio_data/contracts.json?ts=' + Date.now(), {cache:'no-store'});
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (handle(data)) return;
        } catch(e3) {
          renderError('שגיאה בטעינה: ' + (e3 && (e3.code || e3.message) || e3) + '\nאם פתחת מתוך וואטסאפ — נסה לפתוח דרך Safari.');
        }
      }
    }
  })();
}
</script>
