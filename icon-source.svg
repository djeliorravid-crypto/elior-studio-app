<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1008"/>
      <stop offset="0.55" stop-color="#2a1810"/>
      <stop offset="1" stop-color="#3a2418"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7793b"/>
      <stop offset="0.3" stop-color="#e6c896"/>
      <stop offset="0.5" stop-color="#fff2d8"/>
      <stop offset="0.7" stop-color="#e6c896"/>
      <stop offset="1" stop-color="#a7793b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d4a574" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad3)"/>

  <!-- Soft center glow -->
  <circle cx="512" cy="450" r="380" fill="url(#glowGrad)"/>

  <!-- Sound-wave bars — premium, varied heights, centered around y=440 -->
  <g fill="url(#waveGrad)">
    <rect x="200" y="380" width="20" height="120" rx="10"/>
    <rect x="252" y="330" width="20" height="220" rx="10"/>
    <rect x="304" y="270" width="20" height="340" rx="10"/>
    <rect x="356" y="220" width="20" height="440" rx="10"/>
    <rect x="408" y="170" width="20" height="540" rx="10"/>
    <rect x="460" y="120" width="20" height="640" rx="10"/>
    <rect x="512" y="170" width="20" height="540" rx="10"/>
    <rect x="564" y="220" width="20" height="440" rx="10"/>
    <rect x="616" y="270" width="20" height="340" rx="10"/>
    <rect x="668" y="330" width="20" height="220" rx="10"/>
    <rect x="720" y="380" width="20" height="120" rx="10"/>
    <rect x="772" y="410" width="20" height="60"  rx="10"/>
    <rect x="824" y="425" width="20" height="30"  rx="10"/>
  </g>

  <!-- Underline -->
  <line x1="280" y1="800" x2="744" y2="800" stroke="#d4a574" stroke-width="1.5" opacity="0.35"/>

  <!-- Wordmark -->
  <text x="512" y="870"
        font-family="Liberation Serif, FreeSerif, DejaVu Sans, serif"
        font-size="68" font-weight="900"
        fill="#f5e8d3"
        text-anchor="middle"
        letter-spacing="5">RAVID</text>
  <text x="512" y="925"
        font-family="Liberation Sans, DejaVu Sans, sans-serif"
        font-size="24" font-weight="500"
        fill="#d4a574"
        text-anchor="middle"
        letter-spacing="18"
        opacity="0.75">STUDIO</text>
</svg>
