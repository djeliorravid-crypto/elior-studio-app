<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סדנא · אליאור רביד</title>
<meta name="theme-color" content="#f5e8d3">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Heebo', system-ui, sans-serif;
    background: #fdf8f0;
    color: #2a1810;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    padding: 60px 22px 70px;
    text-align: center;
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 200, 130, 0.6) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255, 170, 110, 0.4) 0%, transparent 50%),
      radial-gradient(circle at 50% 80%, rgba(255, 220, 180, 0.5) 0%, transparent 50%),
      linear-gradient(180deg, #faf0dc 0%, #f5e3c4 100%);
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: '✦';
    position: absolute;
    color: rgba(176, 124, 62, 0.4);
    font-size: 16px;
    animation: float 6s ease-in-out infinite;
  }
  .hero::before { top: 15%; right: 12%; font-size: 22px; animation-delay: 0s; }
  .hero::after { bottom: 22%; left: 14%; font-size: 18px; animation-delay: 2s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: .4; }
    50% { transform: translateY(-12px) rotate(180deg); opacity: .8; }
  }

  .brand {
    font-size: 11px; letter-spacing: .3em;
    color: #a06c48; font-weight: 800;
    text-transform: uppercase; margin-bottom: 26px;
  }
  .urgency-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #ff6b4a, #ff9558);
    color: #fff; font-size: 12px; font-weight: 900;
    padding: 7px 14px; border-radius: 20px;
    margin-bottom: 18px;
    box-shadow: 0 6px 20px rgba(255, 107, 74, 0.35);
    animation: pulse-chip 2.4s ease-in-out infinite;
  }
  @keyframes pulse-chip {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .hero-emoji {
    font-size: 78px; line-height: 1; margin-bottom: 14px;
    filter: drop-shadow(0 8px 24px rgba(160, 108, 72, 0.25));
    animation: bob 4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .hero h1 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 38px; font-weight: 900; line-height: 1.1;
    margin: 0 0 14px; letter-spacing: -.025em;
    color: #2a1810;
    max-width: 520px; margin-left: auto; margin-right: auto;
  }
  .tagline {
    font-size: 17px; color: #5c3a28; line-height: 1.55;
    font-weight: 600; max-width: 460px; margin: 0 auto;
  }

  /* ===== BODY ===== */
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 22px 140px; }

  .seats-card {
    background: #fff;
    border-radius: 22px;
    padding: 22px 24px;
    margin: -34px auto 28px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 20px 50px -10px rgba(160, 108, 72, 0.25), 0 8px 16px -8px rgba(160, 108, 72, 0.15);
    position: relative; z-index: 2;
  }
  .seats-num {
    font-size: 46px; font-weight: 900; line-height: 1;
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    background: linear-gradient(135deg, #b07c3e, #6b4423);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .seats-info { flex: 1; }
  .seats-label {
    font-size: 13px; color: #6b4423; font-weight: 700;
  }
  .seats-label b { color: #2a1810; font-size: 15px; font-weight: 900; }
  .seats-bar {
    height: 7px; background: #f5e3c4; border-radius: 4px; overflow: hidden;
    margin-top: 9px;
  }
  .seats-bar > div {
    height: 100%; background: linear-gradient(90deg, #ff9558, #ff6b4a);
    border-radius: 4px;
    transition: width .6s ease;
  }

  .meta-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 28px;
  }
  .meta-cell {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 4px 14px -4px rgba(160, 108, 72, 0.15);
    border: 1px solid rgba(176, 124, 62, 0.12);
  }
  .meta-cell-icon { font-size: 18px; margin-bottom: 4px; }
  .meta-cell-label {
    font-size: 10px; color: #a06c48; font-weight: 800;
    text-transform: uppercase; letter-spacing: .12em;
  }
  .meta-cell-val {
    font-size: 15px; color: #2a1810; font-weight: 800; margin-top: 3px;
    line-height: 1.2;
  }

  .section { margin-bottom: 28px; }
  .section h2 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 24px; font-weight: 900; color: #2a1810;
    margin: 0 0 14px; letter-spacing: -.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .description {
    font-size: 16px; line-height: 1.75; color: #3d2818; white-space: pre-wrap;
    background: #fff; padding: 18px 20px; border-radius: 14px;
    box-shadow: 0 4px 14px -4px rgba(160, 108, 72, 0.12);
    border: 1px solid rgba(176, 124, 62, 0.1);
  }

  .bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .bullets li {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px 14px 14px;
    font-size: 15px;
    color: #2a1810;
    line-height: 1.45;
    font-weight: 600;
    box-shadow: 0 4px 14px -4px rgba(160, 108, 72, 0.12);
    border: 1px solid rgba(176, 124, 62, 0.1);
    border-right: 4px solid #b07c3e;
    transition: transform .2s, box-shadow .2s;
  }
  .bullets li:hover {
    transform: translateX(-3px);
    box-shadow: 0 8px 22px -4px rgba(160, 108, 72, 0.2);
  }

  /* ===== ABOUT ELIOR ===== */
  .about-card {
    background: linear-gradient(135deg, #2a1810 0%, #3d2818 100%);
    color: #f5e3c4;
    border-radius: 22px;
    padding: 24px 22px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .about-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 80% 20%, rgba(255, 170, 110, 0.15) 0%, transparent 60%);
    pointer-events: none;
  }
  .about-card .about-kicker {
    font-size: 11px; letter-spacing: .25em;
    color: #d4a574; font-weight: 800;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .about-card h3 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 22px; margin: 0 0 12px; color: #fff;
    font-weight: 900; letter-spacing: -.01em;
  }
  .about-card p {
    margin: 0; font-size: 15px; line-height: 1.65;
    color: #f5e3c4; white-space: pre-wrap;
  }

  /* ===== PAYMENT ===== */
  .pay-section {
    background: linear-gradient(135deg, #fff 0%, #fef5e3 100%);
    border-radius: 24px;
    padding: 28px 22px 22px;
    margin: 30px 0 14px;
    text-align: center;
    box-shadow: 0 20px 50px -10px rgba(160, 108, 72, 0.3);
    border: 2px solid rgba(176, 124, 62, 0.2);
    position: relative;
  }
  .pay-section::before {
    content: '🔥 הסבב הקרוב';
    position: absolute; top: -12px; right: 24px;
    background: linear-gradient(135deg, #ff6b4a, #ff9558);
    color: #fff; font-size: 11px; font-weight: 900;
    padding: 5px 12px; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(255, 107, 74, 0.3);
  }
  .pay-price {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 50px; font-weight: 900;
    margin-bottom: 2px; line-height: 1; letter-spacing: -.03em;
    background: linear-gradient(135deg, #b07c3e, #6b4423);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .pay-price-label {
    font-size: 13px; color: #6b4423; margin-bottom: 22px; font-weight: 700;
  }

  .btn {
    display: block; width: 100%; padding: 17px 18px;
    border-radius: 16px; font-size: 16px; font-weight: 900;
    text-decoration: none; text-align: center;
    border: none; cursor: pointer; font-family: inherit;
    margin-bottom: 10px;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, #ff9558, #ff6b4a);
    color: #fff;
    box-shadow: 0 12px 30px -8px rgba(255, 107, 74, 0.45);
    animation: btn-breathe 3s ease-in-out infinite;
  }
  @keyframes btn-breathe {
    0%, 100% { box-shadow: 0 12px 30px -8px rgba(255, 107, 74, 0.45); }
    50% { box-shadow: 0 16px 40px -8px rgba(255, 107, 74, 0.65); }
  }
  .btn-primary:hover {
    box-shadow: 0 16px 40px -8px rgba(255, 107, 74, 0.6);
  }
  .btn-secondary {
    background: #2a1810;
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(42, 24, 16, 0.3);
  }
  .btn-whatsapp {
    background: #fff;
    color: #25d366;
    border: 2px solid rgba(37, 211, 102, 0.25);
  }

  /* ===== STICKY CTA BAR ===== */
  .sticky-cta {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255, 248, 235, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1.5px solid rgba(176, 124, 62, 0.2);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
    z-index: 100;
    box-shadow: 0 -8px 30px -5px rgba(160, 108, 72, 0.18);
  }
  .sticky-cta-info {
    flex: 0 0 auto; min-width: 0;
  }
  .sticky-cta-price {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 22px; font-weight: 900; color: #2a1810; line-height: 1;
  }
  .sticky-cta-sub { font-size: 11px; color: #a06c48; font-weight: 700; margin-top: 2px; }
  .sticky-cta-btn {
    flex: 1;
    background: linear-gradient(135deg, #ff9558, #ff6b4a);
    color: #fff;
    border: none; border-radius: 14px;
    padding: 14px 18px;
    font-size: 15px; font-weight: 900;
    text-decoration: none; text-align: center;
    box-shadow: 0 8px 22px -6px rgba(255, 107, 74, 0.45);
    font-family: inherit; cursor: pointer;
    animation: btn-breathe 3s ease-in-out infinite;
  }
  .sticky-cta-btn:active { transform: scale(.97); }

  .sold-out {
    background: linear-gradient(135deg, #fff, #fef5e3);
    border: 2px solid rgba(255, 107, 74, 0.3);
    color: #c2410c;
    border-radius: 16px;
    padding: 18px; text-align: center;
    font-weight: 800; margin-bottom: 12px; font-size: 15px;
  }

  .footer {
    text-align: center; margin-top: 36px;
    color: #a06c48; font-size: 12px;
    font-weight: 600;
  }
  .footer b { color: #2a1810; }

  .loading, .error {
    text-align: center; padding: 100px 20px; color: #a06c48;
    font-size: 16px; font-weight: 700;
  }
  .error b { color: #c2410c; display: block; margin-bottom: 6px; font-size: 18px; }

  @media (max-width: 380px) {
    .hero { padding: 50px 18px 60px; }
    .hero h1 { font-size: 30px; }
    .hero-emoji { font-size: 64px; }
    .pay-price { font-size: 40px; }
    .meta-grid { grid-template-columns: 1fr; }
    .wrap { padding-left: 16px; padding-right: 16px; }
  }
  @media (min-width: 700px) {
    .hero h1 { font-size: 46px; }
    .tagline { font-size: 18px; }
  }
</style>
</head>
<body>
  <div id="root">
    <div class="loading">⏳ טוען...</div>
  </div>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyB1c6rZVcGrX50UbhEMx3Ra6uaO_S5Fb5o",
  authDomain:        "elior-studio.firebaseapp.com",
  databaseURL:       "https://elior-studio-default-rtdb.firebaseio.com",
  projectId:         "elior-studio",
  storageBucket:     "elior-studio.firebasestorage.app",
  messagingSenderId: "719956484293",
  appId:             "1:719956484293:web:4e1be740d9e49a709350ac"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function getId(){
  const p = new URLSearchParams(location.search);
  return p.get('id') || '';
}

function fmtMoney(n){
  return '₪' + Math.abs(n).toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:0});
}

function fmtDate(s){
  if(!s) return '';
  try {
    return new Date(s).toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'});
  } catch(e){ return s; }
}

function daysUntil(s){
  if(!s) return null;
  try {
    const d = new Date(s);
    const now = new Date();
    now.setHours(0,0,0,0);
    d.setHours(0,0,0,0);
    return Math.round((d - now) / 86400000);
  } catch(e){ return null; }
}

function escHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function render(w){
  const root = document.getElementById('root');
  const total = w.totalSeats || 0;
  const taken = w.seatsTaken || 0;
  const free = Math.max(0, total - taken);
  const pct = total ? Math.min(100, (taken / total) * 100) : 0;
  const soldOut = total > 0 && free === 0;
  const lowSeats = !soldOut && free > 0 && free <= 3;
  const days = daysUntil(w.startDate);

  // Urgency chip text
  let urgencyTxt = '';
  if(soldOut){ urgencyTxt = '⏳ אזל המלאי'; }
  else if(lowSeats && days !== null && days > 0){ urgencyTxt = '🔥 ' + free + ' מקומות אחרונים · מתחיל בעוד ' + days + ' ימים'; }
  else if(lowSeats){ urgencyTxt = '🔥 ' + free + ' מקומות אחרונים'; }
  else if(days !== null && days > 0 && days <= 21){ urgencyTxt = '⏰ מתחיל בעוד ' + days + ' ימים'; }
  else if(days !== null && days === 0){ urgencyTxt = '🎬 מתחיל היום'; }

  // Meta cells with icons
  const metaIcons = { sessions: '🎓', when: '📅', startDate: '🗓️', price: '💰' };
  const metaItems = [];
  if(w.sessions) metaItems.push({ icon: '🎓', label: 'מפגשים', val: w.sessions });
  if(w.when) metaItems.push({ icon: '📅', label: 'מתי', val: w.when });
  if(w.startDate) metaItems.push({ icon: '🗓️', label: 'התחלה', val: fmtDate(w.startDate) });
  if(w.price) metaItems.push({ icon: '💰', label: 'מחיר', val: fmtMoney(w.price) });

  // Payment buttons
  let payHtml = '';
  let stickyHtml = '';
  if(soldOut){
    payHtml = '<div class="sold-out">⏳ אזל המלאי — להתעדכן בסדנא הבאה</div>';
    if(w.contact){
      const wa = w.contact.replace(/[^0-9]/g,'').replace(/^0/, '972');
      const msg = encodeURIComponent('היי אליאור, אשמח להתעדכן בסדנא הבאה של ' + (w.title||''));
      payHtml += '<a class="btn btn-whatsapp" href="https://wa.me/' + wa + '?text=' + msg + '" target="_blank">💬 וואטסאפ — להתעדכן בסדנא הבאה</a>';
      stickyHtml = '<a class="sticky-cta-btn" href="https://wa.me/' + wa + '?text=' + msg + '" target="_blank">💬 רשום אותי לסדנא הבאה</a>';
    }
  } else {
    if(w.bitLink) payHtml += '<a class="btn btn-primary" href="' + escHtml(w.bitLink) + '" target="_blank">💛 תפוס כיסא — תשלום בביט</a>';
    if(w.growLink) payHtml += '<a class="btn btn-secondary" href="' + escHtml(w.growLink) + '" target="_blank">💳 תפוס כיסא — כרטיס אשראי</a>';
    if(w.contact){
      const wa = w.contact.replace(/[^0-9]/g,'').replace(/^0/, '972');
      const msg = encodeURIComponent('היי אליאור, יש לי שאלה על הסדנא ' + (w.title||''));
      payHtml += '<a class="btn btn-whatsapp" href="https://wa.me/' + wa + '?text=' + msg + '" target="_blank">💬 שאלה לפני התשלום? וואטסאפ</a>';
    }
    // sticky uses Bit if exists, otherwise Grow
    const primaryLink = w.bitLink || w.growLink;
    if(primaryLink) {
      stickyHtml = '<a class="sticky-cta-btn" href="' + escHtml(primaryLink) + '" target="_blank">תפוס כיסא →</a>';
    }
  }

  root.innerHTML =
    '<div class="hero">' +
      '<div class="brand">אליאור רביד · אולפן</div>' +
      (urgencyTxt ? '<div class="urgency-chip">' + urgencyTxt + '</div>' : '') +
      '<div class="hero-emoji">' + (w.emoji || '🎓') + '</div>' +
      '<h1>' + escHtml(w.title || 'סדנא') + '</h1>' +
      (w.tagline ? '<div class="tagline">' + escHtml(w.tagline) + '</div>' : '') +
    '</div>' +

    '<div class="wrap">' +

      (total ? (
        '<div class="seats-card">' +
          '<div class="seats-num">' + free + '</div>' +
          '<div class="seats-info">' +
            '<div class="seats-label">' +
              (soldOut ? '<b>אזל המלאי</b>' : ('<b>מקומות פנויים</b> מתוך ' + total)) +
            '</div>' +
            '<div class="seats-bar"><div style="width:' + pct + '%"></div></div>' +
          '</div>' +
        '</div>'
      ) : '') +

      (metaItems.length ? (
        '<div class="meta-grid">' + metaItems.map(m =>
          '<div class="meta-cell">' +
            '<div class="meta-cell-icon">' + m.icon + '</div>' +
            '<div class="meta-cell-label">' + escHtml(m.label) + '</div>' +
            '<div class="meta-cell-val">' + escHtml(m.val) + '</div>' +
          '</div>'
        ).join('') + '</div>'
      ) : '') +

      (w.bullets && w.bullets.length ? (
        '<div class="section"><h2>✨ מה תקבלו</h2>' +
        '<ul class="bullets">' + w.bullets.map(b => '<li>' + escHtml(b) + '</li>').join('') + '</ul></div>'
      ) : '') +

      (w.description ? (
        '<div class="section"><h2>📖 על הסדנא</h2>' +
        '<div class="description">' + escHtml(w.description) + '</div></div>'
      ) : '') +

      (w.about ? (
        '<div class="about-card">' +
          '<div class="about-kicker">המנחה</div>' +
          '<h3>אליאור רביד · מפיק מוזיקלי</h3>' +
          '<p>' + escHtml(w.about) + '</p>' +
        '</div>'
      ) : '') +

      '<div class="pay-section">' +
        (w.price ? (
          '<div class="pay-price">' + fmtMoney(w.price) + '</div>' +
          '<div class="pay-price-label">לכל הסדנא · ' + (w.sessions||'') + ' מפגשים</div>'
        ) : '') +
        payHtml +
      '</div>' +

      '<div class="footer">סדנא של <b>אליאור רביד</b> · מפיק מוזיקלי</div>' +
    '</div>' +

    (stickyHtml ? (
      '<div class="sticky-cta">' +
        '<div class="sticky-cta-info">' +
          (w.price ? '<div class="sticky-cta-price">' + fmtMoney(w.price) + '</div>' : '') +
          (free > 0 && !soldOut ? '<div class="sticky-cta-sub">' + free + ' מקומות פנויים</div>' : '') +
          (soldOut ? '<div class="sticky-cta-sub">אזל המלאי</div>' : '') +
        '</div>' +
        stickyHtml +
      '</div>'
    ) : '');

  document.title = (w.title || 'סדנא') + ' · אליאור רביד';
}

function renderError(msg){
  document.getElementById('root').innerHTML =
    '<div class="error"><b>אופס</b>' + escHtml(msg) + '</div>';
}

const id = getId();
if(!id){
  renderError('לא צוין מזהה סדנא. בדוק את הקישור.');
} else {
  db.ref('studio_data/workshops').on('value', snap => {
    const list = snap.val() || [];
    const w = (Array.isArray(list) ? list : Object.values(list)).find(x => x && x.id === id);
    if(!w){
      renderError('הסדנא לא נמצאה.');
      return;
    }
    if(w.active === false){
      renderError('הסדנא הזו לא פעילה כרגע.');
      return;
    }
    render(w);
  }, err => {
    console.error(err);
    renderError('שגיאה בטעינה. נסה לרענן.');
  });
}
