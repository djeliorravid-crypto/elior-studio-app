<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סדנא · אליאור רביד</title>
<meta name="theme-color" content="#1a1410">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Heebo', system-ui, sans-serif;
    background: linear-gradient(180deg, #1a1410 0%, #0c0807 100%);
    color: #f5ede2;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 0 18px 60px; }
  .wrap { max-width: 560px; margin: 0 auto; padding-top: 36px; }
  .brand {
    text-align: center; font-size: 11px; letter-spacing: .25em;
    color: #b07c3e; font-weight: 800; margin-bottom: 28px;
    text-transform: uppercase;
  }
  .hero {
    text-align: center; margin-bottom: 26px;
  }
  .hero-emoji {
    font-size: 64px; line-height: 1; margin-bottom: 14px;
  }
  .hero h1 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 32px; font-weight: 900; line-height: 1.15;
    margin: 0 0 10px; letter-spacing: -.02em;
    color: #fff;
  }
  .tagline {
    font-size: 16px; color: #d4b896; line-height: 1.5; max-width: 460px; margin: 0 auto;
  }
  .seats-card {
    background: rgba(212, 165, 116, 0.08);
    border: 1.5px solid rgba(212, 165, 116, 0.25);
    border-radius: 18px;
    padding: 18px 22px;
    margin: 24px 0;
    display: flex; align-items: center; gap: 14px;
  }
  .seats-num {
    font-size: 38px; font-weight: 900; color: #e8c895; line-height: 1;
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
  }
  .seats-label {
    flex: 1;
    font-size: 14px; color: #d4b896;
  }
  .seats-label b { color: #fff; font-weight: 800; }
  .seats-bar {
    height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden;
    margin-top: 7px;
  }
  .seats-bar > div {
    height: 100%; background: linear-gradient(90deg, #d4a574, #a06c48);
    transition: width .5s;
  }
  .meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 22px;
  }
  .meta-cell {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212, 165, 116, 0.15);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .meta-cell-label {
    font-size: 11px; color: #b07c3e; font-weight: 800;
    text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px;
  }
  .meta-cell-val { font-size: 15px; color: #fff; font-weight: 700; }
  .section { margin-bottom: 26px; }
  .section h2 {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 19px; font-weight: 900; color: #fff;
    margin: 0 0 12px; letter-spacing: -.01em;
  }
  .description {
    font-size: 15px; line-height: 1.7; color: #e3d4be; white-space: pre-wrap;
  }
  .bullets { list-style: none; padding: 0; margin: 0; }
  .bullets li {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212, 165, 116, 0.12);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    font-size: 15px;
    color: #f5ede2;
    line-height: 1.4;
  }
  .pay-section {
    background: linear-gradient(135deg, rgba(212, 165, 116, 0.12), rgba(160, 108, 72, 0.08));
    border: 1.5px solid rgba(212, 165, 116, 0.3);
    border-radius: 20px;
    padding: 22px 20px;
    margin: 30px 0 20px;
    text-align: center;
  }
  .pay-price {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-size: 44px; font-weight: 900; color: #fff;
    margin-bottom: 2px; line-height: 1; letter-spacing: -.03em;
  }
  .pay-price-label {
    font-size: 12px; color: #d4b896; margin-bottom: 18px;
  }
  .btn {
    display: block; width: 100%; padding: 16px 18px;
    border-radius: 14px; font-size: 16px; font-weight: 900;
    text-decoration: none; text-align: center;
    border: none; cursor: pointer; font-family: inherit;
    margin-bottom: 10px;
    transition: transform .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: linear-gradient(135deg, #e8c895, #b07c3e);
    color: #1a1410;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #f5ede2;
    border: 1.5px solid rgba(212, 165, 116, 0.3);
  }
  .btn-whatsapp {
    background: rgba(37, 211, 102, 0.12);
    color: #25d366;
    border: 1.5px solid rgba(37, 211, 102, 0.3);
  }
  .sold-out {
    background: rgba(220, 38, 38, 0.12);
    border: 1.5px solid rgba(220, 38, 38, 0.3);
    color: #fca5a5;
    border-radius: 14px;
    padding: 16px; text-align: center;
    font-weight: 800; margin-bottom: 12px;
  }
  .footer {
    text-align: center; margin-top: 40px;
    color: #6b5847; font-size: 12px;
  }
  .footer b { color: #b07c3e; }
  .loading, .error {
    text-align: center; padding: 80px 20px; color: #b07c3e;
    font-size: 16px;
  }
  .error b { color: #fca5a5; display: block; margin-bottom: 6px; font-size: 18px; }
  @media (max-width: 380px) {
    .hero h1 { font-size: 26px; }
    .hero-emoji { font-size: 52px; }
    .pay-price { font-size: 36px; }
    .meta { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="root">
    <div class="loading">⏳ טוען...</div>
  </div>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyB1c6rZVcGrX50UbhEMx3Ra6uaO_S5Fb5o",
  authDomain:        "elior-studio.firebaseapp.com",
  databaseURL:       "https://elior-studio-default-rtdb.firebaseio.com",
  projectId:         "elior-studio",
  storageBucket:     "elior-studio.firebasestorage.app",
  messagingSenderId: "719956484293",
  appId:             "1:719956484293:web:4e1be740d9e49a709350ac"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function getId(){
  const p = new URLSearchParams(location.search);
  return p.get('id') || '';
}

function fmtMoney(n){
  return '₪' + Math.abs(n).toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:0});
}

function fmtDate(s){
  if(!s) return '';
  try {
    return new Date(s).toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'});
  } catch(e){ return s; }
}

function escHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function render(w){
  const root = document.getElementById('root');
  const total = w.totalSeats || 0;
  const taken = w.seatsTaken || 0;
  const free = Math.max(0, total - taken);
  const pct = total ? Math.min(100, (taken / total) * 100) : 0;
  const soldOut = free === 0;
  const meta = [];
  if(w.sessions) meta.push({label:'מפגשים', val: w.sessions});
  if(w.when) meta.push({label:'מתי', val: w.when});
  if(w.startDate) meta.push({label:'התחלה', val: fmtDate(w.startDate)});
  if(w.price) meta.push({label:'מחיר', val: fmtMoney(w.price)});

  let payHtml = '';
  if(soldOut){
    payHtml = '<div class="sold-out">⏳ אזל המלאי — להתעדכן בסדנא הבאה</div>';
    if(w.contact){
      const wa = w.contact.replace(/[^0-9]/g,'').replace(/^0/, '972');
      payHtml += '<a class="btn btn-whatsapp" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('היי אליאור, אשמח להתעדכן בסדנא הבאה של ' + (w.title||'')) + '" target="_blank">💬 וואטסאפ — להתעדכן בסדנא הבאה</a>';
    }
  } else {
    if(w.bitLink) payHtml += '<a class="btn btn-primary" href="' + escHtml(w.bitLink) + '" target="_blank">💛 תפוס כיסא — תשלום בביט</a>';
    if(w.growLink) payHtml += '<a class="btn btn-secondary" href="' + escHtml(w.growLink) + '" target="_blank">💳 תפוס כיסא — כרטיס אשראי</a>';
    if(w.contact){
      const wa = w.contact.replace(/[^0-9]/g,'').replace(/^0/, '972');
      payHtml += '<a class="btn btn-whatsapp" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('היי אליאור, יש לי שאלה על הסדנא ' + (w.title||'')) + '" target="_blank">💬 שאלה לפני התשלום? וואטסאפ</a>';
    }
  }

  root.innerHTML =
    '<div class="wrap">' +
      '<div class="brand">אליאור רביד · אולפן</div>' +
      '<div class="hero">' +
        '<div class="hero-emoji">' + (w.emoji || '🎓') + '</div>' +
        '<h1>' + escHtml(w.title || 'סדנא') + '</h1>' +
        (w.tagline ? '<div class="tagline">' + escHtml(w.tagline) + '</div>' : '') +
      '</div>' +

      (total ? (
        '<div class="seats-card">' +
          '<div class="seats-num">' + free + '</div>' +
          '<div class="seats-label">' +
            (soldOut ? '<b>אזל המלאי</b>' : ('<b>מקומות פנויים</b> מתוך ' + total)) +
            '<div class="seats-bar"><div style="width:' + pct + '%"></div></div>' +
          '</div>' +
        '</div>'
      ) : '') +

      (meta.length ? (
        '<div class="meta">' + meta.map(m =>
          '<div class="meta-cell"><div class="meta-cell-label">' + escHtml(m.label) + '</div><div class="meta-cell-val">' + escHtml(m.val) + '</div></div>'
        ).join('') + '</div>'
      ) : '') +

      (w.description ? (
        '<div class="section"><h2>📖 על הסדנא</h2>' +
        '<div class="description">' + escHtml(w.description) + '</div></div>'
      ) : '') +

      (w.bullets && w.bullets.length ? (
        '<div class="section"><h2>✨ מה תקבלו</h2>' +
        '<ul class="bullets">' + w.bullets.map(b => '<li>' + escHtml(b) + '</li>').join('') + '</ul></div>'
      ) : '') +

      '<div class="pay-section">' +
        (w.price ? (
          '<div class="pay-price">' + fmtMoney(w.price) + '</div>' +
          '<div class="pay-price-label">לכל הסדנא · ' + (w.sessions||'') + ' מפגשים</div>'
        ) : '') +
        payHtml +
      '</div>' +

      '<div class="footer">סדנא של <b>אליאור רביד</b> · מפיק מוזיקלי</div>' +
    '</div>';

  document.title = (w.title || 'סדנא') + ' · אליאור רביד';
}

function renderError(msg){
  document.getElementById('root').innerHTML =
    '<div class="error"><b>אופס</b>' + escHtml(msg) + '</div>';
}

const id = getId();
if(!id){
  renderError('לא צוין מזהה סדנא. בדוק את הקישור.');
} else {
  db.ref('studio_data/workshops').on('value', snap => {
    const list = snap.val() || [];
    const w = (Array.isArray(list) ? list : Object.values(list)).find(x => x && x.id === id);
    if(!w){
      renderError('הסדנא לא נמצאה.');
      return;
    }
    if(w.active === false){
      renderError('הסדנא הזו לא פעילה כרגע.');
      return;
    }
    render(w);
  }, err => {
    console.error(err);
    renderError('שגיאה בטעינה. נסה לרענן.');
  });
}
</script>
</body>
</html>
