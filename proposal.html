<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הצעת מחיר · אליאור רביד</title>
<meta name="theme-color" content="#f5e8d3">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Heebo', system-ui, sans-serif;
    background: #fdf8f0;
    color: #2a1810;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 0 16px 90px; }
  .wrap { max-width: 720px; margin: 0 auto; padding-top: 22px; }

  /* ===== HERO ===== */
  .hero {
    background: linear-gradient(160deg, #fff 0%, #fef5e3 100%);
    border: 1.5px solid rgba(176,124,62,0.2);
    border-radius: 24px;
    padding: 36px 26px 32px;
    text-align: center;
    margin-bottom: 16px;
    box-shadow: 0 14px 40px -16px rgba(160,108,72,0.25);
  }
  .hero .badge {
    display: inline-block;
    font-size: 11px; letter-spacing: .28em;
    color: #a06c48; font-weight: 800;
    text-transform: uppercase;
    padding: 6px 14px;
    border: 1px solid rgba(176,124,62,0.35);
    border-radius: 20px;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-family: 'Frank Ruhl Libre','Heebo',serif;
    font-size: 42px; font-weight: 900;
    margin: 0 0 6px; letter-spacing: -.025em;
    color: #2a1810;
    line-height: 1.05;
  }
  .hero .for {
    font-size: 17px; color: #6b4423;
    margin-bottom: 22px;
  }
  .hero .for b { color: #2a1810; }
  .hero .promise {
    font-size: 16px; color: #2a1810;
    line-height: 1.7;
    max-width: 540px; margin: 0 auto;
    padding: 18px 20px;
    background: rgba(212,165,116,0.12);
    border-radius: 14px;
    border-right: 3px solid #b07c3e;
  }

  /* ===== SECTION TITLE ===== */
  .section-title {
    font-family: 'Frank Ruhl Libre','Heebo',serif;
    font-size: 22px; font-weight: 900;
    color: #2a1810;
    margin: 28px 0 14px;
    padding-right: 14px;
    border-right: 4px solid #ff6b4a;
    line-height: 1.2;
  }

  /* ===== CARD ===== */
  .card {
    background: #fff;
    border: 1px solid rgba(176,124,62,0.2);
    border-radius: 18px;
    padding: 22px 24px;
    margin-bottom: 14px;
    box-shadow: 0 10px 30px -14px rgba(160,108,72,0.2);
  }
  .card p { font-size: 15px; line-height: 1.7; color: #3d2818; margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }

  /* ===== INCLUDED CHECKLIST ===== */
  .included-list { display: flex; flex-direction: column; gap: 10px; }
  .included-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(176,124,62,0.18);
  }
  .included-item:last-child { border-bottom: none; }
  .included-item .icon {
    width: 26px; height: 26px;
    background: rgba(22,163,74,0.14);
    color: #16a34a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px;
    flex-shrink: 0;
  }
  .included-item .text {
    font-size: 15px; color: #2a1810;
    font-weight: 600; line-height: 1.55;
  }
  .included-item .text small {
    display: block;
    font-size: 12.5px; color: #6b4423;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ===== PROCESS ===== */
  .process {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .process-step {
    background: rgba(212,165,116,0.10);
    border: 1px solid rgba(176,124,62,0.2);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
  }
  .process-num {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #ff9558, #ff6b4a);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px;
    margin: 0 auto 10px;
    box-shadow: 0 6px 14px -4px rgba(255,107,74,0.4);
  }
  .process-title {
    font-family: 'Frank Ruhl Libre','Heebo',serif;
    font-size: 13px; font-weight: 900;
    color: #2a1810;
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .process-desc {
    font-size: 11px; color: #6b4423;
    line-height: 1.4;
  }

  /* ===== PRICE TABLE ===== */
  table.price {
    width: 100%; border-collapse: collapse;
  }
  table.price td {
    padding: 12px 4px;
    border-bottom: 1px dashed rgba(176,124,62,0.25);
    font-size: 15px; color: #3d2818;
  }
  table.price tr:last-child td { border-bottom: none; }
  table.price td:last-child {
    text-align: left;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    white-space: nowrap;
  }

  /* ===== TOTAL CARD — the big one ===== */
  .total-card {
    background: linear-gradient(135deg, #2a1810 0%, #3d2818 100%);
    color: #f5e8d3;
    border-radius: 22px;
    padding: 32px 26px;
    text-align: center;
    margin-bottom: 14px;
    box-shadow: 0 20px 50px -16px rgba(42,24,16,0.45);
  }
  .total-label {
    font-size: 12px; letter-spacing: .25em;
    color: #d4a574; font-weight: 800; margin-bottom: 8px;
    text-transform: uppercase;
  }
  .total-amount {
    font-family: 'Frank Ruhl Libre','Heebo',serif;
    font-size: 56px; font-weight: 900;
    color: #f5e8d3;
    line-height: 1;
    margin-bottom: 14px;
    letter-spacing: -.02em;
  }
  .total-payment {
    font-size: 14px; color: rgba(245,232,211,0.85);
    line-height: 1.5;
    padding-top: 14px;
    border-top: 1px solid rgba(212,165,116,0.25);
  }
  .total-payment b { color: #f5e8d3; }

  /* ===== WHY ME ===== */
  .why-me {
    background: linear-gradient(135deg, #fef5e3 0%, #fff 100%);
    border: 2px solid rgba(176,124,62,0.3);
    border-radius: 18px;
    padding: 26px 24px;
    margin-bottom: 14px;
  }
  .why-item {
    display: flex; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed rgba(176,124,62,0.2);
  }
  .why-item:last-child { border-bottom: none; padding-bottom: 0; }
  .why-item:first-child { padding-top: 0; }
  .why-item .star {
    font-size: 22px;
    color: #b07c3e;
    flex-shrink: 0;
    line-height: 1.2;
  }
  .why-item .text {
    font-size: 15px; color: #2a1810;
    line-height: 1.6;
  }
  .why-item .text b { color: #a06c48; }

  /* ===== CTA — sticky on mobile-friendly position ===== */
  .cta-block {
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    color: #fff;
    border-radius: 22px;
    padding: 30px 26px;
    text-align: center;
    margin: 22px 0 14px;
    box-shadow: 0 20px 50px -16px rgba(22,163,74,0.45);
  }
  .cta-title {
    font-family: 'Frank Ruhl Libre','Heebo',serif;
    font-size: 26px; font-weight: 900;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .cta-sub {
    font-size: 14.5px; opacity: .92;
    margin-bottom: 22px; line-height: 1.55;
  }
  .btn-wa {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff;
    color: #15803d;
    border: none; border-radius: 14px;
    padding: 16px 32px;
    font-size: 17px; font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    box-shadow: 0 14px 30px -8px rgba(0,0,0,0.25);
    transition: transform .12s;
  }
  .btn-wa:active { transform: scale(.97); }

  /* ===== VALIDITY ===== */
  .validity {
    text-align: center;
    padding: 12px 18px;
    background: rgba(212,165,116,0.12);
    border-radius: 12px;
    font-size: 13.5px; color: #6b4423;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .validity b { color: #2a1810; }
  .validity.expired {
    background: rgba(220,38,38,0.10);
    color: #991b1b;
  }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center;
    margin-top: 24px;
    color: #a06c48;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.7;
  }
  .footer b { color: #6b4423; }

  /* ===== LOADING / ERROR ===== */
  .loading, .error {
    text-align: center; padding: 100px 20px; color: #a06c48;
    font-size: 16px; font-weight: 700;
  }
  .error b { color: #c2410c; display: block; margin-bottom: 6px; font-size: 18px; }

  @media (max-width: 540px) {
    .hero { padding: 30px 20px 26px; }
    .hero h1 { font-size: 32px; }
    .total-amount { font-size: 44px; }
    .process { grid-template-columns: repeat(2, 1fr); }
    .cta-title { font-size: 22px; }
  }
</style>
</head>
<body>
  <div id="root"><div class="loading">⏳ טוען...</div></div>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyB1c6rZVcGrX50UbhEMx3Ra6uaO_S5Fb5o",
  authDomain:        "elior-studio.firebaseapp.com",
  databaseURL:       "https://elior-studio-default-rtdb.firebaseio.com",
  projectId:         "elior-studio",
  storageBucket:     "elior-studio.firebasestorage.app",
  messagingSenderId: "719956484293",
  appId:             "1:719956484293:web:4e1be740d9e49a709350ac"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const KIND_LABEL = { single: 'הפקת סינגל', multi: 'מספר שירים', ep: 'EP', album: 'אלבום', other: 'הפקה' };
const KIND_HERO_PROMISE = {
  single: 'הסינגל שלך — מוגמר מקצה לקצה, מוכן לעלות לכל הפלטפורמות, באולפן רביד.',
  multi:  'הפרויקט שלך — כל שיר מוגמר לעומק, באותו סטנדרט שמושמע ברדיו, באולפן רביד.',
  ep:     'ה-EP שלך — חמישה שירים, חוויה אחת אחידה, מקצועיות שלא מתפשרים עליה.',
  album:  'האלבום שלך — פרויקט מלא, כל הפקה מוקפדת, כל סשן מתועד, וכל פרט נכלל.',
  other:  'הפרויקט שלך — מוגמר מקצה לקצה, באולפן רביד.'
};
const PER_SONG_SUFFIX_PLURAL = ' (לכל שיר)';

function getId(){ return new URLSearchParams(location.search).get('id') || ''; }
function fmtMoney(n){ return '₪' + Math.abs(n).toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return ''; try { return new Date(s).toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'}); } catch(e){ return s; } }
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function digits(s){ return String(s||'').replace(/\D/g, ''); }

function _includedItems(plural){
  const ps = plural ? PER_SONG_SUFFIX_PLURAL : '';
  return [
    { t: 'הפקה מוזיקלית מלאה' + ps, s: 'מהסקיצה ועד הצליל הסופי — בניית האריינג׳מנט, בחירת כלים, סאונד וקצב' },
    { t: 'הקלטת נגן' + ps,              s: 'נגן מקצועי בהתאמה לסגנון השיר — באולפן, עם סאונד מלא' },
    { t: 'מיקס באולפן' + ps,            s: 'איזון, EQ, דינמיקה, אפקטים — הסאונד שמכין את השיר לרדיו' },
    { t: 'מאסטרינג מקצועי' + ps,        s: 'אופטימיזציה לכל הפלטפורמות (Spotify, Apple Music, YouTube)' },
    { t: 'עד 5 סבבי תיקונים' + ps,      s: 'מספר נדיב שמכסה כמעט כל פרויקט. כל סבב = רשימת הערות אחת' },
    { t: 'קובץ מאסטר סופי',             s: 'WAV באיכות 24-bit, מוכן לאחסון ולהפצה' },
    { t: 'פלייבק מלא',                   s: 'גרסה אינסטרומנטלית של השיר — להופעות, רילז, ועוד' },
    { t: 'ערוצים נפרדים להופעות חיות',  s: 'סטמים — כל כלי בנפרד, מוכן לליין-אפ של הופעה' },
    { t: 'הסכם דיגיטלי חתום',           s: 'PDF במייל. כל מה שאתה רואה כאן — מעוגן בכתב' }
  ];
}

function _processSteps(){
  return [
    { num: 1, title: 'חוזה דיגיטלי',   desc: 'חתימה ב-3 דק׳, עותק במייל' },
    { num: 2, title: 'תיאום וסשנים',    desc: 'נקבע ראשון תוך ימים' },
    { num: 3, title: 'הפקה ומיקס',      desc: 'עד 6 שבועות לפרויקט' },
    { num: 4, title: 'מסירת הקבצים',    desc: 'עם השלמת התשלום' }
  ];
}

function _whyMe(){
  return [
    { star: '✓', html: '<b>5 סבבי תיקונים</b> — רוב המפיקים נותנים 2. אצלי יש לך מרחב לדייק.' },
    { star: '✓', html: '<b>הסכם דיגיטלי</b> שמפרט בדיוק מה אתה מקבל ומה אני מתחייב. אין הפתעות.' },
    { star: '✓', html: '<b>הקבצים שלך לחלוטין</b> — מאסטר, פלייבק, וערוצי הופעות. הזכויות שלך מלאות.' },
    { star: '✓', html: '<b>תקשורת רציפה</b> — עדכון אישי בכל שלב משמעותי, לא נעלמים באמצע.' }
  ];
}

function render(p){
  const total = (p.items || []).reduce((s, it) => s + (parseFloat(it.price) || 0), 0);
  const halfA = Math.round(total / 2);
  const halfB = total - halfA;
  const expired = p.validUntil && new Date(p.validUntil + 'T23:59:59') < new Date();
  const kindLabel = KIND_LABEL[p.projectKind] || KIND_LABEL.other;
  const plural = ['multi','ep','album'].includes(p.projectKind);
  const promiseText = KIND_HERO_PROMISE[p.projectKind] || KIND_HERO_PROMISE.other;

  // Itemized table
  const priceRows = (p.items || []).map(it =>
    '<tr><td>' + escHtml(it.label || '') + '</td><td>' + fmtMoney(it.price || 0) + '</td></tr>'
  ).join('');

  // What's included
  const includedHtml = _includedItems(plural).map(it =>
    '<div class="included-item">' +
      '<div class="icon">✓</div>' +
      '<div class="text">' + escHtml(it.t) + '<small>' + escHtml(it.s) + '</small></div>' +
    '</div>'
  ).join('');

  // Process
  const processHtml = _processSteps().map(st =>
    '<div class="process-step">' +
      '<div class="process-num">' + st.num + '</div>' +
      '<div class="process-title">' + escHtml(st.title) + '</div>' +
      '<div class="process-desc">' + escHtml(st.desc) + '</div>' +
    '</div>'
  ).join('');

  // Why me
  const whyHtml = _whyMe().map(w =>
    '<div class="why-item">' +
      '<div class="star">' + w.star + '</div>' +
      '<div class="text">' + w.html + '</div>' +
    '</div>'
  ).join('');

  // Payment terms
  const paymentText = p.paymentTerms && p.paymentTerms.trim()
    ? p.paymentTerms
    : fmtMoney(halfA) + ' עם תחילת העבודה · ' + fmtMoney(halfB) + ' בשלב המיקס';

  // CTA — WhatsApp default, with optional per-proposal phone override
  const PRODUCER_DEFAULT_PHONE = '972535242124';
  const phone = digits(p.producerPhone || PRODUCER_DEFAULT_PHONE);
  const waMsg = 'שלום אליאור, ראיתי את הצעת המחיר ל-' + (p.clientName || '') + ' — אשמח להמשיך.';

  document.getElementById('root').innerHTML =
    '<div class="wrap">' +
      // HERO
      '<div class="hero">' +
        '<div class="badge">אליאור רביד · אולפן</div>' +
        '<h1>הצעה ל' + escHtml(p.clientName || '') + '</h1>' +
        '<div class="for">' + escHtml(kindLabel) + (p.projectDescription ? ' · ' + escHtml(p.projectDescription) : '') + '</div>' +
        '<div class="promise">' + escHtml(promiseText) + '</div>' +
      '</div>' +

      // WHAT'S INCLUDED
      '<div class="section-title">מה תקבל בפרויקט</div>' +
      '<div class="card">' +
        '<div class="included-list">' + includedHtml + '</div>' +
      '</div>' +

      // PROCESS
      '<div class="section-title">איך זה עובד</div>' +
      '<div class="process">' + processHtml + '</div>' +

      // PRICE BREAKDOWN
      '<div class="section-title">פירוט המחיר</div>' +
      '<div class="card">' +
        '<table class="price">' + priceRows + '</table>' +
      '</div>' +

      // BIG TOTAL CARD
      '<div class="total-card">' +
        '<div class="total-label">סה"כ להפקה מלאה</div>' +
        '<div class="total-amount">' + fmtMoney(total) + '</div>' +
        '<div class="total-payment">' +
          '<b>תנאי תשלום:</b><br>' +
          escHtml(paymentText) +
        '</div>' +
      '</div>' +

      // WHY ME
      '<div class="section-title">למה לעבוד איתי</div>' +
      '<div class="why-me">' + whyHtml + '</div>' +

      // NOTES (if any)
      (p.notes ? '<div class="section-title">הערות לפרויקט הזה</div>' +
        '<div class="card"><p style="white-space:pre-line">' + escHtml(p.notes) + '</p></div>' : '') +

      // VALIDITY
      (p.validUntil
        ? '<div class="validity' + (expired ? ' expired' : '') + '">' +
            (expired
              ? '⚠️ ההצעה פגה תוקף ב-<b>' + escHtml(fmtDate(p.validUntil)) + '</b>. אשמח לדבר ולעדכן הצעה חדשה.'
              : 'ההצעה תקפה עד <b>' + escHtml(fmtDate(p.validUntil)) + '</b>') +
          '</div>'
        : '') +

      // CTA — big green WhatsApp
      '<div class="cta-block">' +
        '<div class="cta-title">בוא נצא לעבודה</div>' +
        '<div class="cta-sub">תוך דקה אנחנו בקשר. אענה אישית.</div>' +
        '<a class="btn-wa" href="https://wa.me/' + phone + '?text=' + encodeURIComponent(waMsg) + '" target="_blank" rel="noopener">' +
          '💬 דבר איתי בוואטסאפ' +
        '</a>' +
      '</div>' +

      '<div class="footer">' +
        'הצעת מחיר של <b>' + escHtml(p.producerName || 'אליאור רביד') + '</b><br>' +
        'מפיק מוזיקלי · אולפן רביד' +
      '</div>' +
    '</div>';

  document.title = 'הצעת מחיר — ' + (p.clientName || 'אליאור רביד');
}

function renderError(msg){
  document.getElementById('root').innerHTML =
    '<div class="error"><b>אופס</b><div style="white-space:pre-line">' + escHtml(msg) + '</div>' +
    '<div style="margin-top:18px"><button onclick="location.reload()" style="background:linear-gradient(135deg,#ff9558,#ff6b4a);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit">🔄 נסה שוב</button></div>' +
    '</div>';
}

const id = getId();
if (!id) {
  renderError('לא צוין מזהה הצעה. בדוק את הקישור.');
} else {
  (async function load(){
    function handle(data){
      if (!data) { renderError('ההצעה לא נמצאה.'); return false; }
      const arr = Array.isArray(data) ? data : Object.values(data);
      const p = arr.find(x => x && x.id === id);
      if (!p) { renderError('ההצעה לא נמצאה.'); return false; }
      render(p);
      return true;
    }
    try {
      const snap = await db.ref('studio_data/proposals').once('value');
      if (handle(snap.val())) return;
    } catch(e1) {
      try {
        await firebase.auth().signInAnonymously();
        const snap2 = await db.ref('studio_data/proposals').once('value');
        if (handle(snap2.val())) return;
      } catch(e2) {
        try {
          const res = await fetch('https://elior-studio-default-rtdb.firebaseio.com/studio_data/proposals.json?ts=' + Date.now(), {cache:'no-store'});
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (handle(data)) return;
        } catch(e3) {
          renderError('שגיאה בטעינה: ' + (e3 && (e3.code || e3.message) || e3) + '\nאם פתחת מתוך וואטסאפ — נסה לפתוח דרך Safari.');
        }
      }
    }
  })();
}
