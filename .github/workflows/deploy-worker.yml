# Deploys whatsapp-worker.js to Cloudflare on every push that touches
# it — replaces pasting code into the dashboard editor (impossible on
# a phone) and the manual Cron Triggers step (wrangler.jsonc carries
# the cron). Needs ONE repo secret, added once:
#   CLOUDFLARE_API_TOKEN — dash.cloudflare.com/profile/api-tokens →
#                          Create Token → "Edit Cloudflare Workers"
# (no account id needed — the token is scoped to a single account and
#  wrangler auto-detects it)
name: Deploy WhatsApp Worker

on:
  push:
    branches: [main]
    paths:
      - whatsapp-worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker (wrangler deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Re-install the worker's secrets from GitHub repo secrets on
      # every deploy — GitHub is the single place secrets are managed;
      # nobody ever touches the Cloudflare dashboard again. Missing
      # ones are skipped silently (e.g. APNS_* until Apple setup).
      - name: Sync worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          OWNER_PERSONAL: ${{ secrets.OWNER_PERSONAL }}
          ASSISTANT_PHONE_ID: ${{ secrets.ASSISTANT_PHONE_ID }}
          ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          for k in WHATSAPP_TOKEN SEND_SECRET GEMINI_KEY OWNER_PHONE OWNER_PERSONAL ASSISTANT_PHONE_ID ASSISTANT_TOKEN APNS_KEY APNS_KEY_ID APNS_TEAM_ID TELEGRAM_TOKEN META_APP_SECRET; do
            v="${!k}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | npx wrangler@3.90.0 secret put "$k" && echo "✓ $k installed"
            else
              echo "– $k not set in GitHub secrets, skipped"
            fi
          done
