# Firebase health + backup inventory. COUNTS ONLY in the log (public repo):
# no names, amounts, phones or keys are printed.
name: DB health
on:
  workflow_dispatch:
    inputs:
      restore_from:
        description: "Merge missing income/expenses/etc. back from this backup key (e.g. 2026-10-14). Empty = report only."
        required: false
        default: ""
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Morning check (booleans + Morning's own error text only)
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
          MORNING_API_ID: ${{ secrets.MORNING_API_ID }}
          MORNING_API_SECRET: ${{ secrets.MORNING_API_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          W='https://ravid-whatsapp.djeliorravid.workers.dev'
          def post(url, body, h=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=dict({'Content-Type':'application/json','User-Agent':'Mozilla/5.0'}, **(h or {})), method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=40) as r: return r.status, json.loads(r.read() or b'null')
              except urllib.error.HTTPError as e:
                  t = e.read().decode('utf8','replace')
                  try: return e.code, json.loads(t)
                  except Exception: return e.code, t[:200]
              except Exception as e: return -1, str(e)[:200]
          n = lambda m: print('::notice::' + m)
          sec = ''.join(os.environ.get('SEND_SECRET','').split())
          st, j = post(W + '/morning/token', {'secret': sec})
          tok = isinstance(j, dict) and j.get('token')
          n(f'worker /morning/token: status={st} ok={bool(tok)} err={(j.get("error"), j.get("detail")) if isinstance(j, dict) and not tok else ""}')
          st2, d = post('https://api.greeninvoice.co.il/api/v1/account/token', {'id': os.environ.get('MORNING_API_ID','').strip(), 'secret': os.environ.get('MORNING_API_SECRET','').strip()})
          n(f'GitHub-secret keys direct: status={st2} token={bool(isinstance(d, dict) and d.get("token"))} err={(d.get("errorMessage") or d.get("errorCode")) if isinstance(d, dict) else str(d)[:120]}')
          # what does Morning itself say (codes + Morning's own error text only)
          def raw(url, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=40) as r: return r.status, r.headers.get('content-type'), r.read()[:300].decode('utf8','replace')
              except urllib.error.HTTPError as e: return e.code, e.headers.get('content-type'), e.read()[:300].decode('utf8','replace')
              except Exception as e: return -1, '', str(e)[:200]
          for label, body in (('dummy-keys', {'id': 'x'*20, 'secret': 'y'*20}), ('real-keys', {'id': os.environ.get('MORNING_API_ID','').strip(), 'secret': os.environ.get('MORNING_API_SECRET','').strip()})):
              st, ct, txt = raw('https://api.greeninvoice.co.il/api/v1/account/token', body)
              try: jj = json.loads(txt); info = (jj.get('errorCode'), jj.get('errorMessage'), 'token' if jj.get('token') else '')
              except Exception: info = ('non-json', txt[:80].replace('\n', ' ') if label == 'dummy-keys' or st != 200 else '')
              n(f'MORNING {label}: status={st} type={ct} {info}')
          n(f'GitHub keys present: id={bool(os.environ.get("MORNING_API_ID","").strip())} secret={bool(os.environ.get("MORNING_API_SECRET","").strip())} idlen={len(os.environ.get("MORNING_API_ID","").strip())}')
          if tok:
              st3, r = post(W + '/morning/api', {'secret': sec, 'method': 'POST', 'path': '/documents/search', 'body': {'page': 1, 'pageSize': 1, 'type': [400]}, 'token': tok})
              jj = r.get('json') if isinstance(r, dict) else None
              n(f'read receipts with worker token: status={r.get("status") if isinstance(r, dict) else st3} ok={r.get("ok") if isinstance(r, dict) else ""} total={jj.get("total") if isinstance(jj, dict) else ""} err={(jj.get("errorMessage") or jj.get("errorCode")) if isinstance(jj, dict) else ""}')
          PY

      - name: Morning address probe (dummy keys, codes only)
        run: |
          B=https://api.greeninvoice.co.il/api
          for u in $B/v1/auth/token $B/v1/oauth/token $B/v1/token $B/v1/account/login $B/v1/auth/login $B/v2/auth/token $B/v1/account/api-token $B/v1/accounts/token; do
            out=$(curl -s -m 25 -o /tmp/b -w '%{http_code}' -X POST "$u" -H 'Content-Type: application/json' -d '{"id":"xxxxxxxxxxxxxxxxxxxx","secret":"yyyyyyyyyyyyyyyyyyyy"}')
            echo "::notice::PROBE ${u#$B} -> $out $(head -c 90 /tmp/b | tr '\n' ' ')"
          done
          curl -s -m 30 https://jsapi.apiary.io/apis/greeninvoice.apib -o /tmp/doc || true
          echo "::notice::DOC bytes=$(wc -c < /tmp/doc 2>/dev/null) $(grep -o -i -m3 '[^ ]*account/token[^ ]*\|[^ ]*/token[^ ]*' /tmp/doc 2>/dev/null | tr '\n' ' ' | head -c 300)"
          out=$(curl -s -m 25 -o /tmp/b -w '%{http_code}' -X POST https://api.greeninvoice.co.il/api/v1/account/token -H 'Content-Type: application/json' -H 'User-Agent: curl/8' -d '{"id":"x","secret":"y"}'); echo "::notice::PROBE curl-ua -> $out $(head -c 100 /tmp/b)"

      - name: How current Morning clients log in (public packages)
        run: |
          mkdir -p /tmp/pk && cd /tmp/pk
          for p in greeninvoice-mcp green-invoice-api morning-api greeninvoice; do
            v=$(npm view $p version time.modified 2>/dev/null | tr '\n' ' '); [ -n "$v" ] && echo "::notice::NPM $p $v"
          done
          npm pack greeninvoice-mcp >/dev/null 2>&1 && tar xzf greeninvoice-mcp-*.tgz && echo "::notice::MCP $(grep -rhoE "https://[a-z.]*greeninvoice[a-z./0-9]*|https://[a-z.]*morning[a-z./0-9]*|account/token|/token[\"']" package | sort | uniq -c | tr '\n' ' ' | head -c 400)"
          f=$(grep -rl "idp/v1/oauth/token" package | head -1); echo "::notice::FILE $f"
          grep -n -B3 -A25 "idp/v1/oauth/token" "$f" | head -80 > /tmp/snip; split -l 8 /tmp/snip /tmp/sn_; for x in /tmp/sn_*; do echo "::notice::SNIP $(tr '\n' '~' < $x | head -c 900)"; done
          pip download --no-deps -q green-invoice -d py >/dev/null 2>&1; ls py | head -2 | tr '\n' ' ' | sed 's/^/::notice::PY /'; echo
          cd py 2>/dev/null && for f in *; do (unzip -o -q "$f" 2>/dev/null || tar xzf "$f" 2>/dev/null); done; echo "::notice::PYURLS $(grep -rhoE "https://[a-z.]*greeninvoice[a-z./0-9]*|account/token" . 2>/dev/null | sort | uniq -c | tr '\n' ' ' | head -c 300)"
          B=https://api.greeninvoice.co.il/api/v1/account/token
          for m in GET PUT; do echo "::notice::METHOD $m $(curl -s -m 20 -o /tmp/b -w '%{http_code}' -X $m $B -H 'Content-Type: application/json' -d '{}') $(head -c 80 /tmp/b)"; done

      - name: Report
        env:
          RESTORE: ${{ github.event.inputs.restore_from }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time, datetime
          R='https://elior-studio-default-rtdb.firebaseio.com'
          def get(p):
              try:
                  with urllib.request.urlopen(R+p, timeout=60) as r: return r.status, json.loads(r.read() or b'null')
              except urllib.error.HTTPError as e: return e.code, (e.read()[:200].decode('utf8','replace'))
              except Exception as e: return -1, str(e)[:200]
          def note(m): print('::notice::'+m)
          st, meta = get('/studio_meta.json')
          note(f'studio_meta status={st}')
          st, inc = get('/studio_data/income.json')
          L = inc if isinstance(inc, list) else list(inc.values()) if isinstance(inc, dict) else []
          L = [x for x in L if isinstance(x, dict)]
          mon = datetime.date.today().strftime('%Y-%m')
          def cnt(L, m): return sum(1 for x in L if str(x.get('date','')).startswith(m))
          prev = (datetime.date.today().replace(day=1) - datetime.timedelta(days=1)).strftime('%Y-%m')
          note(f'LIVE income status={st} total={len(L)} {mon}={cnt(L,mon)} {prev}={cnt(L,prev)}')
          st, keys = get('/studio_backups.json?shallow=true')
          note(f'backups list status={st} n={len(keys) if isinstance(keys, dict) else keys}')
          ks = sorted(keys.keys()) if isinstance(keys, dict) else []
          rows = []
          for k in ks[-40:]:
              s2, b = get(f'/studio_backups/{k}/data/income.json')
              BL = b if isinstance(b, list) else list(b.values()) if isinstance(b, dict) else []
              BL = [x for x in BL if isinstance(x, dict)]
              s4, ts = get(f'/studio_backups/{k}/ts.json'); s5, at = get(f'/studio_backups/{k}/at.json')
              rows.append(f'{k}:{len(BL)}/{cnt(BL,mon)}/{cnt(BL,prev)}' + (' t' + datetime.datetime.utcfromtimestamp((ts or at or 0)/1000).strftime('%m%d-%H%M') if (ts or at) else ''))
          note('BACKUPS key:total/oct/sep  ' + '  '.join(rows))
          # what kind of incomes exist this month in live (status counts only)
          note('LIVE oct statuses: ' + json.dumps({s: sum(1 for x in L if str(x.get('date','')).startswith(mon) and (x.get('status') or 'pending') == s) for s in ['paid','pending','overdue']}))
          note('LIVE income newest dates: ' + ' '.join(sorted({str(x.get('date',''))[:10] for x in L})[-12:]))
          s6, sm = get('/studio_meta/income.json'); note(f'meta income ts={sm} ' + (datetime.datetime.utcfromtimestamp(int(sm)/1000).strftime('%Y-%m-%d %H:%M') if isinstance(sm,(int,str)) and str(sm).isdigit() else ''))
          s8, wr = get('/studio_diag/writer.json')
          if isinstance(wr, dict):
              for k, w in wr.items():
                  if isinstance(w, dict) and k in ('income','expenses','schedule','fixed_costs'): note(f'WRITER {k}: dev={w.get("d")} {w.get("p")} v{w.get("v")} n={w.get("n")} at=' + datetime.datetime.utcfromtimestamp((w.get('at') or 0)/1000).strftime('%m%d %H:%M'))
          s9, nd = get('/studio_diag/net.json')
          if isinstance(nd, dict):
              for k, w in nd.items():
                  if isinstance(w, dict): note(f'NET dev={k} {w.get("p")} v{w.get("v")} ' + datetime.datetime.utcfromtimestamp((w.get('at') or 0)/1000).strftime('%m%d %H:%M') + ' ' + ' | '.join(f'{a}={str(b)[:120]}' for a, b in w.items() if a not in ('p','v','at')))
          s7, tr = get('/studio_diag/receipt.json')
          if isinstance(tr, list):
              for e in tr[-12:]:
                  if isinstance(e, dict): note('RC ' + datetime.datetime.utcfromtimestamp((e.get('at') or 0)/1000).strftime('%m%d %H:%M:%S') + ' v' + str(e.get('v')) + ' ' + str(e.get('s')) + ' ' + str(e.get('x'))[:200])
          st, c = get('/studio_backups_fc.json?shallow=true'); note(f'fc backups status={st} n={len(c) if isinstance(c, dict) else c}')
          rk = os.environ.get('RESTORE','').strip()
          if rk:
              s2, bd = get(f'/studio_backups/{rk}/data.json')
              if not isinstance(bd, dict): note(f'RESTORE: cannot read backup {rk} (status {s2})'); raise SystemExit(1)
              now = int(time.time()*1000); changed = []
              for key, bv in bd.items():
                  if not isinstance(bv, list) or not bv or not all(isinstance(x, dict) and 'id' in x for x in bv if x is not None): continue
                  s3, cv = get(f'/studio_data/{key}.json')
                  if s3 != 200: continue
                  CL = cv if isinstance(cv, list) else list(cv.values()) if isinstance(cv, dict) else []
                  have = {str(x.get('id')) for x in CL if isinstance(x, dict)}
                  add = [dict(x, _u=now) for x in bv if isinstance(x, dict) and str(x.get('id')) not in have and not x.get('deleted')]
                  if not add: continue
                  # safety copy of the live list first
                  req = urllib.request.Request(R+f'/studio_backups/before-restore-{now}/data/{key}.json', data=json.dumps(CL).encode(), method='PUT'); urllib.request.urlopen(req, timeout=60)
                  out = [x for x in CL if isinstance(x, dict)] + add
                  req = urllib.request.Request(R+f'/studio_data/{key}.json', data=json.dumps(out).encode(), method='PUT'); urllib.request.urlopen(req, timeout=60)
                  req = urllib.request.Request(R+f'/studio_meta/{key}.json', data=json.dumps(now).encode(), method='PUT'); urllib.request.urlopen(req, timeout=60)
                  changed.append(f'{key}+{len(add)}')
              note('RESTORE from '+rk+': '+(', '.join(changed) or 'nothing missing'))
          PY
