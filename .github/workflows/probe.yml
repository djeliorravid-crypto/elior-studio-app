# Self-serve diagnostics: the dev sandbox can't reach Firebase, but a
# GitHub runner can. Triggered manually, prints the same open (no-auth)
# debug endpoints the user otherwise screenshots by hand:
#   /whatsapp/diag.json  — worker trace (shape / ai-ok / ai-fail / cmd-reply)
#   /studio_data/schedule.json — the cloud schedule the worker writes into
#   /whatsapp/push.json  — APNs device token (null = push never registered)
name: Probe cloud state

on:
  workflow_dispatch:
    inputs:
      testpush:
        description: "Send a test APNs push and print Apple's reply"
        required: false
        default: "no"
      tgsetup:
        description: "Register the Telegram bot webhook on the worker"
        required: false
        default: "no"
      testcmd:
        description: "Run one assistant command end-to-end and print the reply"
        required: false
        default: ""
      testsend:
        description: "Send a real WhatsApp text to the owner via /send (verifies signed Graph sends)"
        required: false
        default: "no"
      diagproof:
        description: "Diagnose which Meta app the stored secret + WhatsApp token belong to"
        required: false
        default: "no"
      whoami:
        description: "Ask each token which Meta app owns it (no secret needed)"
        required: false
        default: "no"
      whichsecret:
        description: "Test the WhatsApp token against both stored secrets, report which is valid"
        required: false
        default: "no"
      growtry:
        description: "Try Grow CreatePaymentLink with candidate ids: 'userId1,userId2|pageCode' — creates an INACTIVE 1₪ link at most; prints Grow's verdict per candidate"
        required: false
        default: ""
      growpage:
        description: "Public Grow payment-page URL — fetch it and print the ids embedded in it (userId / pageCode candidates), never the page body"
        required: false
        default: ""
      growdraw:
        description: "Page hash of a pay.grow.link page (the part after the domain) — call DrawPaymentLinkPageData like the browser does and print linkData/ids"
        required: false
        default: ""
      growproc:
        description: "Page hash — discover doPaymentLinkCreatePaymentProcess params by following Grow's 'required field' errors (creates a harmless checkout, no charge)"
        required: false
        default: ""
      morningauth:
        description: "yes = test MORNING_API_ID/SECRET from repo secrets against Morning: token + list clearing plugins (prints pluginId, never the secret)"
        required: false
        default: "no"
      morninginline:
        description: "id|secret to test directly (used when repo secrets are not set)"
        required: false
        default: ""
      readdocs:
        description: "Comma-separated public doc URLs to fetch and print as plain text (the sandbox can't reach them)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch debug endpoints
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          echo "===== META APP (id only, token never printed) ====="
          curl -sS "https://graph.facebook.com/v21.0/app?access_token=$WHATSAPP_TOKEN" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          err=(d.get("error") or {}).get("message","")
          print("app id:", d.get("id","-"), "| name:", d.get("name","-"), ("| ERROR: "+err[:140]) if err else "")
          '
          DB="https://elior-studio-default-rtdb.firebaseio.com"
          echo "===== DIAG (last 30) ====="
          # order by $key (push keys are chronological, needs no index —
          # orderBy "ts" returns an index-error object instead of data)
          curl -sS "$DB/whatsapp/diag.json?orderBy=%22%24key%22&limitToLast=40" | python3 -c '
          import json,sys,datetime
          d=json.load(sys.stdin) or {}
          if not isinstance(d, dict): print("UNEXPECTED:", d); sys.exit(0)
          for k in sorted(d):
              v = d[k]
              if not isinstance(v, dict): print(k, v); continue
              t=datetime.datetime.utcfromtimestamp(v.get("ts",0)/1000).strftime("%m-%d %H:%M:%S")
              print(t, v.get("tag"), v.get("data",""))
          '
          echo "===== SCHEDULE (last 15) ====="
          curl -sS "$DB/studio_data/schedule.json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin) or []
          arr=d if isinstance(d,list) else list(d.values())
          for e in arr[-15:]:
              if e: print(e.get("date"), e.get("time"), repr(e.get("title")), e.get("id"), e.get("createdAt",""))
          print("total:", len(arr))
          '
          echo "===== MY_PATH (process health) ====="
          curl -sS "$DB/studio_data/my_path.json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin) or {}
          if not isinstance(d, dict): print("UNEXPECTED:", type(d)); sys.exit(0)
          print("processStart:", d.get("processStart"), "| startWeight:", d.get("startWeight"))
          w = d.get("weights") or []
          print("weights:", [(x.get("d"), x.get("kg")) for x in w][-5:], "| total:", len(w))
          print("archive:", len(d.get("weightsArchive") or []))
          print("achievements:", sorted((d.get("achievements") or {}).keys()))
          print("goalWeight:", (d.get("body") or {}).get("goalWeight"))
          '
          echo "===== SYNC META (freshness) ====="
          curl -sS "$DB/studio_meta.json" | python3 -c '
          import json,sys,datetime
          d=json.load(sys.stdin) or {}
          now=datetime.datetime.utcnow()
          for k in sorted(d):
              try:
                  t=datetime.datetime.utcfromtimestamp(d[k]/1000)
                  print(k.ljust(16), t.strftime("%d.%m %H:%M"), "(", str(now-t).split(".")[0], "ago )")
              except Exception: print(k, d[k])
          '
          echo "===== PUSH TOKEN ====="
          curl -sS "$DB/whatsapp/push.json" | head -c 300; echo
          echo "===== CMDQUEUE ====="
          curl -sS "$DB/whatsapp/cmdqueue.json" | head -c 1500; echo
      - name: Test assistant command
        if: ${{ github.event.inputs.testcmd != '' }}
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
          CMD: ${{ github.event.inputs.testcmd }}
        run: |
          jq -n --arg s "$SEND_SECRET" --arg t "$CMD" '{secret: ($s | gsub("\\s";"")), text: $t}' \
          | curl -sS -X POST "https://ravid-whatsapp.djeliorravid.workers.dev/testcmd" \
              -H 'Content-Type: application/json' -d @- | python3 -m json.tool
      - name: Test real WhatsApp send (signed)
        if: ${{ github.event.inputs.testsend == 'yes' }}
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
        run: |
          jq -n --arg s "$SEND_SECRET" --arg to "$OWNER_PHONE" \
            '{secret: ($s | gsub("\\s";"")), to: $to, text: "בדיקת מערכת — אם ההודעה הזאת הגיעה, השליחה מהאפליקציה חזרה לעבוד ✅"}' \
          | curl -sS -X POST "https://ravid-whatsapp.djeliorravid.workers.dev/send" \
              -H 'Content-Type: application/json' -d @- | python3 -m json.tool
      - name: Diagnose app/secret/token ownership
        if: ${{ github.event.inputs.diagproof == 'yes' }}
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import hmac, hashlib, os, json, urllib.request, urllib.parse
          sec = (os.environ.get('META_APP_SECRET') or '').strip()
          tok = (os.environ.get('WHATSAPP_TOKEN') or '').strip()
          print('secret set:', bool(sec), '| len:', len(sec), '| token len:', len(tok))
          def call(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {'error': {'message': 'http ' + str(e.code)}}
              except Exception as e:
                  return {'error': {'message': type(e).__name__}}
          def proof(msg):
              return hmac.new(sec.encode(), msg.encode(), hashlib.sha256).hexdigest()
          for appid in ['1589380639568364', '1413358097281114']:
              apptok = appid + '|' + sec
              q = urllib.parse.urlencode({'access_token': apptok, 'appsecret_proof': proof(apptok)})
              d = call('https://graph.facebook.com/v21.0/' + appid + '?' + q)
              err = (d.get('error') or {}).get('message', '')
              print('app', appid, '→', d.get('name', '-'), ('| ERROR: ' + err[:100]) if err else '(secret MATCHES this app)')
              q2 = urllib.parse.urlencode({'input_token': tok, 'access_token': apptok, 'appsecret_proof': proof(apptok)})
              t = call('https://graph.facebook.com/v21.0/debug_token?' + q2)
              td = t.get('data') or {}
              terr = (t.get('error') or {}).get('message', '') or (td.get('error') or {}).get('message', '')
              print('   token check →', 'app_id:', td.get('app_id', '-'), '| valid:', td.get('is_valid', '-'), ('| ERR: ' + terr[:100]) if terr else '')
          PYEOF
      - name: Which app owns the WhatsApp token
        if: ${{ github.event.inputs.whoami == 'yes' }}
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          def call(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {'error':{'message':'http '+str(e.code)}}
              except Exception as e: return {'error':{'message':type(e).__name__}}
          for label,tok in [('WHATSAPP_TOKEN', os.environ.get('WHATSAPP_TOKEN','')),
                            ('ASSISTANT_TOKEN', os.environ.get('ASSISTANT_TOKEN',''))]:
              tok=(tok or '').strip()
              if not tok:
                  print(label, '-> not set'); continue
              # a token can debug ITSELF: input_token=access_token=tok reveals app_id
              q=urllib.parse.urlencode({'input_token':tok,'access_token':tok})
              d=call('https://graph.facebook.com/v21.0/debug_token?'+q)
              data=d.get('data') or {}
              err=(d.get('error') or {}).get('message','') or (data.get('error') or {}).get('message','')
              print(label, '-> app_id:', data.get('app_id','-'),
                    '| app:', data.get('application','-'),
                    '| type:', data.get('type','-'),
                    '| valid:', data.get('is_valid','-'),
                    ('| ERR: '+err[:120]) if err else '')
          PYEOF
      - name: Grow — doPaymentLinkCreatePaymentProcess param discovery
        if: ${{ github.event.inputs.growproc != '' }}
        env:
          GROWPROC: ${{ github.event.inputs.growproc }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, urllib.request, urllib.parse
          h = os.environ.get('GROWPROC','').strip()
          mid = h.split('~')[1].split('-')[0] if '~' in h else h
          guess = {'page_hash': h, 'pageHash': h, 'paymentLinkProcessToken': mid, 'sum': '250', 'amount': '250', 'paymentNum': '1', 'maxPaymentNum': '1',
                   'fullName': 'בדיקה בדיקה', 'payerName': 'בדיקה בדיקה', 'phone': '0500000000', 'payerPhone': '0500000000', 'email': 'test@test.com', 'payerEmail': 'test@test.com',
                   'description': 'בדיקת מערכת', 'vatType': '3', 'paymentLinkId': '4041951', 'transactionTypeId': '1', 'paymentType': '2', 'currency': '1', 'lang': 'he',
                   'successUrl': 'https://djeliorravid-crypto.github.io/elior-studio-app/pay.html', 'cancelUrl': 'https://djeliorravid-crypto.github.io/elior-studio-app/pay.html',
                   'notifyUrl': 'https://ravid-whatsapp.djeliorravid.workers.dev/grow/notify', 'cField1': 'probe', 'pageField[fullName]': 'בדיקה בדיקה', 'pageField[phone]': '0500000000', 'pageField[email]': 'test@test.com'}
          hdr = {'Origin': 'https://pay.grow.link', 'Referer': 'https://pay.grow.link/' + h, 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1', 'Accept': 'application/json'}
          hosts = ['https://meshulam.co.il/api/light/server/1.0/doPaymentLinkCreatePaymentProcess', 'https://secure.meshulam.co.il/api/light/server/1.0/doPaymentLinkCreatePaymentProcess']
          def post(url, fields, as_json):
              if as_json:
                  data = json.dumps(fields, ensure_ascii=False).encode('utf-8'); ct = 'application/json'
              else:
                  data = urllib.parse.urlencode(fields).encode('utf-8'); ct = 'application/x-www-form-urlencoded'
              req = urllib.request.Request(url, data=data, method='POST', headers=dict(hdr, **{'Content-Type': ct}))
              try:
                  r = urllib.request.urlopen(req, timeout=25); return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e: return e.code, e.read().decode('utf-8', 'replace')
              except Exception as e: return 0, str(e)
          for url in hosts:
            for as_json in (False, True):
              fields = {'page_hash': h}
              print('\n#### host', url, 'json' if as_json else 'form')
              for step in range(10):
                  code, txt = post(url, fields, as_json)
                  short = txt[:400]
                  try:
                      j = json.loads(txt)
                      if isinstance(j, dict) and isinstance(j.get('data'), dict):
                          d = j['data']
                          for k in ('url', 'processToken', 'authCode'):
                              if d.get(k): d[k] = str(d[k])[:36] + '…'
                      short = json.dumps(j, ensure_ascii=False)[:400]
                  except Exception: j = None
                  print('step', step, 'fields=', sorted(fields.keys()), '→', code, short)
                  if j and str(j.get('status')) == '1': print('SUCCESS with', sorted(fields.keys())); break
                  msg = str((j or {}).get('err', {}).get('message', '') if isinstance((j or {}).get('err'), dict) else (j or {}).get('err', ''))
                  m = re.search(r"'([A-Za-z_\[\]\.]+)'", msg) or re.search(r':\s*([A-Za-z_\[\]\.]+)\s*$', msg)
                  if not m: break
                  need = m.group(1)
                  if need in fields: break
                  fields[need] = guess.get(need, '1')
          PYEOF
      - name: Grow — DrawPaymentLinkPageData for a page hash
        if: ${{ github.event.inputs.growdraw != '' }}
        env:
          GROWDRAW: ${{ github.event.inputs.growdraw }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, urllib.request, urllib.parse
          h = os.environ.get('GROWDRAW','').strip()
          key = 'WqnMS3npu9IOxLc2lRfz8Ny9teEN87AACzSUma80'
          hdr = {'x-api-key': key, 'Origin': 'https://pay.grow.link', 'Referer': 'https://pay.grow.link/' + h, 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1', 'Accept': 'application/json'}
          def show(tag, code, txt):
              try:
                  j = json.loads(txt)
                  def walk(o, path, out):
                      if isinstance(o, dict):
                          for k, v in o.items(): walk(v, path + '.' + k, out)
                      elif isinstance(o, list):
                          for i, v in enumerate(o[:10]): walk(v, path + '[%d]' % i, out)
                      else:
                          if re.search(r'id|code|user|business|token|hash|key|page|vat|link', path.lower()) and not re.search(r'translation|text|label|title|desc|color|font|image|url', path.lower()):
                              out.append(path[-80:] + ' = ' + str(o)[:80])
                  out = []; walk(j, '', out)
                  print(tag, 'HTTP', code, 'status=', j.get('status'), 'err=', str(j.get('err'))[:200], 'top keys=', list(j.keys())[:10])
                  d = j.get('data') if isinstance(j, dict) else None
                  if isinstance(d, dict):
                      print('   data keys:', list(d.keys())[:30])
                      if 'linkData' in d: print('   linkData:', json.dumps(d['linkData'], ensure_ascii=False)[:1500])
                      if 'generalSettings' in d: print('   generalSettings:', json.dumps(d['generalSettings'], ensure_ascii=False)[:800])
                  for line in out[:80]: print('   ', line)
              except Exception:
                  print(tag, 'HTTP', code, txt[:400])
          for name in ['page_hash', 'h']:
              q = urllib.parse.urlencode({name: h})
              for base in ['https://api.grow.link/api/biz/web/1.1/DrawPaymentLinkPageData']:
                  try:
                      req = urllib.request.Request(base + '?' + q, headers=hdr)
                      r = urllib.request.urlopen(req, timeout=25); code = r.status; txt = r.read().decode('utf-8', 'replace')
                  except urllib.error.HTTPError as e: code = e.code; txt = e.read().decode('utf-8', 'replace')
                  except Exception as e: code = 0; txt = str(e)
                  show('GET ?' + name, code, txt)
                  if '"status":1' in txt.replace(' ', '') or '"status": 1' in txt: break
          # also try the path style /DrawPaymentLinkPageData/<hash> and POST
          for url in ['https://api.grow.link/api/biz/web/1.1/DrawPaymentLinkPageData/' + urllib.parse.quote(h)]:
              try:
                  req = urllib.request.Request(url, headers=hdr); r = urllib.request.urlopen(req, timeout=25); show('GET path', r.status, r.read().decode('utf-8','replace'))
              except urllib.error.HTTPError as e: show('GET path', e.code, e.read().decode('utf-8','replace'))
              except Exception as e: print('GET path fail', e)
          PYEOF
      - name: Morning — test keys + list plugins
        if: ${{ github.event.inputs.morningauth == 'yes' || github.event.inputs.morninginline != '' }}
        env:
          MORNING_API_ID: ${{ secrets.MORNING_API_ID }}
          MORNING_API_SECRET: ${{ secrets.MORNING_API_SECRET }}
          MORNING_INLINE: ${{ github.event.inputs.morninginline }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          inline = (os.environ.get('MORNING_INLINE') or '').strip()
          if inline and '|' in inline:
              cid, sec = inline.split('|', 1)
          else:
              cid = (os.environ.get('MORNING_API_ID') or '').strip()
              sec = (os.environ.get('MORNING_API_SECRET') or '').strip()
          cid = cid.strip(); sec = sec.strip()
          print('id present:', bool(cid), '| id len:', len(cid), '| id head:', cid[:8] + '…' if cid else '-')
          print('secret present:', bool(sec), '| secret len:', len(sec))
          if not cid or not sec:
              print('MISSING one of MORNING_API_ID / MORNING_API_SECRET in repo secrets'); raise SystemExit
          def call(method, path, body=None, token=None):
              url = 'https://api.greeninvoice.co.il/api/v1' + path
              data = json.dumps(body).encode() if body is not None else None
              hdr = {'Content-Type': 'application/json'}
              if token: hdr['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(url, data=data, method=method, headers=hdr)
              try:
                  r = urllib.request.urlopen(req, timeout=25); return r.status, r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code, e.read().decode('utf-8','replace')
              except Exception as e: return 0, str(e)
          code, txt = call('POST', '/account/token', {'id': cid, 'secret': sec})
          try: j = json.loads(txt)
          except Exception: j = {}
          tok = j.get('token') if isinstance(j, dict) else None
          print('TOKEN call: HTTP', code, '| got token:', bool(tok), '| body(no token):', json.dumps({k:v for k,v in (j or {}).items() if k!='token'}, ensure_ascii=False)[:300])
          if not tok:
              print('>>> VERDICT: the keys did NOT authenticate. Re-create the key in Morning and copy both parts.'); raise SystemExit
          print('>>> VERDICT: keys are VALID.')
          for path in ['/payments/plugins', '/plugins', '/account/plugins']:
              code, txt = call('GET', path, None, tok)
              try: pj = json.loads(txt)
              except Exception: pj = None
              arr = pj if isinstance(pj, list) else (pj.get('items') or pj.get('plugins') or pj.get('data') or []) if isinstance(pj, dict) else []
              print('GET', path, 'HTTP', code, '| items:', len(arr) if isinstance(arr, list) else 'n/a')
              if isinstance(arr, list):
                  for it in arr[:20]:
                      if isinstance(it, dict): print('   PLUGIN id=', it.get('id') or it.get('pluginId'), '| name=', it.get('name') or it.get('title') or it.get('type'), '| type=', it.get('type'))
          PYEOF
      - name: Read public docs
        if: ${{ github.event.inputs.readdocs != '' }}
        env:
          READDOCS: ${{ github.event.inputs.readdocs }}
        run: |
          python3 - <<'PYEOF'
          import os, re, html, urllib.request
          for u in [x.strip() for x in os.environ.get('READDOCS','').split(',') if x.strip()]:
              print('\n' + '=' * 30, u[:120])
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  body = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('fetch failed:', e); continue
              body = re.sub(r'(?is)<(script|style|noscript|svg|header|footer|nav)[^>]*>.*?</\1>', ' ', body)
              body = re.sub(r'(?i)<br\s*/?>|</p>|</div>|</li>|</h\d>|</tr>', '\n', body)
              text = html.unescape(re.sub(r'<[^>]+>', ' ', body))
              text = re.sub(r'[ \t ]+', ' ', text); text = re.sub(r'\n\s*\n+', '\n', text)
              # keep the part that talks about ids / api / settings
              keep = [ln.strip() for ln in text.split('\n') if ln.strip()]
              print('\n'.join(keep)[:9000])
          PYEOF
      - name: Grow page — extract embedded ids
        if: ${{ github.event.inputs.growpage != '' }}
        env:
          GROWPAGE: ${{ github.event.inputs.growpage }}
        run: |
          python3 - <<'PYEOF'
          import os, re, urllib.request, html
          url = os.environ.get('GROWPAGE','').strip()
          seen = set(); queue = [url]; out = {}
          def get(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1'})
              r = urllib.request.urlopen(req, timeout=25)
              return r.geturl(), r.read().decode('utf-8', 'replace')
          for depth in range(3):
              nxt = []
              for u in queue:
                  if u in seen or len(seen) > 8: continue
                  seen.add(u)
                  try: final, body = get(u)
                  except Exception as e: print('fetch fail', u[:80], e); continue
                  body = html.unescape(body)
                  print('=== fetched', u[:90], '→ final', final[:120], 'len', len(body))
                  for m in re.finditer(r'(userId|pageCode|page_code|user_id|businessId|business_id|processId|apiKey)["\']?\s*[:=]\s*["\']?([A-Za-z0-9_-]{4,64})', body, re.I):
                      out.setdefault(m.group(1), set()).add(m.group(2))
                  for m in re.finditer(r'\b[0-9a-f]{16}\b', body): out.setdefault('hex16', set()).add(m.group(0))
                  for m in re.finditer(r'\b[0-9a-f]{32}\b', body): out.setdefault('hex32', set()).add(m.group(0))
                  for m in re.finditer(r'(?:src|href|action)=["\']([^"\']*(?:meshulam|grow)[^"\']*)["\']', body, re.I):
                      link = m.group(1)
                      if link.startswith('//'): link = 'https:' + link
                      if link.startswith('http'): nxt.append(link)
                  for m in re.finditer(r'https?://[^\s"\'<>]*(?:meshulam|grow\.link|grow\.business)[^\s"\'<>]*', body): nxt.append(m.group(0))
              queue = nxt
          for k, v in out.items(): print(k, '→', sorted(v)[:12])
          print('urls seen:', [u[:110] for u in sorted(seen)])
          # __NEXT_DATA__ — the server-rendered props: walk it and print every id-ish leaf
          try:
              import json as _json
              final, body = get(url)
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', body, re.S)
              if m:
                  nd = _json.loads(m.group(1))
                  def walk(o, path):
                      if isinstance(o, dict):
                          for k, v in o.items(): walk(v, path + '.' + str(k))
                      elif isinstance(o, list):
                          for i, v in enumerate(o[:20]): walk(v, path + '[%d]' % i)
                      else:
                          key = path.lower()
                          if re.search(r'id|code|user|business|token|hash|key|merchant|customer|company', key) and not re.search(r'errors?\.|messages|translations|dictionary', key):
                              sv = str(o)
                              if 2 <= len(sv) <= 80 and not sv.startswith('http'): print('NEXT', path[-90:], '=', sv)
                  pp = nd.get('props', {}).get('pageProps', {})
                  print('pageProps keys:', list(pp.keys())[:40] if isinstance(pp, dict) else type(pp))
                  try:
                      eps = pp['initialState']['generalSettings']['apiEndpoints']
                      for name, ep in eps.items():
                          if re.search(r'PaymentLink|Purchase|Page|Link|Process|Business(?!Users)', name):
                              print('EP', name, ep.get('methodType'), (ep.get('apiHost') or '') + (ep.get('methodName') or ''), 'key=' + str(ep.get('x-api-key', ''))[:8])
                  except Exception as e: print('eps fail', e)
              else: print('no __NEXT_DATA__')
          except Exception as e: print('nextdata fail', e)
          # Deeper: the page's JS config + the API calls it makes
          try:
              final, body = get(url); body = html.unescape(body)
              for kw in ['userId', 'pageCode', 'businessId', 'apiUrl', 'api/biz', 'api/light', 'linkToken', 'processToken', 'paymentLinkProcess', 'window.__', 'NUXT', 'INITIAL']:
                  for m in list(re.finditer(re.escape(kw), body))[:4]:
                      a, b = max(0, m.start() - 160), min(len(body), m.end() + 240)
                      print('--- ctx[%s]: %s' % (kw, re.sub(r'\s+', ' ', body[a:b])))
              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', body)
              scripts = [x for x in scripts if 'Incapsula' not in x]
              scripts.sort(key=lambda x: 0 if 'h%5D' in x or '...h' in x else 1)   # the route chunk first
              for sc in scripts[:16]:
                  if sc.startswith('//'): sc = 'https:' + sc
                  if not sc.startswith('http'): sc = 'https://pay.grow.link' + (sc if sc.startswith('/') else '/' + sc)
                  try:
                      _, js = get(sc)
                  except Exception as e: print('js fail', sc[:80], e); continue
                  hits = [m.start() for m in re.finditer(r'userId|pageCode|user_id|page_code|api/light|GetPaymentLink|PaymentLinkData|paymentLinkProcessToken|getPaymentLink|linkData|apiHost', js)]
                  print('=== js', sc[:100], 'len', len(js), 'hits', len(hits))
                  last = -1000
                  for h in hits[:40]:
                      if h - last < 250: continue
                      last = h
                      print('   …', re.sub(r'\s+', ' ', js[max(0, h - 220):h + 320]))
          except Exception as e: print('deep fail', e)
          PYEOF
      - name: Grow API — which ids does Grow accept
        if: ${{ github.event.inputs.growtry != '' }}
        env:
          GROWTRY: ${{ github.event.inputs.growtry }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse, uuid
          spec = os.environ.get('GROWTRY','')
          users, page = spec.split('|',1)
          page = page.strip()
          hosts = ['https://secure.meshulam.co.il']
          # amount-field variants — Grow answered "הסכום אינו תקין" to price=1 (25.9)
          variants = [
            ('price=1',              {}),
            ('price=10',             {'products[data][0][price]': '10'}),
            ('sum=10',               {'sum': '10'}),
            ('sum+price=10',         {'sum': '10', 'products[data][0][price]': '10'}),
            ('amount=10',            {'amount': '10'}),
            ('price=10 vat=3',       {'products[data][0][price]': '10', 'products[data][0][vatType]': '3'}),
            ('maxPaymentNum=3',      {'products[data][0][price]': '10', 'paymentTypes[0][payments][paymentsMaxPaymentNum]': '3'}),
          ]
          def multipart(fields):
              b = uuid.uuid4().hex
              body = b''
              for k, v in fields:
                  body += ('--%s\r\nContent-Disposition: form-data; name="%s"\r\n\r\n%s\r\n' % (b, k, v)).encode('utf-8')
              body += ('--%s--\r\n' % b).encode()
              return body, 'multipart/form-data; boundary=' + b
          if len([u for u in users.split(',') if u.strip()]) > 3: variants = [v for v in variants if v[0] == 'sum=10']
          for host in hosts:
           for vname, extra in variants:
            for uid in [u.strip() for u in users.split(',') if u.strip()]:
              fields = [('userId', uid), ('pageCode', page), ('paymentLinkType', '1'), ('isActive', '0'), ('chargeType', '1'),
                        ('title', 'בדיקת מערכת'), ('paymentTypes[0][type]', 'payments'), ('paymentTypes[0][payments][paymentsPaymentNum]', '1'),
                        ('pageFieldSettings[fullName][value]', 'בדיקה בדיקה'), ('pageFieldSettings[phone][value]', '0500000000'),
                        ('products[data][0][name]', 'בדיקה'), ('products[data][0][price]', '1'), ('products[data][0][quantity]', '1'), ('products[data][0][vatType]', '1'),
                        ('successUrl', 'https://djeliorravid-crypto.github.io/elior-studio-app/pay.html'), ('notifyUrl', 'https://ravid-whatsapp.djeliorravid.workers.dev/grow/notify')]
              fields = [(k, v) for k, v in fields if k not in extra] + list(extra.items())
              if vname == 'maxPaymentNum=3': fields = [(k, v) for k, v in fields if k != 'paymentTypes[0][payments][paymentsPaymentNum]']
              body, ct = multipart(fields)
              req = urllib.request.Request(host + '/api/light/server/1.0/CreatePaymentLink', data=body, method='POST',
                                           headers={'Content-Type': ct, 'x-api-key': 'WqnMS3npu9IOxLc2lRfz8Ny9teEN87AACzSUma80'})
              try:
                  r = urllib.request.urlopen(req, timeout=25); txt = r.read().decode('utf-8', 'replace'); code = r.status
              except urllib.error.HTTPError as e:
                  code = e.code; txt = e.read().decode('utf-8', 'replace')
              except Exception as e:
                  code = 0; txt = str(e)
              # never print a live url in full — mask the token part
              try:
                  j = json.loads(txt)
                  if isinstance(j, dict) and isinstance(j.get('data'), dict) and j['data'].get('url'):
                      j['data']['url'] = j['data']['url'][:40] + '…'
                  txt = json.dumps(j, ensure_ascii=False)
              except Exception: pass
              print('[%s] userId=%s → HTTP %s  %s' % (vname, uid, code, txt[:260]))
          PYEOF
      - name: Which secret matches the token
        if: ${{ github.event.inputs.whichsecret == 'yes' }}
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_APP_SECRET_ASSISTANT: ${{ secrets.META_APP_SECRET_ASSISTANT }}
        run: |
          python3 - <<'PYEOF'
          import os, hmac, hashlib, json, urllib.request, urllib.parse
          tok=(os.environ.get('WHATSAPP_TOKEN') or '').strip()
          def call(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {'error':{'message':'http '+str(e.code)}}
              except Exception as e: return {'error':{'message':type(e).__name__}}
          for label in ['META_APP_SECRET','META_APP_SECRET_ASSISTANT']:
              sec=(os.environ.get(label) or '').strip()
              if not sec:
                  print(label,'-> not set'); continue
              proof=hmac.new(sec.encode(), tok.encode(), hashlib.sha256).hexdigest()
              q=urllib.parse.urlencode({'access_token':tok,'appsecret_proof':proof,'fields':'id,name'})
              d=call('https://graph.facebook.com/v21.0/me?'+q)
              err=(d.get('error') or {}).get('message','')
              if err: print(label,'-> ✗', err[:90])
              else:   print(label,'-> ✓ VALID (id:', d.get('id','-'), 'name:', d.get('name','-'), ')')
          PYEOF
