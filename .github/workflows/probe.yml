# Self-serve diagnostics: the dev sandbox can't reach Firebase, but a
# GitHub runner can. Triggered manually, prints the same open (no-auth)
# debug endpoints the user otherwise screenshots by hand:
#   /whatsapp/diag.json  — worker trace (shape / ai-ok / ai-fail / cmd-reply)
#   /studio_data/schedule.json — the cloud schedule the worker writes into
#   /whatsapp/push.json  — APNs device token (null = push never registered)
name: Probe cloud state

on:
  workflow_dispatch:
    inputs:
      testpush:
        description: "Send a test APNs push and print Apple's reply"
        required: false
        default: "no"
      tgsetup:
        description: "Register the Telegram bot webhook on the worker"
        required: false
        default: "no"
      testcmd:
        description: "Run one assistant command end-to-end and print the reply"
        required: false
        default: ""
      testsend:
        description: "Send a real WhatsApp text to the owner via /send (verifies signed Graph sends)"
        required: false
        default: "no"
      diagproof:
        description: "Diagnose which Meta app the stored secret + WhatsApp token belong to"
        required: false
        default: "no"
      whoami:
        description: "Ask each token which Meta app owns it (no secret needed)"
        required: false
        default: "no"
      whichsecret:
        description: "Test the WhatsApp token against both stored secrets, report which is valid"
        required: false
        default: "no"
      growtry:
        description: "Try Grow CreatePaymentLink with candidate ids: 'userId1,userId2|pageCode' — creates an INACTIVE 1₪ link at most; prints Grow's verdict per candidate"
        required: false
        default: ""
      growpage:
        description: "Public Grow payment-page URL — fetch it and print the ids embedded in it (userId / pageCode candidates), never the page body"
        required: false
        default: ""
      readdocs:
        description: "Comma-separated public doc URLs to fetch and print as plain text (the sandbox can't reach them)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch debug endpoints
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          echo "===== META APP (id only, token never printed) ====="
          curl -sS "https://graph.facebook.com/v21.0/app?access_token=$WHATSAPP_TOKEN" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          err=(d.get("error") or {}).get("message","")
          print("app id:", d.get("id","-"), "| name:", d.get("name","-"), ("| ERROR: "+err[:140]) if err else "")
          '
          DB="https://elior-studio-default-rtdb.firebaseio.com"
          echo "===== DIAG (last 30) ====="
          # order by $key (push keys are chronological, needs no index —
          # orderBy "ts" returns an index-error object instead of data)
          curl -sS "$DB/whatsapp/diag.json?orderBy=%22%24key%22&limitToLast=40" | python3 -c '
          import json,sys,datetime
          d=json.load(sys.stdin) or {}
          if not isinstance(d, dict): print("UNEXPECTED:", d); sys.exit(0)
          for k in sorted(d):
              v = d[k]
              if not isinstance(v, dict): print(k, v); continue
              t=datetime.datetime.utcfromtimestamp(v.get("ts",0)/1000).strftime("%m-%d %H:%M:%S")
              print(t, v.get("tag"), v.get("data",""))
          '
          echo "===== SCHEDULE (last 15) ====="
          curl -sS "$DB/studio_data/schedule.json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin) or []
          arr=d if isinstance(d,list) else list(d.values())
          for e in arr[-15:]:
              if e: print(e.get("date"), e.get("time"), repr(e.get("title")), e.get("id"), e.get("createdAt",""))
          print("total:", len(arr))
          '
          echo "===== MY_PATH (process health) ====="
          curl -sS "$DB/studio_data/my_path.json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin) or {}
          if not isinstance(d, dict): print("UNEXPECTED:", type(d)); sys.exit(0)
          print("processStart:", d.get("processStart"), "| startWeight:", d.get("startWeight"))
          w = d.get("weights") or []
          print("weights:", [(x.get("d"), x.get("kg")) for x in w][-5:], "| total:", len(w))
          print("archive:", len(d.get("weightsArchive") or []))
          print("achievements:", sorted((d.get("achievements") or {}).keys()))
          print("goalWeight:", (d.get("body") or {}).get("goalWeight"))
          '
          echo "===== SYNC META (freshness) ====="
          curl -sS "$DB/studio_meta.json" | python3 -c '
          import json,sys,datetime
          d=json.load(sys.stdin) or {}
          now=datetime.datetime.utcnow()
          for k in sorted(d):
              try:
                  t=datetime.datetime.utcfromtimestamp(d[k]/1000)
                  print(k.ljust(16), t.strftime("%d.%m %H:%M"), "(", str(now-t).split(".")[0], "ago )")
              except Exception: print(k, d[k])
          '
          echo "===== PUSH TOKEN ====="
          curl -sS "$DB/whatsapp/push.json" | head -c 300; echo
          echo "===== CMDQUEUE ====="
          curl -sS "$DB/whatsapp/cmdqueue.json" | head -c 1500; echo
      - name: Test assistant command
        if: ${{ github.event.inputs.testcmd != '' }}
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
          CMD: ${{ github.event.inputs.testcmd }}
        run: |
          jq -n --arg s "$SEND_SECRET" --arg t "$CMD" '{secret: ($s | gsub("\\s";"")), text: $t}' \
          | curl -sS -X POST "https://ravid-whatsapp.djeliorravid.workers.dev/testcmd" \
              -H 'Content-Type: application/json' -d @- | python3 -m json.tool
      - name: Test real WhatsApp send (signed)
        if: ${{ github.event.inputs.testsend == 'yes' }}
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
        run: |
          jq -n --arg s "$SEND_SECRET" --arg to "$OWNER_PHONE" \
            '{secret: ($s | gsub("\\s";"")), to: $to, text: "בדיקת מערכת — אם ההודעה הזאת הגיעה, השליחה מהאפליקציה חזרה לעבוד ✅"}' \
          | curl -sS -X POST "https://ravid-whatsapp.djeliorravid.workers.dev/send" \
              -H 'Content-Type: application/json' -d @- | python3 -m json.tool
      - name: Diagnose app/secret/token ownership
        if: ${{ github.event.inputs.diagproof == 'yes' }}
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import hmac, hashlib, os, json, urllib.request, urllib.parse
          sec = (os.environ.get('META_APP_SECRET') or '').strip()
          tok = (os.environ.get('WHATSAPP_TOKEN') or '').strip()
          print('secret set:', bool(sec), '| len:', len(sec), '| token len:', len(tok))
          def call(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {'error': {'message': 'http ' + str(e.code)}}
              except Exception as e:
                  return {'error': {'message': type(e).__name__}}
          def proof(msg):
              return hmac.new(sec.encode(), msg.encode(), hashlib.sha256).hexdigest()
          for appid in ['1589380639568364', '1413358097281114']:
              apptok = appid + '|' + sec
              q = urllib.parse.urlencode({'access_token': apptok, 'appsecret_proof': proof(apptok)})
              d = call('https://graph.facebook.com/v21.0/' + appid + '?' + q)
              err = (d.get('error') or {}).get('message', '')
              print('app', appid, '→', d.get('name', '-'), ('| ERROR: ' + err[:100]) if err else '(secret MATCHES this app)')
              q2 = urllib.parse.urlencode({'input_token': tok, 'access_token': apptok, 'appsecret_proof': proof(apptok)})
              t = call('https://graph.facebook.com/v21.0/debug_token?' + q2)
              td = t.get('data') or {}
              terr = (t.get('error') or {}).get('message', '') or (td.get('error') or {}).get('message', '')
              print('   token check →', 'app_id:', td.get('app_id', '-'), '| valid:', td.get('is_valid', '-'), ('| ERR: ' + terr[:100]) if terr else '')
          PYEOF
      - name: Which app owns the WhatsApp token
        if: ${{ github.event.inputs.whoami == 'yes' }}
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          def call(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {'error':{'message':'http '+str(e.code)}}
              except Exception as e: return {'error':{'message':type(e).__name__}}
          for label,tok in [('WHATSAPP_TOKEN', os.environ.get('WHATSAPP_TOKEN','')),
                            ('ASSISTANT_TOKEN', os.environ.get('ASSISTANT_TOKEN',''))]:
              tok=(tok or '').strip()
              if not tok:
                  print(label, '-> not set'); continue
              # a token can debug ITSELF: input_token=access_token=tok reveals app_id
              q=urllib.parse.urlencode({'input_token':tok,'access_token':tok})
              d=call('https://graph.facebook.com/v21.0/debug_token?'+q)
              data=d.get('data') or {}
              err=(d.get('error') or {}).get('message','') or (data.get('error') or {}).get('message','')
              print(label, '-> app_id:', data.get('app_id','-'),
                    '| app:', data.get('application','-'),
                    '| type:', data.get('type','-'),
                    '| valid:', data.get('is_valid','-'),
                    ('| ERR: '+err[:120]) if err else '')
          PYEOF
      - name: Read public docs
        if: ${{ github.event.inputs.readdocs != '' }}
        env:
          READDOCS: ${{ github.event.inputs.readdocs }}
        run: |
          python3 - <<'PYEOF'
          import os, re, html, urllib.request
          for u in [x.strip() for x in os.environ.get('READDOCS','').split(',') if x.strip()]:
              print('\n' + '=' * 30, u[:120])
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  body = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('fetch failed:', e); continue
              body = re.sub(r'(?is)<(script|style|noscript|svg|header|footer|nav)[^>]*>.*?</\1>', ' ', body)
              body = re.sub(r'(?i)<br\s*/?>|</p>|</div>|</li>|</h\d>|</tr>', '\n', body)
              text = html.unescape(re.sub(r'<[^>]+>', ' ', body))
              text = re.sub(r'[ \t ]+', ' ', text); text = re.sub(r'\n\s*\n+', '\n', text)
              # keep the part that talks about ids / api / settings
              keep = [ln.strip() for ln in text.split('\n') if ln.strip()]
              print('\n'.join(keep)[:9000])
          PYEOF
      - name: Grow page — extract embedded ids
        if: ${{ github.event.inputs.growpage != '' }}
        env:
          GROWPAGE: ${{ github.event.inputs.growpage }}
        run: |
          python3 - <<'PYEOF'
          import os, re, urllib.request, html
          url = os.environ.get('GROWPAGE','').strip()
          seen = set(); queue = [url]; out = {}
          def get(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1'})
              r = urllib.request.urlopen(req, timeout=25)
              return r.geturl(), r.read().decode('utf-8', 'replace')
          for depth in range(3):
              nxt = []
              for u in queue:
                  if u in seen or len(seen) > 8: continue
                  seen.add(u)
                  try: final, body = get(u)
                  except Exception as e: print('fetch fail', u[:80], e); continue
                  body = html.unescape(body)
                  print('=== fetched', u[:90], '→ final', final[:120], 'len', len(body))
                  for m in re.finditer(r'(userId|pageCode|page_code|user_id|businessId|business_id|processId|apiKey)["\']?\s*[:=]\s*["\']?([A-Za-z0-9_-]{4,64})', body, re.I):
                      out.setdefault(m.group(1), set()).add(m.group(2))
                  for m in re.finditer(r'\b[0-9a-f]{16}\b', body): out.setdefault('hex16', set()).add(m.group(0))
                  for m in re.finditer(r'\b[0-9a-f]{32}\b', body): out.setdefault('hex32', set()).add(m.group(0))
                  for m in re.finditer(r'(?:src|href|action)=["\']([^"\']*(?:meshulam|grow)[^"\']*)["\']', body, re.I):
                      link = m.group(1)
                      if link.startswith('//'): link = 'https:' + link
                      if link.startswith('http'): nxt.append(link)
                  for m in re.finditer(r'https?://[^\s"\'<>]*(?:meshulam|grow\.link|grow\.business)[^\s"\'<>]*', body): nxt.append(m.group(0))
              queue = nxt
          for k, v in out.items(): print(k, '→', sorted(v)[:12])
          print('urls seen:', [u[:110] for u in sorted(seen)])
          PYEOF
      - name: Grow API — which ids does Grow accept
        if: ${{ github.event.inputs.growtry != '' }}
        env:
          GROWTRY: ${{ github.event.inputs.growtry }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse, uuid
          spec = os.environ.get('GROWTRY','')
          users, page = spec.split('|',1)
          page = page.strip()
          hosts = ['https://secure.meshulam.co.il']
          # amount-field variants — Grow answered "הסכום אינו תקין" to price=1 (25.9)
          variants = [
            ('price=1',              {}),
            ('price=10',             {'products[data][0][price]': '10'}),
            ('sum=10',               {'sum': '10'}),
            ('sum+price=10',         {'sum': '10', 'products[data][0][price]': '10'}),
            ('amount=10',            {'amount': '10'}),
            ('price=10 vat=3',       {'products[data][0][price]': '10', 'products[data][0][vatType]': '3'}),
            ('maxPaymentNum=3',      {'products[data][0][price]': '10', 'paymentTypes[0][payments][paymentsMaxPaymentNum]': '3'}),
          ]
          def multipart(fields):
              b = uuid.uuid4().hex
              body = b''
              for k, v in fields:
                  body += ('--%s\r\nContent-Disposition: form-data; name="%s"\r\n\r\n%s\r\n' % (b, k, v)).encode('utf-8')
              body += ('--%s--\r\n' % b).encode()
              return body, 'multipart/form-data; boundary=' + b
          for host in hosts:
           for vname, extra in variants:
            for uid in [u.strip() for u in users.split(',') if u.strip()]:
              fields = [('userId', uid), ('pageCode', page), ('paymentLinkType', '1'), ('isActive', '0'), ('chargeType', '1'),
                        ('title', 'בדיקת מערכת'), ('paymentTypes[0][type]', 'payments'), ('paymentTypes[0][payments][paymentsPaymentNum]', '1'),
                        ('pageFieldSettings[fullName][value]', 'בדיקה בדיקה'), ('pageFieldSettings[phone][value]', '0500000000'),
                        ('products[data][0][name]', 'בדיקה'), ('products[data][0][price]', '1'), ('products[data][0][quantity]', '1'), ('products[data][0][vatType]', '1'),
                        ('successUrl', 'https://djeliorravid-crypto.github.io/elior-studio-app/pay.html'), ('notifyUrl', 'https://ravid-whatsapp.djeliorravid.workers.dev/grow/notify')]
              fields = [(k, v) for k, v in fields if k not in extra] + list(extra.items())
              if vname == 'maxPaymentNum=3': fields = [(k, v) for k, v in fields if k != 'paymentTypes[0][payments][paymentsPaymentNum]']
              body, ct = multipart(fields)
              req = urllib.request.Request(host + '/api/light/server/1.0/CreatePaymentLink', data=body, method='POST',
                                           headers={'Content-Type': ct, 'x-api-key': 'WqnMS3npu9IOxLc2lRfz8Ny9teEN87AACzSUma80'})
              try:
                  r = urllib.request.urlopen(req, timeout=25); txt = r.read().decode('utf-8', 'replace'); code = r.status
              except urllib.error.HTTPError as e:
                  code = e.code; txt = e.read().decode('utf-8', 'replace')
              except Exception as e:
                  code = 0; txt = str(e)
              # never print a live url in full — mask the token part
              try:
                  j = json.loads(txt)
                  if isinstance(j, dict) and isinstance(j.get('data'), dict) and j['data'].get('url'):
                      j['data']['url'] = j['data']['url'][:40] + '…'
                  txt = json.dumps(j, ensure_ascii=False)
              except Exception: pass
              print('[%s] userId=%s → HTTP %s  %s' % (vname, uid, code, txt[:260]))
          PYEOF
      - name: Which secret matches the token
        if: ${{ github.event.inputs.whichsecret == 'yes' }}
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_APP_SECRET_ASSISTANT: ${{ secrets.META_APP_SECRET_ASSISTANT }}
        run: |
          python3 - <<'PYEOF'
          import os, hmac, hashlib, json, urllib.request, urllib.parse
          tok=(os.environ.get('WHATSAPP_TOKEN') or '').strip()
          def call(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {'error':{'message':'http '+str(e.code)}}
              except Exception as e: return {'error':{'message':type(e).__name__}}
          for label in ['META_APP_SECRET','META_APP_SECRET_ASSISTANT']:
              sec=(os.environ.get(label) or '').strip()
              if not sec:
                  print(label,'-> not set'); continue
              proof=hmac.new(sec.encode(), tok.encode(), hashlib.sha256).hexdigest()
              q=urllib.parse.urlencode({'access_token':tok,'appsecret_proof':proof,'fields':'id,name'})
              d=call('https://graph.facebook.com/v21.0/me?'+q)
              err=(d.get('error') or {}).get('message','')
              if err: print(label,'-> ✗', err[:90])
              else:   print(label,'-> ✓ VALID (id:', d.get('id','-'), 'name:', d.get('name','-'), ')')
          PYEOF
      - name: Register Telegram webhook
        if: ${{ github.event.inputs.tgsetup == 'yes' }}
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
        run: |
          jq -n --arg s "$SEND_SECRET" '{secret: ($s | gsub("\\s";""))}' \
          | curl -sS -X POST "https://ravid-whatsapp.djeliorravid.workers.dev/tg-setup" \
              -H 'Content-Type: application/json' -d @-
          echo
      - name: Test APNs push
        if: ${{ github.event.inputs.testpush == 'yes' }}
        env:
          SEND_SECRET: ${{ secrets.SEND_SECRET }}
        run: |
          jq -n --arg s "$SEND_SECRET" \
            '{secret: ($s | gsub("\\s";"")), text: "בדיקה אוטומטית — אם קיבלת את זה בפלאפון, ההתראות עובדות ✅"}' \
          | curl -sS -X POST "https://ravid-whatsapp.djeliorravid.workers.dev/testpush" \
              -H 'Content-Type: application/json' -d @-
          echo
          # apns diag rows show BOTH hosts' verdicts
          sleep 2
          curl -sS "https://elior-studio-default-rtdb.firebaseio.com/whatsapp/diag.json?orderBy=%22%24key%22&limitToLast=4" | python3 -m json.tool
