name: Build iOS + Upload to TestFlight

# Triggered on every push to `mobile` (and later `main`). End-to-end
# from commit to "ready to install" notification on Elior's phone is
# typically 20-30 minutes.
on:
  push:
    branches: [mobile, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pick the latest Xcode the runner has installed
        # Capacitor 8 needs Xcode 16+ (older toolchains throw SwiftPM
        # into a pathological retry loop that looks like a hang). Use
        # the newest Xcode on the image — don't pin an old version.
        run: |
          LATEST=$(ls /Applications/ | grep -E '^Xcode_?[0-9]+(_[0-9]+)*\.app$' | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          for f in index.html contract.html proposal.html workshop.html sw.js _headers manifest.json version.txt icon-source.svg icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" "www/$f"
          done
          [ -d ios-icons ] && cp -R ios-icons www/ios-icons || true

      - name: Add Capacitor iOS platform (first run only)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Patch AppDelegate.swift for Capacitor 8 API
        run: |
          /usr/bin/sed -i '' \
            's|return ApplicationDelegateProxy\.shared\.application(application, continue: userActivity, restorationHandler: restorationHandler)|return false|' \
            ios/App/App/AppDelegate.swift

      - name: Sync web assets into iOS
        run: npx cap sync ios

      - name: Save App Store Connect API key
        env:
          API_KEY_ID:        ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY:   ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_PRIVATE_KEY" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: bundle install

      - name: Prepare signing (fastlane — cert, profile, update pbxproj)
        env:
          APP_STORE_CONNECT_API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID:                   ${{ secrets.APPLE_TEAM_ID }}
          MATCH_KEYCHAIN_NAME:             fastlane_tmp_keychain
          MATCH_KEYCHAIN_PASSWORD:         ''
          FASTLANE_SKIP_UPDATE_CHECK:      '1'
          FASTLANE_HIDE_CHANGELOG:         '1'
          FASTLANE_DISABLE_COLORS:         '1'
        run: bundle exec fastlane ios beta

      - name: Unlock keychain for codesigning
        # codesign can prompt for the keychain password silently mid-build,
        # which manifests as a 40+ min hang. set-key-partition-list grants
        # codesign access without prompting, and set-keychain-settings -lut
        # prevents the keychain auto-locking mid-build.
        run: |
          KEYCHAIN="$HOME/Library/Keychains/fastlane_tmp_keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security unlock-keychain -p "" "$KEYCHAIN" || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" || true
            security set-keychain-settings -lut 21600 "$KEYCHAIN" || true
          fi
          echo "---- Codesigning identities ----"
          security find-identity -v -p codesigning
          echo "---- Profile name ----"
          cat .sigh_name

      - name: Archive (raw xcodebuild with watchdog)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat .sigh_name)
          echo "Using provisioning profile: $PROFILE_NAME"
          cd ios/App

          # Run xcodebuild in the background, then print a heartbeat
          # every 60s with `ps` of build-related processes so we can
          # see exactly what's hot vs. hung.
          (
            NSUnbufferedIO=YES xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/App.xcarchive" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -IDEPackageSupportUseBuiltinSCM=YES \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              archive 2>&1
            echo $? > /tmp/xcb_exit
          ) &
          BUILD_PID=$!
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            echo "===== heartbeat at $(date +%H:%M:%S) ====="
            ps -axo pid,pcpu,etime,comm | grep -E 'swift|xcodebuild|codesign|ibtool|actool|clang|ld' | head -10 || true
          done
          wait $BUILD_PID
          EXIT=$(cat /tmp/xcb_exit 2>/dev/null || echo 1)
          exit $EXIT

      - name: Export IPA (raw xcodebuild)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat .sigh_name)
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ravidstudio.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          mkdir -p build
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build"
          ls -la build/

      - name: Upload IPA to TestFlight (xcrun altool — verbose)
        env:
          API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls ios/App/build/*.ipa | head -n 1)
          echo "Uploading: $IPA_PATH"
          xcrun altool \
            --upload-app \
            --verbose \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Save IPA as artifact (fallback so you can side-load if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: ios/App/build/*.ipa
          if-no-files-found: warn
