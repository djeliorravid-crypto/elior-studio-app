name: Build iOS + Upload to TestFlight

# Triggered on every push to `mobile` (and later `main`). End-to-end
# from commit to "ready to install" notification on Elior's phone is
# typically 20-30 minutes.
on:
  push:
    branches: [mobile, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 (macos-14 has iOS 17.5 SDK installed)
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          echo "---- available iOS SDKs ----"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          for f in index.html contract.html proposal.html workshop.html sw.js _headers manifest.json version.txt icon-source.svg icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" "www/$f"
          done
          [ -d ios-icons ] && cp -R ios-icons www/ios-icons || true

      - name: Add Capacitor iOS platform (first run only)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Patch AppDelegate.swift for Capacitor 8 API
        run: |
          /usr/bin/sed -i '' \
            's|return ApplicationDelegateProxy\.shared\.application(application, continue: userActivity, restorationHandler: restorationHandler)|return false|' \
            ios/App/App/AppDelegate.swift

      - name: Patch Info.plist — URL scheme for Shortcuts integration
        # Registers the custom URL scheme `ravidstudio://` so iOS
        # Shortcuts (and any other app) can deep-link into the app
        # with structured payloads, e.g.:
        #   ravidstudio://wallet?text=<encoded notification body>
        # The JS side listens via Capacitor's App plugin appUrlOpen
        # event and parses the payload into a pending expense.
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string 'com.ravidstudio.app'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string 'ravidstudio'" "$PLIST"

      - name: Sync web assets into iOS
        run: npx cap sync ios

      - name: Save App Store Connect API key
        env:
          API_KEY_ID:        ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY:   ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_PRIVATE_KEY" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: bundle install

      - name: Prepare signing (fastlane — cert, profile, update pbxproj)
        env:
          APP_STORE_CONNECT_API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID:                   ${{ secrets.APPLE_TEAM_ID }}
          MATCH_KEYCHAIN_NAME:             fastlane_tmp_keychain
          MATCH_KEYCHAIN_PASSWORD:         ''
          FASTLANE_SKIP_UPDATE_CHECK:      '1'
          FASTLANE_HIDE_CHANGELOG:         '1'
          FASTLANE_DISABLE_COLORS:         '1'
        run: bundle exec fastlane ios beta

      - name: Unlock keychain for codesigning (codesign was the hang!)
        # The previous run conclusively showed codesign hanging at 0% CPU
        # for tens of minutes waiting on a keychain prompt that never
        # comes. Make fastlane's keychain the ONLY keychain in the
        # search list (so codesign can't fall back to the locked login
        # keychain) and grant codesign full access without prompts.
        # Export KEYCHAIN_PATH so the archive step can pin codesign to
        # this keychain via OTHER_CODE_SIGN_FLAGS=--keychain=...
        run: |
          for KC in $HOME/Library/Keychains/fastlane_tmp_keychain*; do
            [ -f "$KC" ] || continue
            echo "Found fastlane keychain: $KC"
            security unlock-keychain -p "" "$KC" || true
            security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KC" || true
            security set-keychain-settings -lut 21600 "$KC" || true
            # Only our keychain in the search list — no login.keychain
            # fallback. And mark it the default.
            security list-keychains -s "$KC"
            security default-keychain -s "$KC"
            echo "KEYCHAIN_PATH=$KC" >> $GITHUB_ENV
          done
          echo "---- Active keychain search list ----"
          security list-keychains
          echo "---- Codesigning identities ----"
          security find-identity -v -p codesigning
          echo "---- Profile name ----"
          cat .sigh_name

      - name: Archive (raw xcodebuild with watchdog)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat .sigh_name)
          echo "Using provisioning profile: $PROFILE_NAME"
          cd ios/App

          # Run xcodebuild in the background, then print a heartbeat
          # every 60s with `ps` of build-related processes so we can
          # see exactly what's hot vs. hung.
          (
            # OTHER_CODE_SIGN_FLAGS pins codesign to our unlocked
            # keychain. Without this, codesign also probes login.keychain
            # which is locked → hangs forever on a prompt.
            NSUnbufferedIO=YES xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/App.xcarchive" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -IDEPackageSupportUseBuiltinSCM=YES \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              archive 2>&1
            echo $? > /tmp/xcb_exit
          ) &
          BUILD_PID=$!
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            echo "===== heartbeat at $(date +%H:%M:%S) ====="
            # Show actual BUILD processes (not system daemons that
            # happen to contain "ld"). Exact name match for codesign,
            # xcodebuild, swiftc, etc.
            ps -axo pid,pcpu,etime,comm | awk '$NF ~ /(^|\/)(xcodebuild|swiftc|swift-frontend|clang|ld|codesign|ibtool|actool|XCBBuildService|SourceKitService)$/' || true
          done
          wait $BUILD_PID
          EXIT=$(cat /tmp/xcb_exit 2>/dev/null || echo 1)
          exit $EXIT

      - name: Export IPA (raw xcodebuild)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat .sigh_name)
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ravidstudio.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          mkdir -p build
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build"
          ls -la build/

      - name: Upload IPA to TestFlight (xcrun altool — verbose)
        env:
          API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls ios/App/build/*.ipa | head -n 1)
          echo "Uploading: $IPA_PATH"
          xcrun altool \
            --upload-app \
            --verbose \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Save IPA as artifact (fallback so you can side-load if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: ios/App/build/*.ipa
          if-no-files-found: warn
