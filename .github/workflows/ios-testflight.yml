name: Build iOS + Upload to TestFlight

# Triggered on every push to `mobile` (and later `main`). End-to-end
# from commit to "ready to install" notification on Elior's phone is
# typically 20-30 minutes.
#
# Uses fastlane to handle the full signing dance via the App Store
# Connect API key (Admin role): creates/uses the distribution
# certificate, creates/uses the App Store provisioning profile,
# archives, exports a signed IPA, and uploads to TestFlight.
on:
  push:
    branches: [mobile, main]
  workflow_dispatch:

env:
  XCODE_VERSION: '15.4'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-capacitor-8.4.0
          restore-keys: |
            ${{ runner.os }}-spm-capacitor-

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          for f in index.html contract.html proposal.html workshop.html sw.js _headers manifest.json version.txt icon-source.svg icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" "www/$f"
          done
          [ -d ios-icons ] && cp -R ios-icons www/ios-icons || true

      - name: Add Capacitor iOS platform (first run only)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Patch AppDelegate.swift for Capacitor 8 API
        # Capacitor 8 dropped the `continue userActivity:restorationHandler:`
        # overload of `ApplicationDelegateProxy.shared.application`, but the
        # `cap add ios` template still emits a call to it. We don't use
        # Universal Links, so just stub the method to `return false`.
        run: |
          /usr/bin/sed -i '' \
            's|return ApplicationDelegateProxy\.shared\.application(application, continue: userActivity, restorationHandler: restorationHandler)|return false|' \
            ios/App/App/AppDelegate.swift

      - name: Sync web assets into iOS
        run: npx cap sync ios

      - name: Save App Store Connect API key
        env:
          API_KEY_ID:        ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY:   ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_PRIVATE_KEY" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: bundle install

      - name: Prepare signing (fastlane — cert, profile, update pbxproj)
        env:
          APP_STORE_CONNECT_API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID:                   ${{ secrets.APPLE_TEAM_ID }}
          MATCH_KEYCHAIN_NAME:             fastlane_tmp_keychain
          MATCH_KEYCHAIN_PASSWORD:         ''
          FASTLANE_SKIP_UPDATE_CHECK:      '1'
          FASTLANE_HIDE_CHANGELOG:         '1'
          FASTLANE_DISABLE_COLORS:         '1'
        run: bundle exec fastlane ios beta

      - name: Verify signing assets are in place
        run: |
          echo "---- Keychain (codesigning identities) ----"
          security find-identity -v -p codesigning | head -20
          echo "---- Provisioning profiles ----"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "no profiles directory"
          echo "---- Profile name in .sigh_name ----"
          cat .sigh_name

      - name: Archive (raw xcodebuild)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat .sigh_name)
          echo "Using provisioning profile: $PROFILE_NAME"
          cd ios/App
          set -o pipefail
          # No -allowProvisioningUpdates: fastlane already installed
          # the cert + profile, and that flag was making xcodebuild
          # hang on an Apple API round-trip.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Export IPA (raw xcodebuild)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat .sigh_name)
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ravidstudio.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          mkdir -p build
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build"
          ls -la build/

      - name: Upload IPA to TestFlight (xcrun altool — verbose)
        env:
          API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls ios/App/build/*.ipa | head -n 1)
          echo "Uploading: $IPA_PATH"
          xcrun altool \
            --upload-app \
            --verbose \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Save IPA as artifact (fallback so you can side-load if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: ios/App/build/*.ipa
          if-no-files-found: warn
