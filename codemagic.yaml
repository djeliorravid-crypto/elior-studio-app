workflows:
  ios-testflight:
    name: iOS TestFlight (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GitHub CI Admin
    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ravidstudio.app"
      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Stage web assets into www/
        script: |
          mkdir -p www
          for f in index.html contract.html proposal.html workshop.html sw.js _headers manifest.json version.txt icon-source.svg icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" "www/$f"
          done
          [ -d ios-icons ] && cp -R ios-icons www/ios-icons || true

      - name: Add Capacitor iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Install custom AppDelegate.swift (quick-action support)
        # Replace the Capacitor-generated AppDelegate with our version
        # that handles cold-launch + warm-launch quick action shortcuts.
        # Also fixes the Capacitor 8 `continue userActivity:` API drop.
        script: |
          cp ios-plugin/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Patch Info.plist — Face ID + compliance + quick actions
        # 1) NSFaceIDUsageDescription — Face ID prompt copy.
        # 2) ITSAppUsesNonExemptEncryption=false — pre-answers Apple's
        #    "does your app use encryption?" question. Without it,
        #    every TestFlight build sits in "Missing Compliance" until
        #    someone answers in App Store Connect.
        # 3) UIApplicationShortcutItems — the three home-screen
        #    long-press quick actions (income / task / schedule). The
        #    user info dict carries a "type" reverse-DNS string that
        #    AppDelegate forwards to JS so the matching modal opens.
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSFaceIDUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'אנו משתמשים ב-Face ID כדי לפתוח את האפליקציה במהירות ובאופן מאובטח'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # Calendar access — needed by IosCalendarBridgePlugin so the
          # schedule view can mirror writes to the user's iOS Calendar
          # (which iOS auto-syncs to Google in the background).
          /usr/libexec/PlistBuddy -c "Delete :NSCalendarsFullAccessUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsFullAccessUsageDescription string 'אנו משתמשים ביומן כדי לסנכרן פעילויות מהלוז היומי ל-Apple Calendar שלך, וממנו ל-Google Calendar אם הוא מחובר.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCalendarsUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsUsageDescription string 'אנו משתמשים ביומן כדי לסנכרן פעילויות מהלוז היומי ל-Apple Calendar שלך, וממנו ל-Google Calendar אם הוא מחובר.'" "$PLIST"
          # Quick actions — rebuild from scratch so the array stays in sync.
          /usr/libexec/PlistBuddy -c "Delete :UIApplicationShortcutItems" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems array" "$PLIST"
          # Item 0 — Add Income
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0:UIApplicationShortcutItemType string 'com.ravidstudio.app.add-income'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0:UIApplicationShortcutItemTitle string 'הוסף הכנסה'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0:UIApplicationShortcutItemIconSymbolName string 'plus.circle.fill'" "$PLIST"
          # Item 1 — Add Task
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:1 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:1:UIApplicationShortcutItemType string 'com.ravidstudio.app.add-task'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:1:UIApplicationShortcutItemTitle string 'הוסף משימה'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:1:UIApplicationShortcutItemIconSymbolName string 'checkmark.circle.fill'" "$PLIST"
          # Item 2 — Add Schedule Item
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:2 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:2:UIApplicationShortcutItemType string 'com.ravidstudio.app.add-schedule'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:2:UIApplicationShortcutItemTitle string 'הוסף לוז'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:2:UIApplicationShortcutItemIconSymbolName string 'calendar.badge.plus'" "$PLIST"
          # Custom URL scheme — the OAuth callback page at
          # djeliorravid-crypto.github.io/elior-studio-app/oauth-callback.html
          # redirects to ravidstudio://oauth?code=… so the app reopens
          # automatically with the auth code in hand.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string 'com.ravidstudio.app'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string 'ravidstudio'" "$PLIST"

      - name: Install Ravid Studio app icon
        # `cap add ios` ships a Capacitor placeholder AppIcon set. Copy
        # our pre-rendered iPhone sizes AND generate iPad sizes from
        # icon-1024.png so the bundle satisfies Apple's full set
        # (rejected at upload time otherwise: "Missing required icon
        # file ... 152x152 pixels").
        script: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          # iPhone (from pre-rendered ios-icons/)
          cp ios-icons/icon-40.png   "$ICONSET/AppIcon-20@2x.png"
          cp ios-icons/icon-60.png   "$ICONSET/AppIcon-20@3x.png"
          cp ios-icons/icon-58.png   "$ICONSET/AppIcon-29@2x.png"
          cp ios-icons/icon-87.png   "$ICONSET/AppIcon-29@3x.png"
          cp ios-icons/icon-80.png   "$ICONSET/AppIcon-40@2x.png"
          cp ios-icons/icon-120.png  "$ICONSET/AppIcon-40@3x.png"
          cp ios-icons/icon-120.png  "$ICONSET/AppIcon-60@2x.png"
          cp ios-icons/icon-180.png  "$ICONSET/AppIcon-60@3x.png"
          cp ios-icons/icon-1024.png "$ICONSET/AppIcon-1024.png"
          # iPad (sips-resize from the 1024 master)
          sips -z 40   40   ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-20@2x.png"   >/dev/null
          sips -z 58   58   ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-29@2x.png"   >/dev/null
          sips -z 80   80   ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-40@2x.png"   >/dev/null
          sips -z 152  152  ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-76@2x.png"   >/dev/null
          sips -z 167  167  ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-83.5@2x.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images" : [
              { "size" : "20x20",   "idiom" : "iphone", "filename" : "AppIcon-20@2x.png",  "scale" : "2x" },
              { "size" : "20x20",   "idiom" : "iphone", "filename" : "AppIcon-20@3x.png",  "scale" : "3x" },
              { "size" : "29x29",   "idiom" : "iphone", "filename" : "AppIcon-29@2x.png",  "scale" : "2x" },
              { "size" : "29x29",   "idiom" : "iphone", "filename" : "AppIcon-29@3x.png",  "scale" : "3x" },
              { "size" : "40x40",   "idiom" : "iphone", "filename" : "AppIcon-40@2x.png",  "scale" : "2x" },
              { "size" : "40x40",   "idiom" : "iphone", "filename" : "AppIcon-40@3x.png",  "scale" : "3x" },
              { "size" : "60x60",   "idiom" : "iphone", "filename" : "AppIcon-60@2x.png",  "scale" : "2x" },
              { "size" : "60x60",   "idiom" : "iphone", "filename" : "AppIcon-60@3x.png",  "scale" : "3x" },
              { "size" : "20x20",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-20@2x.png",   "scale" : "2x" },
              { "size" : "29x29",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-29@2x.png",   "scale" : "2x" },
              { "size" : "40x40",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-40@2x.png",   "scale" : "2x" },
              { "size" : "76x76",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-76@2x.png",   "scale" : "2x" },
              { "size" : "83.5x83.5","idiom" : "ipad",  "filename" : "AppIcon-iPad-83.5@2x.png", "scale" : "2x" },
              { "size" : "1024x1024", "idiom" : "ios-marketing", "filename" : "AppIcon-1024.png", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF
          ls "$ICONSET"

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Inject TaskWidget extension target + bridge plugin
        # Adds the home-screen widget target and the small Capacitor
        # bridge plugin (TaskWidgetBridge) into the generated Xcode
        # project. The script is idempotent — it bails out if the
        # target already exists from a previous build.
        #
        # Requires the App Group `group.com.ravidstudio.app` to exist
        # in App Store Connect AND to be enabled on both bundle IDs
        # (com.ravidstudio.app + com.ravidstudio.app.TaskWidget).
        # If you haven't set that up yet, the build will fail with
        # "Provisioning profile doesn't include com.apple.security
        # .application-groups entitlement".
        script: |
          gem list -i xcodeproj || gem install xcodeproj --no-document
          ruby ios-widget/inject-widget-target.rb \
            ios/App/App.xcodeproj \
            ios-widget/TaskWidget \
            ios-plugin/TaskWidgetBridge

      - name: Initialize keychain
        script: keychain initialize

      # Apple caps Distribution certs at 3 per team. Once we hit the
      # cap, fetch-signing-files --create fails with a 409 and the
      # whole build dies (the failure mode that brought the v332
      # build down). Pre-emptively revoke any existing iOS
      # distribution certs so --create always has room. Trade-off:
      # Apple emails "Your Certificate Has Been Revoked" per cert,
      # per build — annoying but not destructive, and the only
      # reliable way to keep Codemagic green.
      - name: Revoke existing distribution certs to free a slot
        script: |
          # Verbose, no-silent-fail revoke. The previous version piped
          # `--json` through python3 with 2>/dev/null on both stages,
          # so a wrong JSON shape or missing python3 looked like "no
          # certs to revoke" — which is exactly what the v333+ build
          # logs showed (cap still full, --create still 409s).
          #
          # New approach: ask app-store-connect itself to emit JSON
          # with `--json`, then grep the IDs out with a portable regex
          # — no python, no jq dependency. If list itself fails we
          # surface the error instead of swallowing it.
          set +e   # we want to inspect failures, not exit on the first
          echo "=== certs list (human-readable, for log) ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1 \
            | tee /tmp/_certs_human.txt
          echo ""
          echo "=== certs list (JSON, for parsing) ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>&1 \
            | tee /tmp/_certs.json
          # IDs in App Store Connect API are 10-char alphanumeric.
          # Extract every "id":"XXXXXXXXXX" pair from the JSON dump
          # (works regardless of whether the JSON is a bare array or
          # wrapped in {"data":[...]}, which is the failure mode the
          # python parser hit).
          IDS=$(grep -oE '"id"[[:space:]]*:[[:space:]]*"[A-Za-z0-9]{10}"' /tmp/_certs.json \
                  | grep -oE '"[A-Za-z0-9]{10}"$' \
                  | tr -d '"' \
                  | sort -u)
          if [ -z "$IDS" ]; then
            echo ">>> No existing distribution certs found — nothing to revoke."
          else
            echo ">>> Found certs to revoke:"
            echo "$IDS"
            for CID in $IDS; do
              echo ">>> Revoking $CID …"
              app-store-connect certificates delete "$CID" --yes 2>&1
              RC=$?
              echo ">>> delete exit code for $CID: $RC"
            done
            echo ""
            echo "=== certs list after revoke ==="
            app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1 | head -40
          fi
          # Always succeed — the create step below will surface any
          # remaining capacity problem with its own error.
          exit 0

      - name: Generate a private key for the new Distribution cert
        # fetch-signing-files --create needs a private key to upload
        # alongside the CSR — without it the API returns a cert that
        # has no matching key locally. Generate one fresh per run.
        script: |
          openssl genrsa -out /tmp/cert_private_key.pem 2048

      - name: Create distribution cert + App Store profile (main app)
        # --strict-match-identifier prevents the CLI from also matching
        # com.ravidstudio.app.TaskWidget (substring match would pick up
        # both bundles and fail with "ambiguous match").
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

      - name: Create App Store profile for the widget extension
        # The widget is a separate bundle and needs its own profile.
        # We reuse the same private key already uploaded for the
        # main cert (--create won't make a new cert if one exists).
        script: |
          app-store-connect fetch-signing-files "${BUNDLE_ID}.TaskWidget" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

      - name: Install certificates into keychain
        script: keychain add-certificates

      - name: Apply the provisioning profile to the Xcode project
        script: xcode-project use-profiles

      - name: Set build number (timestamp)
        # Timestamp guarantees a strictly-increasing build number
        # without needing the app to exist in App Store Connect yet.
        # agvtool updates the main App target's Info.plist, but the
        # widget extension lives at ios/TaskWidget/Info.plist and
        # agvtool doesn't touch it — so we also PlistBuddy-set the
        # widget's CFBundleVersion to the same value. Apple rejects
        # uploads where parent/extension bundle versions differ.
        script: |
          BUILD_NUMBER=$(date +%s)
          (cd ios/App && agvtool new-version -all "$BUILD_NUMBER")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/TaskWidget/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" ios/TaskWidget/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" ios/TaskWidget/Info.plist

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Skip beta-group assignment from CI — Codemagic gives up
        # polling for the uploaded build before Apple's processing
        # finishes, throwing a red "Did not find build matching
        # uploaded version" error even though the upload succeeded.
        # Internal testers see new builds automatically once Apple is
        # done processing, no submission needed.
        submit_to_testflight: false
