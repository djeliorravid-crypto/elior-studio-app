workflows:
  ios-testflight:
    name: iOS TestFlight (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GitHub CI Admin
    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ravidstudio.app"
      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Stage web assets into www/
        script: |
          mkdir -p www
          for f in index.html contract.html proposal.html workshop.html sw.js _headers manifest.json version.txt icon-source.svg icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" "www/$f"
          done
          [ -d ios-icons ] && cp -R ios-icons www/ios-icons || true

      - name: Add Capacitor iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Patch AppDelegate.swift for Capacitor 8 API
        # Capacitor 8 dropped the `continue userActivity:` overload of
        # ApplicationDelegateProxy.shared.application — stub the
        # universal-links method since we don't use it.
        script: |
          /usr/bin/sed -i '' \
            's|return ApplicationDelegateProxy\.shared\.application(application, continue: userActivity, restorationHandler: restorationHandler)|return false|' \
            ios/App/App/AppDelegate.swift

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Initialize keychain
        script: keychain initialize

      - name: Revoke orphaned Distribution certificates
        # Earlier GitHub Actions runs created Distribution certs whose
        # private keys lived in ephemeral runner keychains that no
        # longer exist. Revoke EVERY distribution cert (both old
        # "DISTRIBUTION" and new "IOS_DISTRIBUTION" type names) so
        # fetch-signing-files can create a fresh one with the private
        # key Codemagic generates and persists.
        script: |
          for TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            app-store-connect certificates list --type "$TYPE" --json 2>/dev/null \
              | python3 -c "import sys,json; data=json.load(sys.stdin); [print(c['id']) for c in data]" 2>/dev/null \
              | while read CERT_ID; do
                  [ -z "$CERT_ID" ] && continue
                  echo "Revoking $TYPE cert $CERT_ID"
                  app-store-connect certificates delete "$CERT_ID" || true
                done
          done

      - name: Generate a private key for the new Distribution cert
        # fetch-signing-files --create needs a private key to upload
        # alongside the CSR — without it the API returns a cert that
        # has no matching key locally. Generate one fresh per run.
        script: |
          openssl genrsa -out /tmp/cert_private_key.pem 2048

      - name: Create distribution cert + App Store profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

      - name: Install certificates into keychain
        script: keychain add-certificates

      - name: Apply the provisioning profile to the Xcode project
        script: xcode-project use-profiles

      - name: Set build number (timestamp)
        # Timestamp guarantees a strictly-increasing build number
        # without needing the app to exist in App Store Connect yet.
        script: |
          cd ios/App
          BUILD_NUMBER=$(date +%s)
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
