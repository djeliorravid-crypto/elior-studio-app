workflows:
  ios-testflight:
    name: iOS TestFlight (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GitHub CI Admin
    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ravidstudio.app"
      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Stage web assets into www/
        script: |
          mkdir -p www
          for f in index.html contract.html proposal.html workshop.html sw.js _headers manifest.json version.txt icon-source.svg icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" "www/$f"
          done
          [ -d ios-icons ] && cp -R ios-icons www/ios-icons || true

      - name: Add Capacitor iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Patch AppDelegate.swift for Capacitor 8 API
        # Capacitor 8 dropped the `continue userActivity:` overload of
        # ApplicationDelegateProxy.shared.application — stub the
        # universal-links method since we don't use it.
        script: |
          /usr/bin/sed -i '' \
            's|return ApplicationDelegateProxy\.shared\.application(application, continue: userActivity, restorationHandler: restorationHandler)|return false|' \
            ios/App/App/AppDelegate.swift

      - name: Patch Info.plist with NSFaceIDUsageDescription
        # The biometric-auth plugin refuses to call LAContext on iOS if
        # NSFaceIDUsageDescription is missing — and Apple rejects the
        # IPA at upload time. Inject the Hebrew reason string here so
        # the prompt the user sees is in their language.
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSFaceIDUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'אנו משתמשים ב-Face ID כדי לפתוח את האפליקציה במהירות ובאופן מאובטח'" "$PLIST"

      - name: Install Ravid Studio app icon
        # `cap add ios` ships a Capacitor placeholder AppIcon set. Copy
        # our pre-rendered iPhone sizes AND generate iPad sizes from
        # icon-1024.png so the bundle satisfies Apple's full set
        # (rejected at upload time otherwise: "Missing required icon
        # file ... 152x152 pixels").
        script: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          # iPhone (from pre-rendered ios-icons/)
          cp ios-icons/icon-40.png   "$ICONSET/AppIcon-20@2x.png"
          cp ios-icons/icon-60.png   "$ICONSET/AppIcon-20@3x.png"
          cp ios-icons/icon-58.png   "$ICONSET/AppIcon-29@2x.png"
          cp ios-icons/icon-87.png   "$ICONSET/AppIcon-29@3x.png"
          cp ios-icons/icon-80.png   "$ICONSET/AppIcon-40@2x.png"
          cp ios-icons/icon-120.png  "$ICONSET/AppIcon-40@3x.png"
          cp ios-icons/icon-120.png  "$ICONSET/AppIcon-60@2x.png"
          cp ios-icons/icon-180.png  "$ICONSET/AppIcon-60@3x.png"
          cp ios-icons/icon-1024.png "$ICONSET/AppIcon-1024.png"
          # iPad (sips-resize from the 1024 master)
          sips -z 40   40   ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-20@2x.png"   >/dev/null
          sips -z 58   58   ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-29@2x.png"   >/dev/null
          sips -z 80   80   ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-40@2x.png"   >/dev/null
          sips -z 152  152  ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-76@2x.png"   >/dev/null
          sips -z 167  167  ios-icons/icon-1024.png --out "$ICONSET/AppIcon-iPad-83.5@2x.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images" : [
              { "size" : "20x20",   "idiom" : "iphone", "filename" : "AppIcon-20@2x.png",  "scale" : "2x" },
              { "size" : "20x20",   "idiom" : "iphone", "filename" : "AppIcon-20@3x.png",  "scale" : "3x" },
              { "size" : "29x29",   "idiom" : "iphone", "filename" : "AppIcon-29@2x.png",  "scale" : "2x" },
              { "size" : "29x29",   "idiom" : "iphone", "filename" : "AppIcon-29@3x.png",  "scale" : "3x" },
              { "size" : "40x40",   "idiom" : "iphone", "filename" : "AppIcon-40@2x.png",  "scale" : "2x" },
              { "size" : "40x40",   "idiom" : "iphone", "filename" : "AppIcon-40@3x.png",  "scale" : "3x" },
              { "size" : "60x60",   "idiom" : "iphone", "filename" : "AppIcon-60@2x.png",  "scale" : "2x" },
              { "size" : "60x60",   "idiom" : "iphone", "filename" : "AppIcon-60@3x.png",  "scale" : "3x" },
              { "size" : "20x20",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-20@2x.png",   "scale" : "2x" },
              { "size" : "29x29",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-29@2x.png",   "scale" : "2x" },
              { "size" : "40x40",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-40@2x.png",   "scale" : "2x" },
              { "size" : "76x76",   "idiom" : "ipad",   "filename" : "AppIcon-iPad-76@2x.png",   "scale" : "2x" },
              { "size" : "83.5x83.5","idiom" : "ipad",  "filename" : "AppIcon-iPad-83.5@2x.png", "scale" : "2x" },
              { "size" : "1024x1024", "idiom" : "ios-marketing", "filename" : "AppIcon-1024.png", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF
          ls "$ICONSET"

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Inject TaskWidget extension target + bridge plugin
        # Adds the home-screen widget target and the small Capacitor
        # bridge plugin (TaskWidgetBridge) into the generated Xcode
        # project. The script is idempotent — it bails out if the
        # target already exists from a previous build.
        #
        # Requires the App Group `group.com.ravidstudio.app` to exist
        # in App Store Connect AND to be enabled on both bundle IDs
        # (com.ravidstudio.app + com.ravidstudio.app.TaskWidget).
        # If you haven't set that up yet, the build will fail with
        # "Provisioning profile doesn't include com.apple.security
        # .application-groups entitlement".
        script: |
          gem list -i xcodeproj || gem install xcodeproj --no-document
          ruby ios-widget/inject-widget-target.rb \
            ios/App/App.xcodeproj \
            ios-widget/TaskWidget \
            ios-plugin/TaskWidgetBridge

      - name: Initialize keychain
        script: keychain initialize

      # NOTE: We used to revoke all distribution certs at the start of
      # every build. That worked, but Apple emails the account holder
      # ("Your Certificate Has Been Revoked") on every single revoke,
      # which is annoying when builds run frequently. Skip the routine
      # revoke — Codemagic will reuse the cert when it can, and only if
      # the per-team cap is hit do we revoke (manually below). This
      # trades silent CI for a once-in-a-while manual cleanup.

      - name: Generate a private key for the new Distribution cert
        # fetch-signing-files --create needs a private key to upload
        # alongside the CSR — without it the API returns a cert that
        # has no matching key locally. Generate one fresh per run.
        script: |
          openssl genrsa -out /tmp/cert_private_key.pem 2048

      - name: Create distribution cert + App Store profile (main app)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

      - name: Create App Store profile for the widget extension
        # The widget is a separate bundle and needs its own profile.
        # We reuse the same private key already uploaded for the
        # main cert (--create won't make a new cert if one exists).
        script: |
          app-store-connect fetch-signing-files "${BUNDLE_ID}.TaskWidget" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem

      - name: Install certificates into keychain
        script: keychain add-certificates

      - name: Apply the provisioning profile to the Xcode project
        script: xcode-project use-profiles

      - name: Set build number (timestamp)
        # Timestamp guarantees a strictly-increasing build number
        # without needing the app to exist in App Store Connect yet.
        script: |
          cd ios/App
          BUILD_NUMBER=$(date +%s)
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Skip beta-group assignment from CI — Codemagic gives up
        # polling for the uploaded build before Apple's processing
        # finishes, throwing a red "Did not find build matching
        # uploaded version" error even though the upload succeeded.
        # Internal testers see new builds automatically once Apple is
        # done processing, no submission needed.
        submit_to_testflight: false
